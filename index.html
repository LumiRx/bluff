/* ══════════ SIGNING IN ══════════

   Deliberately not a wall. You can play, set a word, win the daily and take a
   handle without ever typing a number — Apple 5.1.1 would take a dim view of a
   word game that demanded personal information at the door, and so would every
   player who bounced off it. What signing in buys is the thing a device token
   can never buy: your record surviving the phone, and other people being able
   to find you.

   It becomes required at exactly one moment — buying something — because a
   purchase has to belong to somebody or a refund has nowhere to go.

   The server side of all this is in server/src/accounts.js and is proven by
   `node auth.js`: the number is hashed under a secret and never stored, the
   code is hashed too, and a copy of the database is not a credential. */

let SIGNIN={phone:"",last4:"",tries:0,sentAt:0};

function screenSignIn(why){
  ovShow("<h2>KEEP YOUR RECORD</h2>"
   +"<p>Your handle, rating and record live on this device and nowhere else. Lose the "
   +"phone and they are gone — there is nothing that could prove they were yours.</p>"
   +"<p class='fine'>"+(why||"Add a number and they follow you instead. It is also how "
     +"people you know find you at a table.")+"</p>"
   +"<div class='row'><input id='sgPh' type='tel' inputmode='tel' autocomplete='tel' "
     +"placeholder='+1 415 555 0142' value='"+(SIGNIN.phone||"")+"'></div>"
   +"<p class='fine' id='sgPhErr'></p>"
   +"<div class='row'><button class='btn go' id='sgPhGo'>SEND ME A CODE</button></div>"
   +"<p class='fine'>We text you a six-digit code. We never store the number itself — "
   +"only a one-way hash of it — and we will never ask you for the code.</p>"
   +"<div class='row'><button class='btn alt' id='sgPhBack'>NOT NOW</button></div>",true);
  const go=async()=>{
    const v=$("sgPh").value.trim();
    if(!/^\+[1-9][0-9\s().-]{7,}$/.test(v))
      return $("sgPhErr").textContent="Start with + and your country code, like +1 415 555 0142.";
    $("sgPhErr").textContent="";
    const b=$("sgPhGo");b.disabled=true;b.textContent="SENDING…";
    const r=await apiCall("/v1/auth/start",{method:"POST",
      body:JSON.stringify({phone:v.replace(/[\s().-]/g,"")})},12000);
    b.disabled=false;b.textContent="SEND ME A CODE";
    if(!r.ok||!r.body||!r.body.ok)
      return $("sgPhErr").textContent=(r.body&&r.body.error)||"could not reach us just now";
    SIGNIN={phone:v.replace(/[\s().-]/g,""),last4:r.body.last4,tries:0,sentAt:Date.now(),
            dev:r.body.dev,sent:r.body.sent};
    screenCode();
  };
  $("sgPhGo").onclick=go;
  $("sgPh").onkeydown=e=>{if(e.key==="Enter")go();};
  $("sgPhBack").onclick=()=>screenHome();
}

function screenCode(){
  ovShow("<h2>CHECK YOUR PHONE</h2>"
   +"<p>Six digits, sent to the number ending <b>"+SIGNIN.last4+"</b>. It works for "
   +"ten minutes.</p>"
   +(SIGNIN.sent===false
     ?"<p class='fine warn'>Texting is not switched on in this build, so nothing was "
      +"actually sent"+(SIGNIN.dev?" — the code is <b>"+SIGNIN.dev+"</b>":"")+".</p>":"")
   +"<div class='row'><input id='sgCode' type='tel' inputmode='numeric' autocomplete='one-time-code' "
     +"maxlength='6' placeholder='000000' style='text-align:center;letter-spacing:.4em'></div>"
   +"<p class='fine' id='sgCodeErr'></p>"
   +"<div class='row'><button class='btn go' id='sgCodeGo'>SIGN IN</button></div>"
   +"<div class='row'><button class='btn alt' id='sgAgain'>SEND ANOTHER</button>"
   +"<button class='btn alt' id='sgCodeBack'>CHANGE NUMBER</button></div>",true);
  const go=async()=>{
    const c=$("sgCode").value.replace(/\D/g,"");
    if(c.length!==6)return $("sgCodeErr").textContent="Six digits.";
    $("sgCodeErr").textContent="";
    const b=$("sgCodeGo");b.disabled=true;b.textContent="CHECKING…";
    const r=await apiCall("/v1/auth/verify",{method:"POST",
      body:JSON.stringify({phone:SIGNIN.phone,code:c,device:deviceToken()})},12000);
    b.disabled=false;b.textContent="SIGN IN";
    if(!r.ok||!r.body||!r.body.ok)
      return $("sgCodeErr").textContent=(r.body&&r.body.error)||"could not reach us just now";
    setSession(r.body.session);
    P.acct=r.body.account;P.last4=r.body.last4||SIGNIN.last4;
    /* somebody signing in on a second phone should find their career waiting,
       not an empty one — the server holds the newer of the two */
    if(r.body.handle&&!P.handle)P.handle=r.body.handle;
    if(r.body.profile&&(r.body.rev||0)>0&&(!P.matches||r.body.profile.matches>=P.matches))
      Object.assign(P,r.body.profile);
    saveP();
    await Pay.collect();               /* anything bought and never collected */
    Snd.spark();
    toast(r.body.fresh?"signed in — your record is safe now":"welcome back",3000);
    screenHome();
  };
  $("sgCodeGo").onclick=go;
  $("sgCode").oninput=()=>{if($("sgCode").value.replace(/\D/g,"").length===6)go();};
  $("sgCode").focus();
  $("sgAgain").onclick=()=>screenSignIn("We will send another one.");
  $("sgCodeBack").onclick=()=>screenSignIn();
}

/* The account block on the profile. Deleting really deletes, from inside the
   app, because Apple requires that of anything that lets you make an account
   and because a promise about a phone number you cannot withdraw is not one. */
function accountRows(){
  if(!SESSION)
    return "<div class='row'><button class='btn alt' id='psign'>KEEP YOUR RECORD"
      +"<small>add a number so it survives this phone</small></button></div>";
  return "<p class='fine'>Signed in on the number ending <b>"+(P.last4||"••••")
    +"</b>. Your record follows you to any phone you sign in on.</p>"
    +"<div class='row'><button class='btn alt' id='pout'>SIGN OUT</button>"
    +"<button class='btn dan' id='pdel'>DELETE ACCOUNT</button></div>";
}
function wireAccount(){
  if($("psign"))$("psign").onclick=()=>screenSignIn();
  if($("pout"))$("pout").onclick=()=>{
    setSession("");P.acct=null;saveP();
    toast("signed out — this device keeps what it has",2800);screenProfile();
  };
  if($("pdel"))$("pdel").onclick=()=>{
    ovShow("<h2>DELETE ACCOUNT</h2>"
     +"<p>This erases the account on our side: the number, the record we hold, and your "
     +"claim on the handle <b>"+(P.handle||"")+"</b>, which goes back on the shelf for "
     +"somebody else. It cannot be undone and we cannot get it back for you.</p>"
     +"<p class='fine'>What is on this phone stays on this phone until you reset the career.</p>"
     +"<div class='row'><button class='btn dan' id='delYes'>DELETE IT</button></div>"
     +"<div class='row'><button class='btn go' id='delNo'>KEEP MY ACCOUNT</button></div>",true);
    $("delNo").onclick=()=>screenProfile();
    $("delYes").onclick=async()=>{
      const b=$("delYes");b.disabled=true;b.textContent="DELETING…";
      const r=await apiCall("/v1/account/delete",{method:"POST",body:"{}"},12000);
      if(!r.ok||!r.body||!r.body.ok){
        b.disabled=false;b.textContent="DELETE IT";
        return toast((r.body&&r.body.error)||"could not reach us — nothing was deleted",3400);
      }
      setSession("");P.acct=null;P.last4=null;saveP();
      toast("account deleted",3000);screenProfile();
    };
  };
}

function screenHandle(){
  ovShow("<h1>BLUFF</h1>"
   +"<p style='letter-spacing:.1em;font-size:11px;margin-top:2px'>PICK A WORD. CLAIM THEY CANNOT GET IT.</p>"
   +"<div class='ex'><i class='h'>W</i><i></i><i></i><i></i><i class='h'>H</i></div>"
   +"<p>Six seats, six hands, the button rotates. On your hand you choose a secret word, give the "
   +"table <b>one clue</b>, and set the difficulty. Anyone who calls gets four guesses and beats "
   +"you by cracking it in the first three — "
   +"<b>miss and you take their stars, crack it and they take yours.</b></p>"
   +"<p>Everything you do from here goes on your record.</p>"
   +"<input id='hnd' maxlength='9' placeholder='PICK A HANDLE' autocomplete='off'>"
   +"<p class='fine' id='hnote'>This is the name on the board, and it is yours once you take "
   +"it. No email, no password \u2014 it lives on this device.</p>"
   +"<div id='fpick'>"+facePicker(P.crest)+"</div>"
   +"<div class='row'><button class='btn' id='go2'>TAKE A SEAT</button></div>",true);
  wireFaces(f=>{P.crest=f;});
  const i=$("hnd");i.focus();
  i.oninput=()=>{i.value=i.value.toUpperCase().replace(/[^A-Z0-9]/g,"");const fp=$("fpick");if(fp){fp.innerHTML=facePicker(P.crest,i.value);wireFaces(f=>{P.crest=f;});}};
  i.onkeydown=e=>{if(e.key==="Enter")$("go2").click();};
  $("go2").onclick=async()=>{
    const v=i.value.trim();
    if(v.length<2)return toast("two characters or more");
    if(R.some(r=>r.name===v))return toast("a regular already uses that name");
    /* a handle goes on a public board, so it is checked before it can get there */
    if(!cleanText(v))return toast("pick a different handle",2600);
    const btn=$("go2");btn.disabled=true;btn.textContent="CLAIMING\u2026";
    const r=await claimHandle(v);
    btn.disabled=false;btn.textContent="TAKE A SEAT";
    if(r&&r.taken){
      /* somebody has it. Offer names they can actually have rather than
         sending them away to guess again. */
      const alts=(r.suggest||[]).map(a=>"<button class='alt2' data-a='"+a+"'>"+a+"</button>").join("");
      const note=$("hnote");
      if(note)note.innerHTML="<b>"+v+"</b> is taken."+(alts?" Try "+alts:" Pick another.");
      [...document.querySelectorAll(".alt2")].forEach(b=>b.onclick=()=>{
        i.value=b.dataset.a;$("go2").click();});
      return;
    }
    /* offline: take the name locally and claim it on the next launch. Being
       unable to reach us must never be the reason somebody cannot start. */
    P.handle=v;P.claimed=!!(r&&r.ok);saveP();
    screenHome();
  };
}

function screenProfile(){
  const crack=P.called?Math.round(100*P.cracked/P.called):0;
  const held=P.setHands?Math.round(100*P.setHeld/P.setHands):0;
  const read=P.foldsJudged?Math.round(100*P.goodFolds/P.foldsJudged):0;
  const row=(a,b,c)=>"<tr><td>"+a+"</td><td class='d'>"+(c||"")+"</td><td>"+b+"</td></tr>";
  ovShow(
   "<div class='hrow'>"+avatarOf(P.handle)+"<div class='hwho'><b>"+P.handle+"</b>"
   +badge(P.rating)+"<em>at the table since "+prettyDate(P.made)+"</em></div></div>"
   +"<div class='sgrid'>"
     +"<div class='sc'><b>"+P.rating+"</b><span>RATING</span></div>"
     +"<div class='sc'><b>"+P.bankroll.toLocaleString()+"</b><span>STARS</span></div>"
     +"<div class='sc'><b>"+P.w+"–"+P.l+"</b><span>RECORD</span></div>"
   +"</div>"
   +"<div class='sect'>THE TABLE</div><table class='lb'>"
   +row("Matches",P.matches)
   +row("Won outright",P.firsts,P.matches?Math.round(100*P.firsts/P.matches)+"%":"")
   +row("Best streak",P.bestStreak,"current "+P.streak)
   +row("Peak rating",P.peakRating,"most stars held "+P.peakBank.toLocaleString())
   +(P.busts?row("Busted","<span style='color:#c96a57'>"+P.busts+"</span>","rebought"):"")
   +"</table>"
   +"<div class='sect'>WHEN YOU SET</div><table class='lb'>"
   +row("Hands set",P.setHands)
   +row("Held it",P.setHeld,held+"% of the time")
   +row("Scared them off",P.setNoTakers,"nobody called")
   +row("Stars taken",(P.setChips>=0?"+":"")+P.setChips)
   +"</table>"
   +"<div class='sect'>WHEN THEY SET</div><table class='lb'>"
   +row("Called",P.called)
   +row("Beat the setter",P.cracked,crack+"% of the time")
   +(P.late?row("Got it on the free swing",P.late,"solved, but too late to pay"):"")
   +row("Folded",P.foldedN,read+"% good laydowns")
   +row("Stars taken",(P.callChips>=0?"+":"")+P.callChips)
   +"</table>"
   +(P.bestBluff?"<div class='sect'>BEST BLUFF</div><div class='hl'><b>"+P.bestBluff.word+"</b>"
     +"<span>"+P.bestBluff.rate+"% card · "+P.bestBluff.callers+" called · nobody cracked it</span>"
     +"<u>+"+P.bestBluff.take+"</u></div>":"")
   +(P.bigHand?"<div class='sect'>BIGGEST HAND</div><div class='hl'><b>"+P.bigHand.word+"</b>"
     +"<span>"+P.bigHand.rate+"% card · "+P.bigHand.callers+" called</span>"
     +"<u>+"+P.bigHand.take+"</u></div>":"")
   +seatAskCard(true)
   +"<div class='sect'>YOUR CREST</div>"+facePicker(P.crest)
   +(CASH?"<div class='sect'>REGION</div>"
     +"<button class='cstrip' id='pgeo'><b>"+ico("globe")+" "+regionName().toUpperCase()+"</b>"
     +"<span>"+(cashEligible()?"eligible for cash prizes":"stars only")+"</span>"
     +"<u>\u203A</u></button>":"")
   +"<div class='sect'>SOUND</div>"
   +"<button class='toggle"+(P.mute?"":" on")+"' id='psnd'><b>"
   +(P.mute?"OFF":"ON")+"</b><span>letters turning, and stars landing</span>"
   +"<i></i></button>"
   +"<button class='toggle"+(P.noMusic||P.mute?"":" on")+"' id='pmus'><b>"
   +(P.noMusic?"OFF":"ON")+"</b><span>the background track</span><i></i></button>"
   +"<button class='toggle"+(P.quiet?"":" on")+"' id='ptalk'><b>"
   +(P.quiet?"OFF":"ON")+"</b><span>table talk \u2014 the regulars talk back</span><i></i></button>"
   +"<button class='toggle"+(P.marks!==false?" on":"")+"' id='pmk'><b>"
   +(P.marks!==false?"ON":"OFF")+"</b><span>shapes on the tiles as well as colour</span>"
   +"<i></i></button>"
   +"<div class='trk'>"
   +[{id:"auto",n:"SHUFFLE"}].concat(Mus.TRACKS).map(t=>
      "<button class='tb"+(((P.track||"auto")===t.id)?" on":"")+"' data-t='"+t.id+"'>"
      +t.n+(t.mood==="hype"?"<u>drop</u>":t.id==="auto"?"<u>rotates</u>":"<u>"+t.bpm+" bpm</u>")
      +"</button>").join("")+"</div>"
   +"<div class='row'><button class='btn alt' id='prls'>OFFICIAL RULES</button>"
   +"<button class='btn alt' id='prp'>PLAYING WELL</button></div>"
   +"<div class='row'><button class='btn alt' id='ppriv'>PRIVACY</button></div>"
   +accountRows()
   +"<div class='row'><button class='btn alt' id='wipe'>RESET CAREER</button>"
   +"<button class='btn' id='bk'>BACK</button></div>",true);
  wireFaces(f=>{P.crest=f;saveP();applyCosmetics();});
  wireSeatAsk();
  if($("pgeo"))$("pgeo").onclick=()=>screenGate(true);
  $("prls").onclick=()=>screenLegal("rules",screenProfile);
  $("prp").onclick=()=>screenLegal("play",screenProfile);
  $("ppriv").onclick=()=>screenLegal("privacy",screenProfile);
  $("psnd").onclick=function(){
    P.mute=!P.mute;saveP();paintSnd();Mus.sync();
    this.classList.toggle("on",!P.mute);
    this.querySelector("b").textContent=P.mute?"OFF":"ON";
    if(!P.mute)Snd.stars(600);
  };
  if($("ptalk"))$("ptalk").onclick=function(){
    P.quiet=!P.quiet;saveP();
    this.classList.toggle("on",!P.quiet);
    this.querySelector("b").textContent=P.quiet?"OFF":"ON";
  };
  $("pmk").onclick=function(){
    P.marks=(P.marks===false);saveP();applyMarks();
    this.classList.toggle("on",P.marks!==false);
    this.querySelector("b").textContent=P.marks!==false?"ON":"OFF";
  };
  $("pmus").onclick=function(){
    P.noMusic=!P.noMusic;saveP();Mus.sync();
    this.classList.toggle("on",!P.noMusic);
    this.querySelector("b").textContent=P.noMusic?"OFF":"ON";
  };
  [...document.querySelectorAll(".tb")].forEach(b=>b.onclick=()=>{
    P.track=b.dataset.t;P.noMusic=false;saveP();
    [...document.querySelectorAll(".tb")].forEach(x=>x.classList.toggle("on",x===b));
    document.getElementById("pmus").classList.add("on");
    document.getElementById("pmus").querySelector("b").textContent="ON";
    Mus.forced=null;Mus.track=null;Mus.stop();setTimeout(()=>Mus.start(),320);
  });
  $("bk").onclick=screenHome;
  wireAccount();
  $("wipe").onclick=function(){
    if(this.dataset.armed){const h=P.handle;P=blankProfile();P.handle=h;R=blankRivals();
      saveP();saveR();toast("career wiped");screenHome();return;}
    this.dataset.armed="1";this.textContent="TAP AGAIN TO WIPE";this.classList.add("dan");
  };
}

function screenBoard(tab){
  const t=tab||"ladder";
  let body="",unit="",note="",extra="";
  if(t==="ladder"){
    const all=R.map(r=>({name:r.name,rating:r.rating,bank:r.bank,w:r.w,l:r.l,note:r.note}))
      .concat([{name:P.handle,rating:P.rating,bank:P.bankroll,w:P.w,l:P.l,you:true,
                note:"that is you"}])
      .sort((a,b)=>b.rating-a.rating);
    body=all.map((r,i)=>ladderRow(r,i)).join("");
    unit="RATING";
    note="Regulars carry their own rating and record. You are seated a little above your own "
        +"rating \u2014 that is where a game stays worth playing \u2014 with one seat at or below "
        +"you, and nobody more than "+SEAT_CAP+" points clear. Climbing puts you in tougher games.";
  }else if(t==="friends"){
    const fb=friendsBoard();
    body=fb.map((r,i)=>lrow({i:i,name:r.name,you:r.you,tap:r.you?null:r.name,
      val:r.score==null?"—":r.score,
      sub:r.you?(r.score==null?"you have not played today":"that is you")
               :"tap to challenge"})).join("");
    unit="SCORE";
    extra="<div class='row'><button class='btn' id='addf'>ADD A FRIEND</button></div>";
    note=(P.friends||[]).length
      ?"Your friends are ranked on the same six deals you play, and these are their real scores "
       +"for today — a dash means they have not played yet. Tap anyone to call them out."
      :"Nobody here yet. Add the handles of the people you play with and they show up on this "
       +"board every day, on the same deals you are playing.";
  }else{
    /* the real board if the server answered, the offline one otherwise — and it
       always says which, because a board that pays money and a board that is a
       pacing device must never look like the same object */
    const live=LIVE&&LIVE.day===todayKey()?LIVE:null;
    body=(live?live.rows:dailyBoard()).map((r,i)=>boardRow(r,i,!!live)).join("");
    if(!dailyDone())body+=pendingRow();
    unit="SCORE";
    note=(live
      ?"Live board — "+live.players+" "+(live.players===1?"run":"runs")+" in so far today, and "
       +"every one of them re-scored on our side from the decisions that produced it. "
      :"These are the <b>house regulars</b> \u2014 characters, not people \u2014 playing today's "
       +"deals, shown because we could not reach the live board just now. Your own run is still "
       +"recorded and goes up as soon as we can reach it. ")
      +"Everyone gets the same six deals until midnight, so this ranks pure decision quality — "
      +"what you cracked, what you held, and what you were right to refuse. Stars do not enter "
      +"into it.";
    /* fetch in the background and redraw once, rather than making the tab wait */
    if(!live)liveBoard().then(r=>{if(r&&$("t2")&&$("t2").classList.contains("on"))screenBoard("daily");});
  }
  ovShow("<h2>"+(t==="ladder"?"THE LADDER":t==="friends"?"FRIENDS":"TODAY&rsquo;S TABLE")+"</h2>"
   +"<div class='tabs'><button class='"+(t==="ladder"?"on":"")+"' id='t1'>LADDER</button>"
   +"<button class='"+(t==="daily"?"on":"")+"' id='t2'>DAILY</button>"
   +"<button class='"+(t==="friends"?"on":"")+"' id='t3'>FRIENDS</button></div>"
   +bhead(t==="ladder"?"ALL PLAYERS":t==="friends"?"YOU AND YOURS":prettyDate(todayKey()),unit)
   +"<div class='board'>"+body+"</div>"
   +extra
   +"<p class='fine'>"+note+"</p>"
   +"<div class='row'><button class='btn alt' id='bk'>BACK</button></div>",true);
  $("t1").onclick=()=>screenBoard("ladder");
  $("t2").onclick=()=>screenBoard("daily");
  $("t3").onclick=()=>screenBoard("friends");
  if($("addf"))$("addf").onclick=screenFriends;
  [...document.querySelectorAll(".lrow.tap")].forEach(el=>{
    el.onclick=()=>screenDuel(el.dataset.h);
  });
  $("bk").onclick=screenHome;
}

function screenShare(){
  const txt=shareText();
  ovShow("<h2>SHARE THE SESSION</h2>"
   +"<div class='card'>"+txt.split("\n").map((l,i)=>
      "<div class='cl"+(i===1?" big":"")+"'>"+l+"</div>").join("")+"</div>"
   +"<div class='row'><button class='btn' id='cp'>"+(canShare()?"SHARE":"COPY")+"</button></div>"
   +"<div class='row'><button class='btn alt' id='bk'>BACK</button></div>"
   +"<p class='fine'>The strip is the session hand by hand. "+SYM.held+" is a word you set that "
   +"nobody cracked — the one worth bragging about.</p>",true);
  $("cp").onclick=()=>shareOut(txt,SITE,"strip","copied");
  $("bk").onclick=()=>screenSummary(true);
}

/* Shapes as well as colour, on unless somebody turns them off. */
function applyMarks(){document.documentElement.classList.toggle("marks",P.marks!==false);}
applyCosmetics();applyMarks();
/* a run that could not be delivered last time goes up now, before anything else
   asks the board a question */
setTimeout(()=>{flushDaily().catch(()=>{});catchUp().catch(()=>{});},1200);
/* installed apps get no browser chrome, so the page must stop behaving like one */
if(matchMedia("(display-mode: standalone)").matches||navigator.standalone)
  document.documentElement.classList.add("standalone");
if("serviceWorker" in navigator&&location.protocol!=="file:")
  addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
/* a double-tap must not zoom the board out from under someone mid-guess */
(function(){let t=0;addEventListener("touchend",e=>{
  const n=Date.now();if(n-t<320)e.preventDefault();t=n;},{passive:false});})();

(function(){
  const c=codeFromUrl();
  if(!P.agreed)return screenGate();
  if(c&&P.handle){S.lastCode=c;screenJoin(c);}
  else screenHome();
})();
</script>
