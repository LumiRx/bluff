function sealIfDue(){
  const c=P.chest;
  if(c.open&&chestMsLeft()<=0)return sealChest("window");
  return null;
}
function creditChest(place){
  if(place<1||place>3)return null;
  sealIfDue();
  const amt=PRIZE.daily[place-1],c=P.chest;
  c.open+=amt;
  c.lastWin=todayKey();c.streak++;
  if(c.streak>c.best)c.best=c.streak;
  c.lifetime=(c.lifetime||0)+amt;
  const full=c.open>=PRIZE.cap;
  if(full){
    /* seal exactly the cap and carry the rest into the next chest -- an
       overflow must never quietly disappear */
    const over=c.open-PRIZE.cap;
    c.open=PRIZE.cap;
    sealChest("full");
    c.open=over;
  }
  saveP();
  return {amt:amt,place:place,full:full};
}

/* ══════════ THE DAILY TABLE ══════════ */
/* Same six deals for everyone, everywhere, until midnight. */
function dailyDone(){return P.daily.last===todayKey();}

/* ── talking to the daily server ──
   The game does not send a score. It sends what the player decided, and the
   server works the score out for itself with the same engine. That is the whole
   reason a real board can carry real money: there is no number to forge.

   Everything here fails soft. A dead network must never cost somebody the run
   they just played, so an entry that cannot be delivered is kept and sent on the
   next launch, and the board falls back to the offline one. */
const API=(()=>{
  try{const o=localStorage.getItem("bluff.api");if(o)return o;}catch(e){}
  return "https://api.webluff.com";
})();
function deviceToken(){
  if(!P.device){
    const b=new Uint8Array(18);
    (self.crypto||{}).getRandomValues?crypto.getRandomValues(b)
      :b.forEach((_,i)=>b[i]=Math.floor(Math.random()*256));
    P.device=btoa(String.fromCharCode(...b)).replace(/\+/g,"-").replace(/\//g,"_").replace(/=/g,"");
    saveP();
  }
  return P.device;
}
/* The signed-in session, if there is one. It is the only credential the client
   holds and it goes in a header rather than a query string, so it never lands
   in a log line or a referrer. Absent means signed out, which is a perfectly
   good state — everything except your record following you still works. */
let SESSION=(()=>{try{return localStorage.getItem("bluff.session")||"";}catch(e){return "";}})();
function setSession(t){
  SESSION=t||"";
  try{t?localStorage.setItem("bluff.session",t):localStorage.removeItem("bluff.session");}
  catch(e){}
}
async function apiCall(path,opts,ms){
  /* if the browser already knows it is offline, say so now rather than making
     somebody watch a seven-second spinner arrive at the same answer */
  if(navigator.onLine===false)return {ok:false,status:0,body:{error:"offline"}};
  const c=new AbortController(),t=setTimeout(()=>c.abort(),ms||7000);
  try{
    const o=Object.assign({signal:c.signal},opts||{});
    o.headers=Object.assign({"Content-Type":"application/json"},o.headers||{});
    if(SESSION)o.headers.Authorization="Bearer "+SESSION;
    const r=await fetch(API+path,o);
    const j=await r.json().catch(()=>({}));
    return {ok:r.ok,status:r.status,body:j};
  }catch(e){return {ok:false,status:0,body:{error:String(e&&e.message||e)}};}
  finally{clearTimeout(t);}
}
/* Send one day's play. Returns the server's ranking, or null if it could not be
   delivered — in which case it is queued rather than lost. */
async function submitDaily(day,tape){
  const entry={day:day,device:deviceToken(),handle:P.handle||"YOU",
    decisions:tape,age18:!!P.ageOK,
    /* the numbers the trait badges are derived from. The server bounds every
       one of them and computes the badge itself — this is the input, not the
       verdict. */
    stats:{setHands:P.setHands,setHeld:P.setHeld,setNoTakers:P.setNoTakers,
      called:P.called,cracked:P.cracked,missed:P.missed,foldedN:P.foldedN,
      foldsJudged:P.foldsJudged,goodFolds:P.goodFolds,bigPot:P.bigPot,
      bestStreak:P.bestStreak,busts:P.busts}};
  const r=await apiCall("/v1/daily/submit",{method:"POST",
    headers:{"Content-Type":"application/json"},body:JSON.stringify(entry)});
  if(r.ok){
    P.daily.pending=null;P.daily.rejected=null;
    P.daily.rank=r.body.rank||null;P.daily.players=r.body.players||null;
    P.daily.server=r.body.score;P.daily.eligible=!!r.body.eligible;
    saveP();
    return r.body;
  }
  /* 4xx means the server will never accept it however many times we ask; only a
     network failure is worth keeping */
  if(r.status>=400&&r.status<500){P.daily.pending=null;P.daily.rejected=r.body.why||r.body.error;saveP();}
  else{P.daily.pending=entry;saveP();}
  return null;
}
/* ── push ──
   Registration only. The banner itself is sent by the server when somebody is
   actually challenged, so this asks for permission at the moment it means
   something rather than on first launch, which is the difference between an
   opt-in people accept and one they refuse.

   Web has no equivalent worth shipping: iOS Safari only allows it for an
   installed PWA and the plumbing is entirely separate, so this is a no-op
   until the Capacitor shell is what is running. */
async function registerPush(){
  const cap=window.Capacitor&&window.Capacitor.Plugins&&window.Capacitor.Plugins.PushNotifications;
  if(!cap||!P.handle||!P.claimed)return false;
  try{
    let perm=await cap.checkPermissions();
    if(perm.receive==="prompt"||perm.receive==="prompt-with-rationale")
      perm=await cap.requestPermissions();
    if(perm.receive!=="granted")return false;
    await cap.register();
    return true;
  }catch(e){return false;}
}
function wirePush(){
  const cap=window.Capacitor&&window.Capacitor.Plugins&&window.Capacitor.Plugins.PushNotifications;
  if(!cap)return;
  cap.addListener("registration",t=>{
    const tok=t&&(t.value||t.token);if(!tok||tok===P.push)return;
    P.push=tok;saveP();
    apiCall("/v1/player/push",{method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({device:deviceToken(),token:tok,
        platform:(window.Capacitor.getPlatform&&window.Capacitor.getPlatform())||"ios"})})
      .catch(()=>{});
  });
  /* tapping the banner should land on the table it is about, not the home
     screen — an invite that makes you go looking is barely an invite */
  cap.addListener("pushNotificationActionPerformed",a=>{
    const c=a&&a.notification&&a.notification.data&&a.notification.data.code;
    if(c)setTimeout(()=>startMatch("code",String(c).toUpperCase()),400);
  });
  cap.addListener("pushNotificationReceived",()=>{myInvites(true).then(paintInviteBadge);});
}

/* If a name was taken while offline, make it real now. And pick up anything
   waiting: a friend's score, an invite somebody sent overnight. */
async function catchUp(){
  if(P.handle&&!P.claimed){
    const r=await claimHandle(P.handle);
    if(r&&r.ok){P.claimed=true;saveP();}
    else if(r&&r.taken){
      /* rare, and it has to be said out loud rather than silently renaming
         somebody: they have been playing under a name that is now someone
         else's */
      P.claimed=false;saveP();
      toast(P.handle+" was claimed by someone else \u2014 pick a new name in your profile",5200);
    }
  }
  friendScores(true).catch(()=>{});
  const inv=await myInvites(true).catch(()=>null);
  if(inv&&inv.some(x=>!x.seen))paintInviteBadge();
  wirePush();
  /* ask only once somebody has a friend — permission requested before the
     feature means anything is permission refused */
  if((P.friends||[]).length&&!P.push)registerPush();
}

/* On launch, deliver anything the network ate last time. */
async function flushDaily(){
  const q=P.daily.pending;
  if(!q||q.day!==todayKey())
    {if(q&&q.day!==todayKey()){P.daily.pending=null;saveP();}return;}
  const r=await apiCall("/v1/daily/submit",{method:"POST",
    headers:{"Content-Type":"application/json"},body:JSON.stringify(q)});
  if(r.ok){P.daily.pending=null;P.daily.rank=r.body.rank||null;
    P.daily.players=r.body.players||null;P.daily.server=r.body.score;
    P.daily.eligible=!!r.body.eligible;saveP();
    toast("Your daily run reached the board — "+ordSuffix2(r.body.rank),3000);}
  else if(r.status>=400&&r.status<500){P.daily.pending=null;saveP();}
}
/* ── who somebody is ──
   The daily board never needed to know. Friends do: "add VIV" has to mean one
   particular person or the feature is a lie, so a handle is claimed by the
   first device to take it. That is still not an account — no email, no
   password, nothing to recover — and the cost is honest: lose the device and
   you lose the name, because nothing else could prove it was yours.

   Every call here fails soft. None of it is allowed to stand between somebody
   and a game of cards. */
let FSC={day:"",at:0,scores:{}};      /* friends' real scores, briefly cached */
let INV={day:"",at:0,list:[]};        /* invites waiting for me */

async function claimHandle(h){
  const r=await apiCall("/v1/player/claim",{method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({device:deviceToken(),handle:h})});
  if(!r.ok)return {ok:false,offline:true};
  return r.body;
}
async function lookupHandles(list){
  if(!list.length)return null;
  const r=await apiCall("/v1/player/lookup?handles="+encodeURIComponent(list.join(",")),null,5000);
  return r.ok?(r.body.found||[]):null;
}
/* Real scores for the people on your list, for today. Absent means they have
   not played — which is a fact worth showing, not a gap worth filling. */
async function friendScores(force){
  const k=todayKey(),names=(P.friends||[]).map(f=>f.h);
  if(!names.length)return {};
  if(!force&&FSC.day===k&&Date.now()-FSC.at<30000)return FSC.scores;
  const r=await apiCall("/v1/daily/scores?day="+k+"&handles="+encodeURIComponent(names.join(",")),
    null,5000);
  if(!r.ok)return null;
  FSC={day:k,at:Date.now(),scores:r.body.scores||{}};
  return FSC.scores;
}
async function sendInvite(to,code){
  const r=await apiCall("/v1/invite",{method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({device:deviceToken(),to:to,code:code,day:todayKey()})});
  return r.ok?r.body:null;
}
async function myInvites(force){
  const k=todayKey();
  if(!force&&INV.day===k&&Date.now()-INV.at<45000)return INV.list;
  const r=await apiCall("/v1/invites?device="+encodeURIComponent(deviceToken())+"&day="+k,null,5000);
  if(!r.ok)return null;
  INV={day:k,at:Date.now(),list:r.body.invites||[]};
  return INV.list;
}
function markInvitesSeen(){
  apiCall("/v1/player/seen",{method:"POST",headers:{"Content-Type":"application/json"},
    body:JSON.stringify({device:deviceToken(),day:todayKey()})}).catch(()=>{});
  INV.list=(INV.list||[]).map(x=>Object.assign({},x,{seen:1}));
}

let LIVE=null,LIVEAT=0;
/* The real board, cached briefly so flipping tabs does not hammer the edge.
   The board carries no device tokens — nobody's identifier belongs in a public
   object — so "you" is matched on handle and the score the server returned. */
async function liveBoard(){
  const k=todayKey();
  if(LIVE&&LIVE.day===k&&Date.now()-LIVEAT<20000)return LIVE;
  const r=await apiCall("/v1/daily/board?day="+k,null,5000);
  if(!r.ok||!Array.isArray(r.body.rows))return null;
  const mine=(P.handle||"YOU").toUpperCase().replace(/[^A-Z0-9]/g,"").slice(0,9);
  const played=P.daily.last===k, mySc=P.daily.server;
  let claimed=false;
  LIVE={day:k,players:r.body.players||r.body.rows.length,
    rows:r.body.rows.map(x=>{
      const you=!claimed&&played&&x.handle===mine&&x.score===mySc;
      if(you)claimed=true;
      return {name:x.handle,score:x.score,chips:x.chips,eligible:!!x.eligible,you:you};
    })};
  LIVEAT=Date.now();
  return LIVE;
}
function ordSuffix2(n){return n?n+ordSuffix(n):"in";}

/* ── somebody called you out ──
   The table was always derivable from two handles. What was missing was
   anyone finding out, so an invite is now a thing that arrives. */

function dailyBoard(){
  const k=todayKey(),out=[];
  R.forEach(r=>{
    const g=mulberry32(hashStr(k+r.name));
    const t=Math.max(0,Math.min(1,(r.rating-1300)/500));
    const v=(g()+g()+g())/3;
    out.push({name:r.name,rating:r.rating,
      score:Math.max(0,Math.round(360+(v-.5)*520+(t-.5)*400))});
  });
  if(P.daily.last===k&&P.daily.skill!=null)

/* ══════════ SHARE ══════════
   The one place emoji stay, and on purpose. Everything inside the app is a drawn
   mark because we control how it renders; this string is going into somebody
   else's Messages, or a tweet, or a group chat, where we control nothing and a
   drawn mark is not an option. A coloured square is legible in every text field
   on earth, and a row of them is the only part of a result anyone reads. */
const SYM={held:"\u{1F451}",up:"\u{1F7E9}",down:"\u{1F7E5}",fold:"⬜"};
function stripOf(list){return list.map(h=>h.sym).join("");}
function shareText(){
  const s=S.session;
  const head=S.daily?"BLUFF · daily "+prettyDate(todayKey()):"BLUFF · cash";
  let out=head+"\n"+stripOf(S.strip)+"  "+(s.delta>=0?"+":"")+s.delta+"\n";
  const best=S.strip.filter(h=>h.role==="set"&&h.callers>0).sort((a,b)=>b.d-a.d)[0];
  if(best&&best.d>0)
    out+="Set "+best.word+" ("+best.rate+"%) — "+best.callers+" called, "
      +best.cracked+" cracked, "+(best.d>=0?"+":"")+best.d+"\n";
  out+=tierOf(P.rating)[1]+" "+P.rating+" · "+P.w+"-"+P.l;
  if(P.streak>1)out+=" · "+P.streak+" up in a row";
  return out;
}

/* ══════════ SHARE ══════════
   navigator.share opens the OS share sheet. On mobile — where most of our
   traffic lands — that is the difference between a link that spreads and a
   link that sits on somebody's clipboard. Clipboard stays as the fallback for
   desktop and for browsers without it.

   Every shared URL carries a source tag, because a share we cannot attribute
   teaches us nothing and cannot be paid against. */
const SITE="https://webluff.com";
const canShare=()=>typeof navigator!=="undefined"&&!!navigator.share;
function tagged(url,medium){
  return url+(url.indexOf("?")>-1?"&":"?")+"utm_source=share&utm_medium="+encodeURIComponent(medium);
}
async function shareOut(text,url,medium,okMsg){
  const link=tagged(url||SITE,medium);
  const body=text+"\n"+link;
  if(canShare()){
    try{ await navigator.share({title:"BLUFF",text:body}); return; }
    catch(e){ if(e&&e.name==="AbortError")return; }   /* user dismissed — not an error */
  }
  try{ await navigator.clipboard.writeText(body); toast(okMsg||"copied"); }
  catch(e){ toast("select and copy"); }
}

/* ══════════ UI HELPERS ══════════ */
const $=id=>document.getElementById(id);
const stage=()=>$("stage");
function toast(m,ms){const t=$("toast");t.textContent=m;t.classList.add("on");
  clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove("on"),ms||2100);}
const CLOCK_TOTAL=90000,CLOCK_SHOW=30000;

/* ══════════ SOUND ══════════
   Every sound here is synthesised at runtime out of oscillators and filtered
   noise. No files, no fetches, nothing to load -- and each one is a handful of
   numbers I can tune rather than an asset I would have to re-record. A limiter
   sits on the master so a pile of overlapping sounds never clips. */
const Snd={
  ctx:null,master:null,armed:false,unlocked:false,
  /* ── the chain ──
     Everything lands on one bus, the bus goes through a limiter, and the
     make-up gain sits AFTER the limiter. Putting the level before the limiter
     only makes it squash harder; putting it after is what actually makes the
     game loud. The same function builds the chain for the offline renderer, so
     what the tests measure is what a player hears rather than a bare bus. */
  build(c,dest){
    const comp=c.createDynamicsCompressor();
    comp.threshold.value=-20;comp.knee.value=26;comp.ratio.value=6;
    comp.attack.value=.003;comp.release.value=.18;
    const bus=c.createGain();bus.gain.value=1;
    const out=c.createGain();out.gain.value=1.95;     /* make-up, post-compressor */
    /* A compressor with a 3 ms attack still lets transients through, and with
       this much make-up they would clip. tanh saturation after it is a real
       ceiling: it can never exceed +/-1, quiet material passes almost
       untouched, and loud material rounds off instead of tearing. */
    const cap=c.createWaveShaper();
    const N=2048,curve=new Float32Array(N),k=1.7,norm=Math.tanh(k);
    for(let i=0;i<N;i++)curve[i]=Math.tanh((i*2/(N-1)-1)*k)/norm;
    cap.curve=curve;cap.oversample="4x";
    bus.connect(comp);comp.connect(out);out.connect(cap);cap.connect(dest);
    return bus;
  },
  boot(){
    if(this.ctx)return this.ctx;
    const AC=window.AudioContext||window.webkitAudioContext;
    if(!AC)return null;
    try{
      this.ctx=new AC();
      this.master=this.build(this.ctx,this.ctx.destination);
    }catch(e){this.ctx=null;}
    return this.ctx;
  },
  /* ── the silent switch ──
     On iOS, Web Audio obeys the ringer switch and a phone in silent mode plays
     nothing at all -- which reads to the player as "this game has no sound"
     rather than "my phone is muted". Playing a scrap of silence through an
     ordinary audio element on the first touch moves the app into the playback
     audio session, and Web Audio stops being muted with the ringer. */
  unlock(){
    if(this.unlocked)return;this.unlocked=true;
    try{
      const sr=8000,n=400,buf=new ArrayBuffer(44+n*2),v=new DataView(buf);
      const w=(o,t)=>{for(let i=0;i<t.length;i++)v.setUint8(o+i,t.charCodeAt(i));};
      w(0,"RIFF");v.setUint32(4,36+n*2,true);w(8,"WAVEfmt ");
      v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,1,true);
      v.setUint32(24,sr,true);v.setUint32(28,sr*2,true);v.setUint16(32,2,true);
      v.setUint16(34,16,true);w(36,"data");v.setUint32(40,n*2,true);
      let str="";const b=new Uint8Array(buf);
      for(let i=0;i<b.length;i++)str+=String.fromCharCode(b[i]);
      const a=new Audio("data:audio/wav;base64,"+btoa(str));
      a.loop=true;a.volume=.001;a.setAttribute("playsinline","");
      const p=a.play();if(p&&p.catch)p.catch(()=>{});
      this._keep=a;
    }catch(e){}
  },
  /* browsers keep audio silent until the user has touched the page once */
  arm(){
    if(this.armed)return;this.armed=true;
    const go=()=>{this.unlock();const c=this.boot();
      if(c&&c.state==="suspended")c.resume();
      if(typeof Mus!=="undefined")setTimeout(()=>Mus.sync(),120);};
    ["pointerdown","keydown","touchstart"].forEach(e=>
      addEventListener(e,go,{once:true,passive:true}));
  },
  ready(){
    if(P&&P.mute)return null;
    let c=this.boot();if(!c)return null;
    /* iOS parks the context in "interrupted" after a call, Siri or a trip to the
       background, and "closed" after a media-session teardown. Resume from any
       non-running state; rebuild from a closed one. */
    if(c.state==="closed"){this.ctx=null;this.master=null;c=this.boot();if(!c)return null;}
    if(c.state!=="running"){try{const p=c.resume();if(p&&p.catch)p.catch(()=>{});}catch(e){}}
    return c;
  },
  /* one shaped tone */
  tone(o){
    const c=this.ready();if(!c)return;
    const t=c.currentTime+(o.at||0),dur=o.dur||.15;
    const osc=c.createOscillator(),g=c.createGain();
    osc.type=o.type||"triangle";
    osc.frequency.setValueAtTime(o.f,t);
    if(o.to)osc.frequency.exponentialRampToValueAtTime(Math.max(20,o.to),t+dur);
    g.gain.setValueAtTime(.0001,t);
    g.gain.exponentialRampToValueAtTime(Math.max(.0002,o.vol||.3),t+(o.atk||.006));
    g.gain.exponentialRampToValueAtTime(.0001,t+dur);
    let node=osc;
    if(o.bp){
      const f=c.createBiquadFilter();
      f.type="bandpass";f.frequency.value=o.bp;f.Q.value=o.q||6;
      osc.connect(f);node=f;
    }
    node.connect(g);g.connect(this.master);
    osc.start(t);osc.stop(t+dur+.04);
  },
  /* a burst of filtered noise -- the transient that makes metal sound metal */
  noise(o){
    const c=this.ready();if(!c)return;
    const t=c.currentTime+(o.at||0),len=Math.max(.02,o.dur||.1);
    const buf=c.createBuffer(1,Math.ceil(c.sampleRate*len),c.sampleRate);
    const d=buf.getChannelData(0);
    for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*(1-i/d.length);
    const src=c.createBufferSource();src.buffer=buf;
    const f=c.createBiquadFilter();
    f.type=o.lp?"lowpass":"bandpass";
    f.frequency.setValueAtTime(o.f||2200,t);
    if(o.to)f.frequency.exponentialRampToValueAtTime(Math.max(60,o.to),t+len);
    f.Q.value=o.q||1.2;
    const g=c.createGain();
    g.gain.setValueAtTime(o.vol||.18,t);
    g.gain.exponentialRampToValueAtTime(.0001,t+len);
    src.connect(f);f.connect(g);g.connect(this.master);
    src.start(t);src.stop(t+len+.02);
  },

  /* ── harmonics ──
     A built waveform rather than a stock oscillator: partial n sits at exactly
     n times the root and the amplitudes decide the timbre. This is not
     decoration. Intervals taken from the series -- octave 2:1, fifth 3:2, major
     third 5:4 -- share partials with the root, and shared partials are the
     physical reason a chord reads as resolved instead of merely loud.
     The peaking filter tilts each voice toward 2-4 kHz, where the ear is most
     sensitive, so a reward cuts through without being turned up. */
  wave(c,key,p){

    if(c._bw[key])return c._bw[key];
    const real=new Float32Array(p.length+1),imag=new Float32Array(p.length+1);
    for(let i=0;i<p.length;i++)imag[i+1]=p[i];
    return (c._bw[key]=c.createPeriodicWave(real,imag,{disableNormalization:false}));

  harm(o){

    const t=c.currentTime+(o.at||0),dur=o.dur||.5;

          this.tone({at:.15,f:760,dur:.10,type:"square",vol:.16}); },

        this.tone({at:.11,f:165,dur:.14,type:"square",vol:.22,bp:430,q:1.5}); },

          this.noise({dur:.34,f:2600,to:300,q:.8,vol:.20,lp:true});
          this.tone({at:.26,f:110,dur:.22,type:"sine",vol:.30}); },
  /* ── the table opening ──
     The harmonic series of one root, arriving in order: 1x, 2x, 3x, 4x, 5x,
     6x, 8x of G2. Because every voice is an exact integer multiple of the
     same fundamental they share partials the whole way up, and the ear fuses
     them into one tone opening rather than a chord of separate notes. That
     fusion is what "harmonic" actually buys you.

  bloom(order,gain,noise){

      {n:2, dur:1.18, vol:.21, atk:.045, p:[1,.42,.24,.15,.09]},
      {n:3, dur:1.02, vol:.175,atk:.038, p:[1,.34,.18,.10]},

     so they all sound like they come from the same instrument. */
  bell(f,dur,vol,at){

    this.harm({at:at,f:f,     dur:dur,     vol:vol,     atk:.003,bright:3000,lift:5,

  },

  /* ── the round marker ──

     hand six the fifteenth. Six hands, six rungs, so you can hear how deep into

  round(n){
    const rungs=[2,3,4,5,6,8];

    this.bell(98*k,.72,.23);

  },
  start(){
    if(typeof Mus!=="undefined")Mus.duck(.26);

       start of a match should feel like */
    /* trimmed against the money: the opening should be the second loudest
       thing in the game, never the first */
    this.bloom("up",.80,function(){
      this.noise({dur:.13,f:900,to:320,q:.9,vol:.22,lp:true});
      this.noise({at:.085,dur:.11,f:820,to:300,q:.9,vol:.15,lp:true});
    });
  },
  /* ── and the table closing ──
     The same seven voices, the same root, arriving from the top and settling
     onto the fundamental. Identical material, opposite direction, so the two
     read as a matched pair rather than two unrelated noises. */
  finish(){
    if(typeof Mus!=="undefined")Mus.duck(.30);

    });
  },

     a swell and an accelerating reel (anticipation), a beat of nothing (the
     hold), then the harmonic series arriving all at once on top of the coins
     (resolution). Anticipation followed by release is what the music-and-reward
     research actually points at -- there is no magic frequency doing it. */
  reward(amount){
    if(typeof Mus!=="undefined")Mus.duck(.18);
    const n=Math.max(5,Math.min(11,5+Math.floor((amount||0)/700)));
    const rise=.44,hit=rise+.11;
    this.harm({f:130,to:392,dur:rise+.08,vol:.13,atk:.15,bright:2500,lift:3,
      partials:[1,.7,.5,.36,.26,.18]});
    this.noise({dur:rise,f:700,to:5000,q:.9,vol:.11});
    for(let t=0,gap=.030;t<rise;t+=gap,gap*=1.17)  /* the reel slowing down */
      this.noise({at:t,dur:.02,f:3200,q:3,vol:.06});
    /* the series: 4:5:6:8:10:12:16 -- every voice shares partials with the root */
    [1,1.25,1.5,2,2.5,3,4].forEach((r,i)=>
      this.harm({at:hit+i*.018,f:523.25*r,dur:1.2-i*.075,vol:.140-i*.011,
        atk:.006,bright:3100,lift:6,partials:[1,.6,.42,.3,.22,.16,.11,.08]}));
    this.noise({at:hit,dur:.9,f:7400,to:1500,q:.7,vol:.095});
    const scale=[0,4,7,12,16,19,24,26,28,31,36];
    for(let i=0;i<n;i++){
      const at=hit+.07+i*.046;
      this.noise({at:at,dur:.026,f:3800,q:3,vol:.09});
      this.harm({at:at,f:659.25*Math.pow(2,scale[i]/12),dur:.21,vol:.135,atk:.003,
        bright:3400,lift:4,partials:[1,.45,.26,.16,.1]});
    }
    this.harm({at:hit+.11+n*.046,f:1046.5,dur:.55,vol:.17,bright:3200,lift:5,
      partials:[1,.5,.3,.2,.13]});
  },
  /* a winner who is not you still gets their moment, pitched by placement */
  pay(rank){
    const r=[1,1.5,1.25][rank]||1;
    this.harm({f:392*r,dur:.34,vol:.15,bright:3000,lift:4,partials:[1,.5,.32,.2,.14]});
    this.harm({at:.06,f:784*r,dur:.28,vol:.10,partials:[1,.4,.24]});
    this.noise({dur:.05,f:3400,q:2.6,vol:.09});
  },
  rank(up){
    const seq=up?[0,7,12,16,19]:[19,14,9,5,0];
    seq.forEach((s,i)=>
      this.tone({at:i*.072,f:(up?392:330)*Math.pow(2,s/12),dur:.55,type:"triangle",vol:.19}));
    if(up)this.noise({at:.28,dur:.75,f:7200,to:1200,q:.7,vol:.07});
  }
};
/* ══════════ THE BED ══════════
   Written here rather than licensed. A track bought "royalty free" still means
   a file to ship, an attribution line to honour, a licence to keep on record
   and a third-party-content declaration at submission -- and it cannot react to
   anything. This is a few hundred bytes of arithmetic that ducks when the money
   lands, follows the same G-minor root as every effect in the game, and belongs
   to nobody but this project.

   Soft house at 104 BPM: an eight-bar vamp, Gm9 - Ebmaj7 - Cm9 - Dm7, two bars
   each. Slow harmonic rhythm on purpose. This plays under a game people are
   trying to think during, so it must never ask for attention. */
const Mus={
  level:.15, ctx:null, gain:null, timer:null, running:false, bar:0, nextAt:0,

  /* ══════════ THE VOICES ══════════ */
  noiseBuf(c){
    if(c._mnb)return c._mnb;
    const n=Math.floor(c.sampleRate*.5),b=c.createBuffer(1,n,c.sampleRate);
    const d=b.getChannelData(0);

  pad(c,dest,when,freqs,dur,o){

      osc.detune.value=(i%2?5:-5)+i*1.5;

      const v=v0/(1+i*.34);
      g.gain.setValueAtTime(.0001,when);
      g.gain.exponentialRampToValueAtTime(v,when+dur*.26);
      g.gain.setValueAtTime(v,when+dur*.6);
      g.gain.exponentialRampToValueAtTime(.0001,when+dur);

  kick(c,dest,when,vol,hard){

    o.frequency.exponentialRampToValueAtTime(hard?42:46,when+(hard?.085:.10));
    g.gain.setValueAtTime(.0001,when);
    g.gain.exponentialRampToValueAtTime(vol||.34,when+.005);
    g.gain.exponentialRampToValueAtTime(.0001,when+(hard?.22:.25));

  sub(c,dest,when,f,dur,vol){

    o.type="sine";o.frequency.value=f;
    g.gain.setValueAtTime(.0001,when);

    g.gain.setValueAtTime(v,when+dur*.68);
    g.gain.exponentialRampToValueAtTime(.0001,when+dur);
    o.connect(g);g.connect(dest);
    o.start(when);o.stop(when+dur+.05);

  pluck(c,dest,when,f,vol){
    const o=c.createOscillator(),g=c.createGain(),lp=c.createBiquadFilter();
    o.type="triangle";o.frequency.value=f;

    g.gain.exponentialRampToValueAtTime(vol||.075,when+.004);
    g.gain.exponentialRampToValueAtTime(.0001,when+.30);
    o.connect(lp);lp.connect(g);g.connect(dest);
    o.start(when);o.stop(when+.34);

  stab(c,dest,when,f,dur,vol){

    g.gain.setValueAtTime(.0001,when);

  {

  /* ══════════ WIRING ══════════ */
  cur(){return this.TRACKS[this.track==null?0:this.track];},
  find(id){const i=this.TRACKS.findIndex(t=>t.id===id);return i<0?null:i;},
  boot(){
    const c=Snd.boot();
    if(!c||!Snd.master)return null;
    if(!this.gain||this.gain.context!==c){
      this.gain=c.createGain();
      this.gain.gain.value=this.level;
      this.gain.connect(Snd.master);
    }
    this.ctx=c;
    return c;
  },
  wanted(){return !!(P&&!P.mute&&!P.noMusic);},
  sync(){ this.wanted()?this.start():this.stop(); },
  /* a speed table gets the loud one whether it asked for it or not */
  hype(on){
    this.forced=on?"surge":null;
    if(this.running){this.stop();setTimeout(()=>this.start(),420);}
  },
  choose(){
    if(this.forced!=null){const i=this.find(this.forced);if(i!=null)return i;}
    const want=(P&&P.track)||"auto";
    if(want!=="auto"){const i=this.find(want);if(i!=null)return i;}
    /* auto: shuffle the calm and lifting beds and walk the list, so you never
       hear the same one twice running and never get the banger unasked */
    if(!this.order.length||this.oi>=this.order.length){
      const pool=this.TRACKS.map((t,i)=>({t:t,i:i})).filter(x=>x.t.mood!=="hype");
      for(let j=pool.length-1;j>0;j--){
        const r=Math.floor(Math.random()*(j+1)),tmp=pool[j];pool[j]=pool[r];pool[r]=tmp;
      }
      if(this.order.length&&pool[0].i===this.order[this.order.length-1]&&pool.length>1){
        const tmp=pool[0];pool[0]=pool[1];pool[1]=tmp;
      }
      this.order=pool.map(x=>x.i);this.oi=0;
    }
    return this.order[this.oi++];
  },
  next(){
    const was=this.track;
    if(P&&P.track&&P.track!=="auto")P.track="auto";
    let t=this.choose(),guard=0;
    while(t===was&&guard++<6)t=this.choose();
    this.track=t;
    if(this.running){this.stop();setTimeout(()=>{this.running=false;this.start();},340);}
    else this.start();
    return this.cur();
  },
  start(){
    if(this.running)return;
    const c=this.boot();if(!c||!this.wanted())return;
    if(c.state==="suspended")c.resume();
    if(this.track==null||this.forced!=null||(P&&P.track&&P.track!=="auto"))
      this.track=this.choose();
    this.running=true;this.bar=0;
    this.gain.gain.cancelScheduledValues(c.currentTime);
    this.gain.gain.setValueAtTime(.0001,c.currentTime);
    this.gain.gain.linearRampToValueAtTime(this.level,c.currentTime+1.6);
    this.nextAt=c.currentTime+.15;
    this.timer=setInterval(()=>this.pump(),240);
    this.pump();
  },
  stop(){
    if(!this.running)return;
    this.running=false;
    clearInterval(this.timer);this.timer=null;
    const c=this.ctx;if(!c||!this.gain||this.gain.context!==c)return;
    try{
      const g=this.gain.gain,t=c.currentTime;
      g.cancelScheduledValues(t);g.setValueAtTime(g.value,t);
      g.linearRampToValueAtTime(.0001,t+.4);
    }catch(e){}
  },
  pump(){
    const c=this.ctx;
    if(!c||!this.running||!this.gain||this.gain.context!==c)return this.stop();
    const spb=60/this.cur().bpm,bar=spb*4;
    let guard=0;
    while(this.nextAt<c.currentTime+1.4&&guard++<8){
      this.barAt(c,this.gain,this.bar,this.nextAt);
      this.bar++;this.nextAt+=bar;
    }
  },
  barAt(c,dest,n,t0,which){
    const t=which==null?this.cur():this.TRACKS[which];
    t.bar(this,c,dest,n,t0,60/t.bpm);
  },
  duck(amt,ms){
    if(!this.running||!this.gain)return;
    const c=this.ctx;if(!c||this.gain.context!==c)return;
    try{
      const g=this.gain.gain,t=c.currentTime;
      g.cancelScheduledValues(t);
      g.setValueAtTime(Math.max(.0001,g.value),t);
      g.linearRampToValueAtTime(Math.max(.0001,this.level*(amt||.3)),t+.05);
      g.linearRampToValueAtTime(this.level,t+((ms||700)/1000));
    }catch(e){}
  }
};

/* ══════════ CRESTS AND BADGES ══════════

   The board used to be a column of emoji animals. Two problems with that, and
   the second is the expensive one. It read as a children's app next to
   anything else on a phone — but worse, an emoji says nothing. A leaderboard
   is a status object; every pixel on it should be something you earned, and a
   randomly assigned fox is something you were handed.

   So: a crest built from your own handle, in the game's own palette, and then
   badges you can only get by playing. That is the whole psychology of the
   thing. People do not screenshot a number. They screenshot a number *with a
   title attached to it*, because the title is the part their friends can
   argue with. */

const CREST=[["#1b2a41","#f4efe6"],["#5c4426","#ecd9b0"],["#2b4560","#a9c6e4"],
  ["#4a2b45","#d9aed0"],["#5a2833","#e0a8b0"],["#33463a","#b5d4bd"],
  ["#4d3d22","#d8c49a"],["#1f4750","#9fd0d8"],["#443457","#c4ade0"],
  ["#54382a","#ddab8c"],["#2c3a4f","#aebdd6"],["#3d4428","#c6cf96"]];
/* Two letters of the handle, on a colour that handle will always get. Same
   name, same crest, on every device and every board, forever. */
function crestFor(name,cls,idx){
  const n=String(name||"?").toUpperCase().replace(/[^A-Z0-9]/g,"")||"?";
  const c=CREST[(idx==null?hashStr(n):idx)%CREST.length];
  return "<span class='crest "+(cls||"")+"' style='--cb:"+c[0]+";--cf:"+c[1]+"'>"
    +n.slice(0,2)+"</span>";
}
const faceOf=n=>crestFor(n);
/* your own crest honours the colour you chose; everybody else's comes from
   their handle, so the board never has two people looking alike by accident */
const myFace=()=>crestFor(P.handle||"?",null,P.crest);

/* ── titles ──
   Exclusive, scarce, and lost the moment somebody plays better. One holder for
   the world, one for each city. Scarcity is the entire point: a badge everyone
   has is decoration, a badge one person has is a thing to take off them. */
const TITLES=[
  {k:"world1", n:"BEST IN THE WORLD", t:"gold", test:r=>r.world===1},
  {k:"podium", n:"WORLD TOP 3",       t:"gold", test:r=>r.world>1&&r.world<=3},
  {k:"top100", n:"WORLD TOP 100",     t:"cool", test:r=>r.world>3&&r.world<=100},
  {k:"city1",  n:"BEST IN {CITY}",    t:"gold", test:r=>r.city===1},
  {k:"city10", n:"{CITY} TOP 10",     t:"cool", test:r=>r.city>1&&r.city<=10},
];

/* ── the ones that make people laugh ──
   Every one of these is derived from play, needs a real sample before it can
   be earned, and is worded so that being given it stings a little and is
   funny. That combination is what gets sent to a group chat. */
const TRAITS=[
  {k:"bullied",n:"MOST BULLIED",   d:"the table eats well when this one calls",
   min:p=>p.called>=20, test:p=>p.missed/Math.max(1,p.called)>=.55},
  {k:"ghost",  n:"NOBODY CALLS",   d:"so frightening that nobody takes it on",
   min:p=>p.setHands>=12, test:p=>p.setNoTakers/Math.max(1,p.setHands)>=.30},
  {k:"station",n:"CALLING STATION",d:"has never once believed a word of it",
   min:p=>p.called+p.foldedN>=20, test:p=>p.called/Math.max(1,p.called+p.foldedN)>=.85},
  {k:"rock",   n:"THE ROCK",       d:"folds more than anybody at the table",
   min:p=>p.foldsJudged>=12, test:p=>p.foldedN/Math.max(1,p.called+p.foldedN)>=.42},
  {k:"bust",   n:"BUST ARTIST",    d:"has run the stars to nothing, repeatedly",
   min:p=>true, test:p=>(p.busts||0)>=10},
  {k:"angler", n:"BEST BLUFFER",   d:"sets words the table cannot crack",
   min:p=>p.setHands>=12, test:p=>p.setHeld/Math.max(1,p.setHands)>=.55},
  {k:"safe",   n:"SAFE HANDS",     d:"folds the ones that were going to hurt",
   min:p=>p.foldsJudged>=12, test:p=>p.goodFolds/Math.max(1,p.foldsJudged)>=.75},
  {k:"whale",  n:"BIG ROUND",        d:"took a points most people never see",
   min:p=>true, test:p=>p.bigPot>=400},
  {k:"iron",   n:"IRON STREAK",    d:"six wins without sitting down",
   min:p=>true, test:p=>(p.bestStreak||0)>=6},
];

function titlesFor(rank){
  if(!rank)return [];
  return TITLES.filter(t=>{try{return t.test(rank);}catch(e){return false;}})
    .map(t=>({k:t.k,n:t.n.replace("{CITY}",(rank.cityName||"YOUR CITY").toUpperCase()),t:t.t}));
}
function traitsFor(p){
  return TRAITS.filter(t=>{try{return t.min(p)&&t.test(p);}catch(e){return false;}})
    .map(t=>({k:t.k,n:t.n,d:t.d,t:"trait"}));
}
const badgeChip=b=>"<span class='bdg "+b.t+"'>"+b.n+"</span>";
/* One title and one trait, never two of a kind. The title is the thing being
   fought over and the trait is the thing that gets screenshotted, so a row
   that shows two titles has quietly dropped the funnier half. */
function pairBadges(titles,traits){
  const out=[];
  if((titles||[]).length)out.push(titles[0]);
  if((traits||[]).length)out.push(traits[0]);
  if(out.length<2&&(titles||[]).length>1)out.push(titles[1]);
  return out;
}
function badgeStrip(list,max){
  const l=(list||[]).slice(0,max||3);
  return l.length?"<span class='bdgs'>"+l.map(badgeChip).join("")+"</span>":"";
}

const TALK_P={you_fold:.6,you_call:.35,you_crack:.75,you_late:.45,you_miss:.7,bot_call:.22,bot_fold:.28,bot_crack:.65,bot_late:.35,bot_miss:.5,setter_holds:.9,setter_cracked:.7,you_held:.8,you_got_cracked:.75,item_scram:1,item_gift:1,item_hint:.6,item_swap:1};
const TALK_LABEL={calledit:"CALLED IT",nochance:"NO CHANCE",respect:"RESPECT",ouch:"OUCH",bluff:"BLUFF!"};
const TALK_MARKS={
 calledit:"<svg viewBox='0 0 20 20'><circle cx='10' cy='10' r='7.5'/><path d='M6.5 10.2l2.3 2.3 4.7-5'/></svg>",
 nochance:"<svg viewBox='0 0 20 20'><circle cx='10' cy='10' r='7.5'/><path d='M5.5 14.5l9-9'/></svg>",
 respect:"<svg viewBox='0 0 20 20'><circle cx='10' cy='7.5' r='4.5'/><path d='M7.2 11.5l-1.7 5.5 4.5-2 4.5 2-1.7-5.5'/></svg>",
 ouch:"<svg viewBox='0 0 20 20'><rect x='3.5' y='3.5' width='13' height='13' rx='2'/><path d='M10 3.5l-2 4 3 2.5-2.5 3.5 1.5 3'/></svg>",
 bluff:"<svg viewBox='0 0 20 20'><path d='M2.5 10s3-5 7.5-5 7.5 5 7.5 5-3 5-7.5 5-7.5-5-7.5-5z'/><circle cx='10' cy='10' r='2.4'/></svg>"};
const Talk={
  busyUntil:0,lastBy:{},reactAt:0,
  enabled(){return !(P&&P.quiet)&&!(navigator.webdriver===true&&!window.__talkAlways);},
  layer(){const t=$("table");if(!t)return null;let l=$("talk");
    if(!l){l=document.createElement("div");l.id="talk";t.appendChild(l);}return l;},
  styleOf(s){if(!s||s.you)return "you";const r=ROSTER.find(x=>x[0]===s.name);return r?r[2]:"solid";},
  bubble(i,text,who){
    const l=this.layer();if(!l)return;const pos=SEATPOS[i];if(!pos)return;
    const old=l.querySelector("[data-seat='"+i+"']");if(old)old.remove();
    const d=document.createElement("div");
    const side=pos[0]<35?" right":pos[0]>65?" left":pos[1]<50?" below":"";
    d.className="say"+(who==="you"?" you":"")+side;
    d.dataset.seat=i;d.style.left=pos[0]+"%";d.style.top=pos[1]+"%";
    d.textContent=text;l.appendChild(d);
    requestAnimationFrame(()=>d.classList.add("on"));
    setTimeout(()=>{d.classList.remove("on");d.classList.add("gone");setTimeout(()=>d.remove(),320);},2600);
  },
  pick(prefer){
    if(prefer&&!prefer.you)return prefer;
    const now=Date.now();
    const c=(S.seats||[]).filter(x=>!x.you&&(now-(this.lastBy[x.name]||0))>6000);
    if(!c.length)return null;
    let tot=0;const w=c.map(x=>{const v=(TALK_STYLE[this.styleOf(x)]||TALK_STYLE.solid).chat;tot+=v;return v;});
    let r=Math.random()*tot;for(let k=0;k<c.length;k++){r-=w[k];if(r<=0)return c[k];}return c[c.length-1];
  },
  line(ev,st){const L=TALK_LINES[ev];if(!L)return null;const a=L[st]||L.solid;return a[Math.floor(Math.random()*a.length)];},
  on(ev,actor,opts){
    if(!this.enabled()||!S.seats)return;
    const now=Date.now();
    if(!window.__talkAlways){
      if(now<this.busyUntil)return;
      if(Math.random()>(TALK_P[ev]==null?.5:TALK_P[ev]))return;
      const cd=$("cd");if(cd&&cd.classList.contains("on"))return;
    }
    const who=this.pick(actor);if(!who)return;
    const st=this.styleOf(who),text=this.line(ev,st);if(!text)return;
    const lag=(opts&&opts.lag!=null)?opts.lag:(TALK_STYLE[st]||TALK_STYLE.solid).lag;
    const wait=Array.isArray(lag)?lag[0]+Math.random()*(lag[1]-lag[0]):lag;
    this.busyUntil=now+wait+2400;this.lastBy[who.name]=now+wait;
    setTimeout(()=>{if(S.seats&&S.seats[who.i]===who)this.bubble(who.i,text);},wait);
  },
  showdown(setter,callers){
    if(!this.enabled()||!callers.length)return;
    const crk=callers.filter(x=>x.cracked).length;
    if(setter.you)this.on(crk?"you_got_cracked":"you_held",null,{lag:1300});
    else this.on(crk?"setter_cracked":"setter_holds",setter,{lag:1300});
  },
  react(kind){
    if(!S.seats)return;
    const now=Date.now();if(now<this.reactAt)return;this.reactAt=now+1800;
    this.bubble(0,TALK_LABEL[kind],"you");hap("medium");Snd.key();
    const setter=S.seats[S.button];
    const target=kind==="bluff"&&setter&&!setter.you?setter:null;
    if(Math.random()<(kind==="bluff"?.9:.6))this.on("re_"+kind,target,{lag:[900,1700]});
  }
};
function talkBarHTML(){
  return "<div id='talkBar' class='talkbar'>"+Object.keys(TALK_LABEL).map(k=>
    "<button class='rx' data-rx='"+k+"' aria-label='"+TALK_LABEL[k]+"'>"+TALK_MARKS[k]+"<span>"+TALK_LABEL[k]+"</span></button>").join("")+"</div>";
}
function talkBarState(){
  const kb=$("kb"),typing=!!(kb&&S.phase==="play"&&!kb.classList.contains("off"));
  document.body.classList.toggle("typing",typing);

function mountTalkBar(){

  const h=$("trayHint");if(!h||$("talkBar"))return;

const __drawTray=drawTray;drawTray=function(){const r=__drawTray.apply(this,arguments);mountTalkBar();return r;};
function drawTable(){
  if(!S.seats)return;
  const t=$("table");
  [...t.querySelectorAll(".seat")].forEach(e=>e.remove());
  S.seats.forEach((s,i)=>{
    const c=["seat"];
    if(s.you)c.push("you","btm");
    if(s.setter)c.push("setter");
    if(s.state==="fold")c.push("out");
    if(s.state==="call")c.push("callst");
    if(s.state==="crack")c.push("crack");
    if(s.state==="late")c.push("late");
    if(s.state==="bust")c.push("bust");
    if(s.acting)c.push("acting");
    if(S.arm&&ITEMS[S.arm].target&&!s.you&&targetOK(s))c.push("targetable");
    if(s.ticking)c.push("ticking");
    const d=document.createElement("div");
    d.className=c.join(" ");
    d.style.left=SEATPOS[i][0]+"%";d.style.top=SEATPOS[i][1]+"%";
    let tag="";
    if(s.setter)tag="<div class='tag wait'>SETTER</div>";
    else if(s.state==="call")tag="<div class='tag call'>IN "+S.stake+"</div>";
    else if(s.state==="fold")tag="<div class='tag fold'>FOLD</div>";
    else if(s.state==="crack")tag="<div class='tag call'>CRACKED</div>";
    else if(s.state==="late")tag="<div class='tag wait'>GOT IT LATE</div>";
    else if(s.state==="bust")tag="<div class='tag fold'>MISSED</div>";
    const prev=lastChips[i];
    const move=prev==null?"":(s.chips>prev?" up":(s.chips<prev?" dn":""));
    lastChips[i]=s.chips;
    const frac=s.ticking?Math.max(0,Math.min(1,(s.deadline-Date.now())/CLOCK_SHOW)):1;
    d.innerHTML=
      "<div class='ava'>"+(s.you?myFace():faceOf(s.name))
      +(s.setter?"<div class='btnD'>D</div>":"")
      +"<i class='ring'></i>"
      +"<svg class='clk' viewBox='0 0 100 100'><circle cx='50' cy='50' r='46' "
      +"stroke='"+(frac<.34?"#c96a57":"#d89b4f")+"' stroke-dasharray='289' "
      +"stroke-dashoffset='"+(289*(1-frac)).toFixed(1)+"'/></svg>"
      +"</div>"
      +"<div class='nm'>"+s.name+"</div>"
      +"<div class='ch"+move+"'>"+s.chips+"</div>"+tag;
    if(S.arm&&ITEMS[S.arm].target&&!s.you&&targetOK(s))
      d.onclick=()=>fireItem(s);
    t.appendChild(d);
  });
  $("hHand").textContent=Math.min(S.hand+1,HANDS)+"/"+HANDS;
  $("hChips").textContent=S.seats[0].chips;
  setPot(S.pot);
}

/* pot counts up rather than jumping */
let potShown=0,potAnim=null;
function setPot(v){
  const el=$("potVal");if(!el)return;
  if(potAnim)clearInterval(potAnim);
  const from=potShown,d=v-from;
  if(!d){el.textContent=v;potShown=v;return;}
  const t0=Date.now();
  potAnim=setInterval(()=>{
    const k=Math.min(1,(Date.now()-t0)/480);
    el.textContent=Math.round(from+d*(1-Math.pow(1-k,3)));
    if(k>=1){clearInterval(potAnim);potAnim=null;potShown=v;}
  },28);
  potShown=v;
}

/* ══════════ CHIPS IN FLIGHT ══════════ */
function chipCount(amt){return amt>=100?5:amt>=50?4:amt>=25?3:2;}
function flyChips(from,to,n,kind){
  const layer=$("chipLayer");if(!layer)return;
  const A=from==null?POTPOS:SEATPOS[from];
  const B=to==null?POTPOS:SEATPOS[to];
  for(let k=0;k<n;k++){
    const c=document.createElement("div");
    c.className="chip"+(kind?" "+kind:"");
    c.style.left=A[0]+"%";c.style.top=A[1]+"%";
    c.style.transitionDelay=(k*65)+"ms";
    layer.appendChild(c);
    requestAnimationFrame(()=>requestAnimationFrame(()=>{
      c.style.left=(B[0]+(Math.random()*9-4.5))+"%";
      c.style.top=(B[1]+(Math.random()*9-4.5))+"%";
    }));
    setTimeout(()=>{c.style.opacity="0";},640+k*65);
    setTimeout(()=>{c.remove();},1050+k*65);
  }
}
/* ══════════ THE PAYOUT ══════════
   At the end of a match the stars are shown actually moving -- out of the
   middle and into the stacks that finished ahead, the biggest share first --
   before any numbers appear. The reward should be watched, not read. */
function flyStars(toSeat,n,big){
  const layer=$("chipLayer");if(!layer)return;
  const B=SEATPOS[toSeat];
  for(let k=0;k<n;k++){
    const c=document.createElement("div");
    c.className="chip star"+(big?" big":"");
    c.style.left=(POTPOS[0]+(Math.random()*11-5.5))+"%";
    c.style.top=(POTPOS[1]+(Math.random()*8-4))+"%";
    c.style.transitionDelay=(k*52)+"ms";
    layer.appendChild(c);
    requestAnimationFrame(()=>requestAnimationFrame(()=>{
      c.style.left=(B[0]+(Math.random()*12-6))+"%";
      c.style.top=(B[1]+(Math.random()*12-6))+"%";
      c.style.transform="translate(-50%,-50%) scale(1.3) rotate("
        +Math.round(Math.random()*280-140)+"deg)";
    }));
    setTimeout(()=>{c.style.opacity="0";},760+k*52);
    setTimeout(()=>{c.remove();},1180+k*52);
  }
}
function runPayout(sorted,then){
  const up=sorted.filter(s=>s.chips>BUYIN);
  const list=(up.length?up:[sorted[0]]).slice(0,3);
  const note=$("centerNote");
  if(note)note.textContent=up.length?"paying out":"nobody finished ahead";
  let t=320;
  list.forEach((s,rank)=>{
    const share=Math.max(3,Math.min(11,3+Math.round((s.chips-BUYIN)/80)));
    setTimeout(()=>{
      flyStars(s.i,share,rank===0);
      const el=document.querySelectorAll(".seat")[s.i];
      if(el){el.classList.add("paid");setTimeout(()=>el.classList.remove("paid"),760);}
      if(s.you&&s.chips>BUYIN){S.rewarded=true;Snd.reward(s.chips-BUYIN);}
      else Snd.pay(rank);
    },t);
    t+=300;
  });
  setTimeout(then,t+560);
}
function betAnim(seatIdx,amt){Snd.chip();flyChips(seatIdx,null,chipCount(amt),null);}
function payAnim(seatIdx,amt,win){flyChips(null,seatIdx,chipCount(amt),win?"green":"red");}
