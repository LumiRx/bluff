/* ══════════ POWER-UPS ══════════
   Every item hands somebody something. The two that take away -- SCRAMBLE and
   SWAP -- are deliberately built so they never lie to you: the scrambled keys
   still say what they type, and a swapped word still fits the clue everyone
   paid for, with all boards reset so nobody loses deductions they bought. */
const ITEMS={
  hint: {ic:ico("bulb"),lb:"HINT",  target:0,rare:0,phase:"play",
         desc:"Reveals one letter of the word, in place, on your board."},
  gift: {ic:ico("gift"),lb:"GIFT",  target:1,rare:0,phase:"play",
         desc:"Hand a live letter to another player. They are told it came from you."},
  peek: {ic:ico("peek"),lb:"PEEK",  target:1,rare:0,phase:"play",
         desc:"See a rival's most recent guess and what it scored."},
  seat: {ic:ico("seat"),lb:"SEAT",  target:0,rare:0,phase:"action",
         desc:"Move to the back of the claiming order and watch everyone act first."},
  mull: {ic:ico("mull"), lb:"REDEAL",target:0,rare:0,phase:"deal",
         desc:"Throw your five cards away and take five new ones."},
  scram:{ic:ico("scram"),lb:"SCRAM", target:1,rare:0,phase:"play",
         desc:"Shuffles a rival's keyboard for six seconds. The keys move; they never lie."},
  swap: {ic:ico("dice"),lb:"SWAP",  target:0,rare:1,phase:"play",
         desc:"The word becomes a different one that fits the same clue. Every board resets."}
};
const COMMON_ITEMS=["hint","gift","peek","seat","mull","scram"];
const MAXITEMS=4;

function grantItem(seat,key){
  if(!seat.items)seat.items=[];
  if(seat.items.length>=MAXITEMS)return null;
  const k=key||(rnd()<.045?"swap":COMMON_ITEMS[Math.floor(rnd()*COMMON_ITEMS.length)]);
  seat.items.push(k);
  return k;
}
function spendItem(seat,key){
  const i=seat.items.indexOf(key);
  if(i<0)return false;
  seat.items.splice(i,1);return true;
}
function itemUsableNow(k){
  const it=ITEMS[k];
  if(it.phase==="deal")return S.phase==="deal";
  if(it.phase==="action")return S.phase==="action"&&S.awaitingHuman;
  return S.phase==="play"&&S.seats[0].state==="call"
    &&!S.seats[0].cracked&&S.seats[0].guesses.length<GUESSES;
}
function targetOK(s){
  if(S.arm==="peek")return s.guesses&&s.guesses.length>0;
  if(S.arm==="gift")return s.state==="call"&&!s.cracked;
  if(S.arm==="scram")return s.state==="call"&&!s.cracked;
  return false;
}

function drawTray(){
  const t=$("tray");if(!t)return;
  const me=S.seats[0],its=me.items||[];
  let h="";
  for(let i=0;i<MAXITEMS;i++){
    const k=its[i];
    if(!k){h+="<div class='item empty'></div>";continue;}
    const it=ITEMS[k];
    h+="<div class='item"+(it.rare?" rare":"")+(S.arm===k?" armed":"")
      +(itemUsableNow(k)?"":" idle")+"' data-k='"+k+"' data-i='"+i+"'>"
      +"<div class='ic'>"+it.ic+"</div><div class='lb'>"+it.lb+"</div></div>";
  }
  const canMuck=S.phase==="play"&&S.seats[0].state==="call"&&!S.seats[0].cracked;
  if(canMuck)h+="<button class='muck' id='muckBtn'>PASS<small>give up the hand</small></button>";
  t.innerHTML=h;
  if(canMuck){
    const mb=$("muckBtn");
    mb.onclick=function(){
      if(this.dataset.armed)return muckHand();
      this.dataset.armed="1";
      this.innerHTML="PAY "+S.stake+"<small>tap again to end it</small>";
      this.classList.add("armed");
      setTimeout(()=>{if(mb&&mb.dataset.armed){mb.dataset.armed="";
        mb.innerHTML="PASS<small>give up the hand</small>";mb.classList.remove("armed");}},3500);
    };
  }
  [...t.querySelectorAll(".item[data-k]")].forEach(el=>{
    const k=el.dataset.k;
    if(!itemUsableNow(k))return;
    el.onclick=()=>armItem(k);
  });
  const hint=$("trayHint");
  if(hint)hint.textContent=S.arm
    ?(ITEMS[S.arm].target?"tap a player to use "+ITEMS[S.arm].lb:ITEMS[S.arm].desc)
    :(canMuck&&!its.length?"stuck? pass costs the same as missing"
      :its.length?"tap an item to use it":"win hands to earn power-ups");
}
function armItem(k){
  if(S.arm===k){S.arm=null;drawTray();drawTable();return;}
  S.arm=k;
  if(!ITEMS[k].target){useItem(k,null);return;}
  drawTray();drawTable();
  toast(ITEMS[k].desc,2600);
}
function fireItem(seat){if(S.arm)useItem(S.arm,seat);}

function unknownLetter(word,seat){
  /* a letter of the word this player has not already pinned green */
  const known=new Set();
  (seat.marks||[]).forEach((m,gi)=>m.forEach((v,i)=>{if(v==="h")known.add(i);}));
  if(seat.given)seat.given.forEach(i=>known.add(i));
  const spots=[0,1,2,3,4].filter(i=>!known.has(i));
  if(!spots.length)return null;
  return spots[Math.floor(rnd()*spots.length)];
}
function applyLetter(seat,pos,fromName){
  if(!seat.given)seat.given=[];
  seat.given.push(pos);
  const ch=S.word[pos];
  if(seat.you){
    kbState[ch]="h";paintKb();
    if(S.myPool)S.myPool=S.myPool.filter(w=>w[pos]===ch);
    drawCands();
    const gv=document.querySelector(".brow.given");
    if(gv&&gv.children[pos]){gv.children[pos].className="tile h";gv.children[pos].textContent=ch;}
    eventBanner(fromName?fromName+" GAVE YOU A LETTER":"HINT",
      "The "+["1st","2nd","3rd","4th","5th"][pos]+" letter is "+ch+"."
      +(fromName?" They wanted you to know they know.":""),3000);
  }else{
    /* a gifted letter must never leave a bot with a wider pool than it had --
       fall back to the clue pool filtered by the same fact, not to the raw one */
    let np=(seat.pool||S.pool).filter(w=>w[pos]===ch);
    if(!np.length)np=S.pool.filter(w=>w[pos]===ch);
    if(!np.length)np=S.pool.slice();
    seat.pool=np;
  }
}

const SOLO_ITEMS={hint:1,peek:1,mull:1};      /* touch nothing but your own hand */
function useItem(k,seat){
  const me=S.seats[0];
  if(S.daily&&!SOLO_ITEMS[k]){
    toast("Not on the daily \u2014 everyone plays the identical six deals",2800);
    S.arm=null;drawTray();return;
  }
  if(!spendItem(me,k)){S.arm=null;drawTray();return;}
  S.arm=null;Snd.spark();
  if(k==="hint"){
    const p=unknownLetter(S.word,me);
    if(p==null)toast("you already have every letter");
    else applyLetter(me,p,null);
  }
  else if(k==="gift"&&seat){
    const p=unknownLetter(S.word,seat);
    if(p==null)toast(seat.name+" already has it all");
    else{applyLetter(seat,p,P.handle);
      toast("You handed "+seat.name+" the "+["1st","2nd","3rd","4th","5th"][p]+" letter",2800);}
  }
  else if(k==="peek"&&seat){
    const g=seat.guesses[seat.guesses.length-1];
    const m=seat.marks[seat.marks.length-1];
    eventBanner("PEEK — "+seat.name,
      g.split("").map((c,i)=>"<b style='display:inline-block;width:20px;padding:3px 0;margin:0 1px;"
      +"border-radius:3px;font-size:13px;background:"+(m[i]==="h"?"#f4efe6":m[i]==="n"?"#d89b4f":"#212b3d")
      +";color:"+(m[i]==="m"?"#8fa0b5":"#0d1118")+"'>"+c+"</b>").join(""),3400);
  }
  else if(k==="scram"&&seat){
    /* a bot has no keyboard to shuffle, so the honest equivalent is losing
       the time a human loses hunting for moved keys */
    seat.pace=Math.round(seat.pace*2.1);seat.nextAt=Date.now()+3200;
    toast(seat.name+" is fumbling for the keys",2600);
  }
  else if(k==="seat"){
    if(S.order&&S.oi<S.order.length){
      const mine=S.order.indexOf(0);
      if(mine>-1){S.order.splice(mine,1);S.order.push(0);}
      S.awaitingHuman=false;
      eventBanner("SEAT CHANGED","You act last now. Everyone else shows their hand first.",2400);
      drawTable();drawTray();return stepAction();
    }
  }
  else if(k==="mull"){
    S.hand5=dealCards();S.card=null;
    phaseDeal(true);
    return;
  }
  else if(k==="swap"){doWordSwap(P.handle);return;}
  drawTray();drawTable();
}

/* ══════════ MUCK ══════════
   Priced at exactly what missing costs, so there is no way to call wide and
   buy your way out cheap. It buys you an exit, not a discount. */
function muckHand(){
  const me=S.seats[0];
  if(S.phase!=="play"||me.state!=="call"||me.cracked)return;
  const salvage=me.guesses.length>=1?grantItem(me):null;
  me.state="bust";S.arm=null;S.mucked=true;
  drawRivals();drawTable();drawTray();
  eventBanner("MUCKED",
    "You lose "+S.stake+" stars, the same as missing — this only ends the hand instead of "
    +"holding the table up."+(salvage?" You salvaged a "+ITEMS[salvage].lb+" out of it.":""),3400);
  setTimeout(checkDone,700);
}

/* ══════════ WORD SWAP ══════════
   Fair by construction: the replacement still satisfies the clue people paid
   for, and every board resets so nobody is punished for deductions made
   against the old word. */
function doWordSwap(byName){
  const pool=survivors(S.tell,DECKS[S.word.length]).filter(w=>w!==S.word);
  if(!pool.length)return toast("nothing else fits the clue");
  S.word=pool[Math.floor(rnd()*pool.length)];
  S.seats.forEach(s=>{
    if(["call","crack","late","bust"].indexOf(s.state)>-1){
      s.guesses=[];s.marks=[];s.cracked=false;s.won=false;s.state="call";s.given=[];
      s.pool=S.pool.slice();s.last=null;s.nextAt=Date.now()+1400+rnd()*1800;
    }
  });
  const me=S.seats[0];
  if(me.state==="call"){
    kbState={};seedKb();S.row=0;S.cur="";S.myPool=S.pool.slice();
    if($("board")){buildBoard();paintKb();drawCands();}
  }
  S.settling=false;
  if(!S.tick)S.tick=setInterval(botTick,140);
  drawRivals();drawTable();drawTray();
  eventBanner(ico("dice")+" WORD SWAPPED",
    byName+" burned the die. The word is gone — a different one that fits the same clue "
    +"has taken its place, and every board on the table just reset.",4200);
}

/* ══════════ SCRAMBLE ══════════ */
let scramTimer=null;
function scrambleKeyboard(ms){
  const keys=[...document.querySelectorAll(".key")].filter(k=>/^[A-Z]$/.test(k.dataset.k));
  if(!keys.length)return;
  const orig=keys.map(k=>k.dataset.k);
  const sh=orig.slice();
  for(let i=sh.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));
    const t=sh[i];sh[i]=sh[j];sh[j]=t;}
  const put=arr=>keys.forEach((k,i)=>{k.textContent=arr[i];k.dataset.k=arr[i];});
  put(sh);paintKb();
  eventBanner(ico("scram")+" KEYBOARD SCRAMBLED",
    "Your keys have moved. They still type what they say — you just have to find them.",2600);
  clearTimeout(scramTimer);
  scramTimer=setTimeout(()=>{put(orig);paintKb();},ms);
}

/* ══════════ BOTS USING ITEMS ══════════ */
function botItemTick(){
  if(S.phase!=="play")return;
  /* ── not on the daily ──
     A power-up fired by a bot is wall-clock timed, and a word swap resets every
     board mid-hand. On a cash table that is drama. On the daily it means two
     people playing the identical six deals do not actually get the identical
     six deals, and it means no server can ever reproduce a score to pay it.
     The daily is the contest; the contest has to be the same for everyone. */
  if(S.daily)return;
  const me=S.seats[0];
  S.seats.forEach(b=>{
    if(b.you||b.state!=="call"||b.cracked||!b.items||!b.items.length)return;
    if(b.nextItem&&Date.now()<b.nextItem)return;
    b.nextItem=Date.now()+7000+rnd()*9000;
    if(rnd()>.42)return;
    const k=b.items[Math.floor(rnd()*b.items.length)];
    if(k==="scram"&&me.state==="call"&&!me.cracked&&me.guesses.length<GUESSES){
      spendItem(b,k);scrambleKeyboard(6000);Talk.on("item_scram",b,{lag:200});
      toast(b.name+" scrambled your keyboard",2600);
    }else if(k==="gift"&&me.state==="call"&&!me.cracked){
      const p=unknownLetter(S.word,me);
      if(p!=null){spendItem(b,k);applyLetter(me,p,b.name);Talk.on("item_gift",b,{lag:200});}
    }else if(k==="hint"){
      spendItem(b,k);Talk.on("item_hint",b,{lag:200});
      const p=unknownLetter(S.word,b);
      if(p!=null)applyLetter(b,p,null);
    }else if(k==="swap"&&b.guesses.length>=2){
      spendItem(b,k);doWordSwap(b.name);Talk.on("item_swap",b,{lag:200});
    }
  });
}

function centerNote(h){$("centerNote").innerHTML=h||"";}

/* ══════════ HAND FLOW ══════════ */
function startHand(){
  if(S.hand>=HANDS)return endGame();
  S.seats.forEach((s,i)=>{
    s.setter=(i===S.button);s.state="";s.guesses=[];s.marks=[];s.cracked=false;
    s.acting=false;s.pool=null;s.nextAt=0;s.given=[];s.ticking=false;s.deadline=0;s.won=false;
    s.nextItem=0;
  });
  S.pot=0;S.word=null;S.tell=null;S.stake=0;S.card=null;S.settling=false;S.arm=null;
  S.seats.forEach(x=>{x.lastSec=null;});
  Snd.round(S.hand+1);
  /* ante: every seat pays the setter for the deal */
  S.seats.forEach((s,i)=>{if(i!==S.button){s.chips-=ANTE;S.pot+=ANTE;}});
  drawTable();
  const setter=S.seats[S.button];
  if(setter.you)phaseDeal();else botSets();
}

/* Stratified deal, so the setter always has a real choice: one card from each
   fifth of that length's difficulty range. The five cards are always the same
   length as each other — the hand has a length, and everyone at the table is
   solving the same shape of problem. */
function dealLength(){
  /* five letters stays the centre of the game; four and six are the texture */
  const r=rnd();
  return r<.28?4:r<.72?5:6;
}
function dealCards(L){
  const len=L||dealLength(),deck=DECKS[len],b=BANDS[len];
  const edges=[[0,b[0]],[b[0]+1,b[1]],[b[1]+1,b[2]],[b[2]+1,b[3]],[b[3]+1,100]];
  return edges.map(e=>{
    let p=deck.filter(w=>RATE[w]>=e[0]&&RATE[w]<=e[1]);
    if(!p.length)p=deck;
    return p[Math.floor(rnd()*p.length)];
  }).sort((a,b)=>RATE[a]-RATE[b]);
}

/* ── phase 1: pick a card ── */
function phaseDeal(again){
  S.phase="deal";if(again)Snd.deal();      /* a fresh hand already riffled */
  const cards=again?S.hand5
    :((S.script&&S.script[S.hand]&&S.script[S.hand].cards)||dealCards());
  S.hand5=cards;
  stage().innerHTML=
   "<div class='panel'><div class='ttl'>YOUR DEAL</div>"
   +"<div class='sub'>You set the word this hand. The number is the <b>crack rate</b> — how often "
   +"players solve it in three, given an ordinary clue. <b>Lower is a stronger card.</b></div>"
   +"<div class='cards' id='cards'></div>"
   +"<div class='row'><button class='btn' id='pickBtn' disabled>CHOOSE A TELL</button></div>"
   +"<div id='tray'></div><div id='trayHint'></div></div>"
   +(S.tutorial?"<div class='tut'><b>Where the advantage is:</b> nobody sees your word — only the clue you "
     +"give next. If your word looks scary, everyone folds and you win almost nothing. The stars are in "
     +"a word that <b>looks</b> beatable and is not.</div>":"");
  const c=$("cards");
  cards.forEach(w=>{
    const r=RATE[w],b=bandOf(r,w.length);
    const d=document.createElement("div");d.className="wcard";
    d.innerHTML="<div class='w'>"+w+"</div><div class='r'>"+r+"%</div>"
      +"<div class='rl'>CRACKED</div>"
      +"<div class='bd' style='background:"+b[1]+";color:"+b[2]+"'>"+b[0]+"</div>";
    d.onclick=()=>{
      [...c.children].forEach(x=>x.classList.remove("sel"));
      d.classList.add("sel");S.card=w;$("pickBtn").disabled=false;
    };
    c.appendChild(d);
  });
  $("pickBtn").onclick=()=>{if(S.card){S.word=S.card;phaseTell();}};
  drawTray();
  centerNote("you are on<br>the button");
}

/* ── phase 2: pick a tell ── */
function phaseTell(){
  S.phase="tell";
  const opts=offerTells(S.word);S.tellOpts=opts;
  let h="<div class='panel'><div class='ttl'>YOUR TELL — "+S.word+"</div>"
   +"<div class='sub'>You must give the table one clue. The count is how many words in the deck "
   +"still fit afterwards — <b>only you see it.</b></div><div class='tells' id='tells'></div>"
   +"<div class='row'><button class='btn' id='tellBtn' disabled>SET THE DIFFICULTY</button></div></div>";
  if(S.tutorial)h+="<div class='tut'>A clue that <b>feels</b> generous but leaves a crowded family "
   +"alive is the best card in the game. Pinning the last letter of <b>WATCH</b> looks like a gift — "
   +"then they drown in BATCH, CATCH, HATCH, LATCH, MATCH, PATCH.</div>";
  stage().innerHTML=h;
  const box=$("tells");
  opts.forEach(t=>{
    const tx=tellText(t);
    const d=document.createElement("div");d.className="tell";
    d.innerHTML="<div class='mini'>"+tellTiles(t,S.word.length)+"</div>"
      +"<div class='tx'><b>"+tx[0]+"</b><span>"+tx[1]+"</span></div>"
      +"<div class='cnt'>"+t.n+"<em>LEFT</em><u>MAX "+capFor(t.n,S.word.length)+"</u></div>";
    d.onclick=()=>{[...box.children].forEach(x=>x.classList.remove("sel"));
      d.classList.add("sel");S.tell=t;$("tellBtn").disabled=false;};
    box.appendChild(d);
  });
  $("tellBtn").onclick=()=>{if(S.tell)phasePrice();};
  centerNote("choose what<br>to give away");
}

/* ── phase 3: set the price ── */
function phasePrice(){
  S.phase="price";
  stage().innerHTML=
   "<div class='panel'><div class='ttl'>SET THE DIFFICULTY</div>"
   +"<div class='sub'>Anyone who calls matches this much, <b>one for one</b>. Crack it and you hand over "
   +"them. Miss it and they hand it to you. <b>You gave away "+S.tell.n+" words, so your ceiling is "
   +capFor(S.tell.n,S.word.length)+".</b></div>"
   +"<div class='stakes' id='stk'></div>"
   +"<div class='row'><button class='btn go' id='goBtn' disabled>DEAL IT</button></div></div>"
   +"<div id='tellBar'><div class='mini'>"+tellTiles(S.tell,S.word.length)+"</div>"
   +"<div class='tt'><b>YOUR TELL</b>"+tellText(S.tell)[1]+"</div></div>";
  const box=$("stk");
  const cap=capFor(S.tell.n,S.word.length);
  STAKES.forEach((v,i)=>{
    const d=document.createElement("div");d.className="stk"+(v>cap?" off":"");
    d.innerHTML="<b>"+v+"</b><span>"+(v>cap?"LOCKED":["SOFT","MID","HARD"][i])+"</span>";
    if(v<=cap)d.onclick=()=>{[...box.children].forEach(x=>x.classList.remove("sel"));
      d.classList.add("sel");S.stake=v;$("goBtn").disabled=false;};
    box.appendChild(d);
  });
  $("goBtn").onclick=()=>{if(S.stake){Snd.chime();phaseAction();}};
  centerNote("max swing<br>&plusmn;500");
}

/* ── bot as setter ── */
function botSets(){
  const b=S.seats[S.button];
  if(S.script&&S.script[S.hand]&&S.script[S.hand].word){
    const sc=S.script[S.hand];
    S.word=S.card=sc.word;S.tell=sc.tell;S.stake=sc.stake;
    S.log.push({hand:S.hand,setter:b.name,word:sc.word,rate:RATE[sc.word]});
    return phaseAction();
  }
  const cards=dealCards();
  /* bots prefer sharp cards but not always -- a soft card with a nasty tell also works */
  const pick=rnd()<.62?cards[0]:cards[Math.floor(rnd()*3)];
  S.word=S.card=pick;
  const opts=offerTells(pick);
  /* the bait: pick a tell that looks helpful (a pin) but leaves a crowd, when one exists */
  const baits=opts.filter(t=>t.k==="pin"&&t.n>=14&&t.n<=200);
  const hide=opts.filter(t=>t.k!=="pin");
  S.tell=baits.length&&rnd()<(b.baity||.6)?baits[Math.floor(rnd()*baits.length)]
        :(hide.length?hide[Math.floor(rnd()*hide.length)]:opts[Math.floor(rnd()*opts.length)]);
  const conf=1-RATE[pick]/100;
  S.stake=conf>.62?100:conf>.5?50:25;
  if(rnd()<.2)S.stake=STAKES[Math.floor(rnd()*3)];
  S.stake=Math.min(S.stake,capFor(S.tell.n,S.word.length));
  S.log.push({hand:S.hand,setter:b.name,word:pick,rate:RATE[pick]});
  phaseAction();
}

/* ── phase 4: the action ── */
function phaseAction(){
  S.phase="action";
  S.pool=survivors(S.tell,DECKS[S.word.length]);
  drawTable();
  const setter=S.seats[S.button];
  stage().innerHTML=
   "<div id='tellBar'><div class='mini'>"+tellTiles(S.tell,S.word.length)+"</div>"
   +"<div class='tt'><b>"+setter.name+(setter.you?" — YOUR TELL":"&rsquo;S TELL")+"</b>"
   +tellText(S.tell)[1]+"</div></div>"
   +"<div class='panel' id='actP'><div class='ttl'>THE ACTION</div>"
   +"<div class='facts'><span><u>TO CALL</u>"+S.stake+"</span>"
   +"<span><u>IF YOU WIN</u>+"+S.stake+"</span>"
   +"<span><u>GUESSES</u>"+GUESSES+"</span></div>"
   +"<div class='sub' id='actS'></div><div class='row' id='actR'></div>"
   +"<div id='tray'></div><div id='trayHint'></div></div>";
  centerNote("claim "+S.stake+"<br>one for one");
  /* order: seats after the button, wrapping */
  S.order=[];for(let k=1;k<SEATS;k++)S.order.push((S.button+k)%SEATS);
  S.oi=0;stepAction();
}
function stepAction(){
  if(S.oi>=S.order.length)return afterAction();
  const s=S.seats[S.order[S.oi]];
  S.seats.forEach(x=>x.acting=false);s.acting=true;drawTable();
  if(s.you){S.awaitingHuman=true;return humanAction(s);}
  setTimeout(()=>{
    const call=botDecides(s);
    s.state=call?"call":"fold";Talk.on(call?"bot_call":"bot_fold",s);
    if(call){s.chips-=S.stake;S.pot+=S.stake;betAnim(s.i,S.stake);}
    s.acting=false;S.oi++;drawTable();stepAction();
  },520+rnd()*520);
}
function botDecides(s){
  /* bot estimates its own crack odds from the tell, then misreads them by its optimism */
  const est=withRng(S.daily?mulberry32(hashStr(todayKey()+":d"+S.hand+":"+s.i)):rnd,
    ()=>crackOdds(S.word,S.pool,10));
  const p=Math.min(.97,Math.max(.03,est+s.optimism*LEGIB[S.tell.k]+PINBIAS[S.tell.k]));
  let bar=.5+s.tight;
  bar+=(S.stake-50)/100*.06;                      /* bigger price, tighter */
  const called=S.seats.filter(x=>x.state==="call").length;
  bar-=called*.02;                                /* a little herding */
  return p>bar;
}
/* ── the fold ritual ──
   Folding is the one move no other word game has, so it gets a moment: a
   650ms hold (release early and nothing happened), then the clue tiles tip
   face-down, an ochre rule closes the hand, and the Dealer says one line.
   Under automation (navigator.webdriver) it is instant, so the suites and
   any harness keep working; set window.__ritual=true to force the full
   ceremony there. Haptics ride the native bridge and are a no-op on the web. */
function hap(k){try{const C=window.Capacitor,H=C&&C.Plugins&&C.Plugins.Haptics;if(!H)return;
  H.impact({style:k==="heavy"?"HEAVY":k==="medium"?"MEDIUM":"LIGHT"});}catch(e){}}
const fastPath=()=>(navigator.webdriver===true&&!window.__ritual)||matchMedia("(prefers-reduced-motion:reduce)").matches;
function holdToFold(b,commit){
  let t=null,done=false;
  if(fastPath()){b.onclick=()=>{if(done)return;done=true;commit();};return;}
  const arm=e=>{if(done)return;if(e.cancelable)e.preventDefault();b.classList.add("arming");
    t=setTimeout(()=>{done=true;b.classList.remove("arming");b.classList.add("held");commit();},650);};
  const cancel=()=>{if(t){clearTimeout(t);t=null;}if(!done)b.classList.remove("arming");};
  b.onpointerdown=arm;b.onpointerup=cancel;b.onpointerleave=cancel;b.onpointercancel=cancel;
  b.onclick=e=>{e.preventDefault();if(!done&&!t)toast("hold to fold");};
}
function foldRitual(then){
  if(fastPath())return then();
  const tiles=[...document.querySelectorAll("#tellBar .mini i")];
  tiles.forEach((t,i)=>setTimeout(()=>t.classList.add("tip"),i*40));
  const r=$("actR");
  if(r)r.innerHTML="<div class='foldwrap'><div class='foldrule'></div><div class='dealer'>Folded. Your stars stay where they are.</div></div>";
  requestAnimationFrame(()=>{const fr=document.querySelector(".foldrule");if(fr)fr.classList.add("draw");});
  setTimeout(()=>{tiles.forEach(t=>t.classList.remove("tip"));then();},820);
}
function canLeave(){const me=S.seats&&S.seats[0];
  return !!(S.seats&&S.phase&&S.phase!=="payout"&&!S.daily&&me&&me.state!=="call");}
function humanAction(s){
  const called=S.seats.filter(x=>x.state==="call").length;
  const acted=S.order.slice(0,S.oi).map(i=>S.seats[i]);
  const folded=acted.filter(x=>x.state==="fold").length;
  $("actS").innerHTML="Beat "+S.seats[S.button].name+" by cracking it in <b>"+BET
    +"</b>. The "+GUESSES+"th is a free swing \u2014 it finishes the word but settles nothing."
    +(acted.length?"<br><span style='color:#8fa0b5'>So far: "+called+" called, "+folded
      +" folded.</span>":"");
  $("actR").innerHTML=
    "<button class='btn dan' id='foldB'>FOLD<small>keep your stars</small></button>"
   +"<button class='btn go' id='callB'>CALL "+S.stake+"<small>play the hand</small></button>";
  holdToFold($("foldB"),()=>{S.awaitingHuman=false;s.state="fold";s.acting=false;S.oi++;
    Snd.fold();hap("heavy");Talk.on("you_fold");foldRitual(()=>{drawTable();stepAction();});});
  $("callB").onclick=()=>{S.awaitingHuman=false;s.state="call";s.chips-=S.stake;S.pot+=S.stake;Talk.on("you_call");
    betAnim(0,S.stake);s.acting=false;S.oi++;drawTable();stepAction();};
  drawTray();
  if(S.tutorial)$("actP").insertAdjacentHTML("beforeend",
    "<div class='tut' style='margin-top:9px'>Judge the clue, not the player. <b>A voided rare letter "
    +"tells you almost nothing</b> — no Z rules out a handful of words. A voided S or a pinned vowel "
    +"is real information. If the clue is thin, fold and keep your stack.</div>");
}
function afterAction(){
  S.seats.forEach(x=>x.acting=false);
  const callers=S.seats.filter(x=>x.state==="call");
  drawTable();
  if(!callers.length){
    toast("Everybody folded — you only collect the entries",2600);
    S.settling=true;return setTimeout(showdown,1400);
  }
  countIn(phasePlay);
}

/* ── on your marks ──
   Three beats between the betting closing and the keyboard appearing, so a hand
   starts on a shared moment rather than a screen quietly changing. Nobody moves
   during it -- the bots are not ticking yet -- so the count is real rather than
   decorative. Only for someone who actually called; a player who folded is
   watching, and does not need to be counted in to nothing. */
function countIn(then){
  const el=$("cd"),me=S.seats[0];
  if(!el||!me||me.state!=="call")return then();
  const beat=440,steps=[["3",3],["2",2],["1",1],["GO",0]];
  const timers=[];let done=false;
  const finish=()=>{
    if(done)return;done=true;
    timers.forEach(clearTimeout);
    removeEventListener("pointerdown",skip,true);
    removeEventListener("keydown",skip,true);
    el.classList.remove("on");el.innerHTML="";
    then();
  };
  /* Nobody should be held at a countdown they have watched a hundred times.
     Touch anything and it rings the bell and gets out of the way. */
  const skip=()=>{if(!done){Snd.go();finish();}};
  addEventListener("pointerdown",skip,true);
  addEventListener("keydown",skip,true);
  el.classList.add("on");
  steps.forEach((step,i)=>timers.push(setTimeout(()=>{
    if(S.phase!=="action")return;                  /* the hand moved on without us */
    el.innerHTML="<b"+(step[1]?"":" class='go'")+">"+step[0]+"</b>";
    if(step[1])Snd.count(step[1]);else Snd.go();
  },i*beat)));
  timers.push(setTimeout(finish,3*beat+360));
}

/* ── phase 5: play the hand ── */
let kbState={};
function phasePlay(){
  S.phase="play";
  const me=S.seats[0];
  const iPlay=me.state==="call";
  kbState={};
  const callers=S.seats.filter(x=>x.state==="call");
  let h="<div id='tellBar'><div class='mini'>"+tellTiles(S.tell,S.word.length)+"</div>"
   +"<div class='tt'><b>THE TELL</b>"+tellText(S.tell)[1]+"</div></div>";
  if(me.setter){
    h+="<div class='panel'><div class='ttl'>YOU SET "+S.word+"</div>"
      +"<div class='sub'>"+callers.length+" called at "+S.stake+". Every one that misses hands you the claim.</div>"
      +"<div style='margin:10px 0 4px;font-size:9px;letter-spacing:.14em;color:#8fa0b5'>TABLE HEAT</div>"
      +"<div id='heat'><div id='heatF'></div></div></div>";
  }else if(!iPlay){
    h+="<div class='panel'><div class='ttl'>YOU FOLDED</div>"
      +"<div class='sub'>Sitting this one out. Watching is free.</div></div>";
  }
  h+="<div id='rivals'></div>";
  if(iPlay){
    h+="<div id='board'></div><div id='cands'></div>"
      +"<div id='tray'></div><div id='trayHint'></div><div id='kb'></div>";
  }
  stage().innerHTML=h;
  if(iPlay){seedKb();buildBoard();buildKb();paintKb();me.pool=null;
    S.myPool=S.pool.slice();drawTray();drawCands();}
  if(S.speed)S.seats.forEach(x=>{if(x.state==="call")x.deadline=Date.now()+CLOCK_TOTAL;});
  drawRivals();
  centerNote(iPlay?BET+" to beat it":"watching");
  /* start bots */
  callers.forEach(b=>{
    if(b.you)return;
    b.pool=S.pool.slice();b.last=null;b.nextAt=Date.now()+900+rnd()*1600;
    b.rng=S.daily?mulberry32(hashStr(todayKey()+":h"+S.hand+":"+b.i)):null;
  });
  S.waited=false;
  S.tick=setInterval(botTick,140);
}
function seedKb(){
  const t=S.tell;
  if(t.k==="pin")kbState[t.c]="h";
  else if(t.k==="float")kbState[t.c]="n";
  else [...t.c].forEach(c=>kbState[c]="m");
}
function givenTiles(){
  const t=S.tell,L=S.word.length;let out="";
  if(t.k==="pin"){for(let i=0;i<L;i++)
    out+=i===t.i?"<div class='tile h'>"+t.c+"</div>":"<div class='tile'></div>";}
  else if(t.k==="float"){out="<div class='tile n'>"+t.c+"</div>";
    for(let i=0;i<L-1;i++)out+="<div class='tile'></div>";}
  else{out=[...t.c].map(c=>"<div class='tile m'>"+c+"</div>").join("");
    for(let i=0;i<L-2;i++)out+="<div class='tile'></div>";}
  return out;
}
function drawCands(){
  const el=$("cands");if(!el)return;
  const n=(S.myPool||[]).length;
  el.innerHTML=n>1?"<b>"+n+"</b> words still fit"
    :n===1?"<b>one</b> word still fits":"nothing in the deck fits \u2014 trust your letters";
  el.className=n&&n<=6?"tight":"";
}
function narrowCands(){
  const me=S.seats[0];
  if(!S.myPool)S.myPool=S.pool.slice();
  const g=me.guesses[me.guesses.length-1],m=me.marks[me.marks.length-1];
  if(g)S.myPool=S.myPool.filter(w=>consistent(w,g,m));
  (me.given||[]).forEach(i=>{S.myPool=S.myPool.filter(w=>w[i]===S.word[i]);});
  drawCands();
}
function buildBoard(){
  const b=$("board"),L=S.word.length;b.innerHTML="";
  /* the board is as wide as the hand, and says so, because arriving at a
     four-letter row expecting five is a bad first half-second */
  b.dataset.len=L;
  b.style.setProperty("--cols",L);
  const gv=document.createElement("div");gv.className="brow given";
  gv.innerHTML=givenTiles();b.appendChild(gv);
  for(let r=0;r<GUESSES;r++){
    const row=document.createElement("div");
    row.className="brow"+(r>=BET?" free":"");row.id="r"+r;
    for(let c=0;c<L;c++){const t=document.createElement("div");t.className="tile";row.appendChild(t);}
    b.appendChild(row);
  }
  S.row=0;S.cur="";
}
const KB=["QWERTYUIOP","ASDFGHJKL","↵ZXCVBNM⌫"];
function buildKb(){
  const k=$("kb");k.innerHTML="";k.classList.remove("off");
  KB.forEach(r=>{
    const d=document.createElement("div");d.className="krow";
    r.split("").forEach(c=>{
      const b=document.createElement("button");
      b.className="key"+(c==="↵"||c==="⌫"?" wide":"");
      b.textContent=c==="↵"?"ENTER":c;
      b.dataset.k=c;
      /* pointerdown, not click: iOS cancels a click when the finger slides a few
         pixels, which fast typing does constantly, and click waits for the tap to
         end. The key is read at press time so a scrambled keyboard stays honest. */
      b.onpointerdown=e=>{if(e.pointerType==="mouse"&&e.button!==0)return;e.preventDefault();
        const kk=b.dataset.k;press(kk==="↵"?"ENTER":kk==="⌫"?"BACK":kk);};
      b.onclick=e=>e.preventDefault();
      d.appendChild(b);
    });
    k.appendChild(d);
  });
}
function press(k){
  if(S.phase!=="play")return;
  const me=S.seats[0];if(me.cracked||me.guesses.length>=GUESSES)return;
  if(k==="BACK"){S.cur=S.cur.slice(0,-1);paintRow();Snd.key();return;}
  if(k==="ENTER")return submit();
  if(!/^[A-Z]$/.test(k))return;
  /* a full row never goes dead: the next letter replaces the last one, so a
     refused word can be corrected without hunting for the delete key. The row
     paints before the sound plays -- the letter is the point, the click is not. */
  if(S.cur.length>=S.word.length)S.cur=S.cur.slice(0,-1)+k;else S.cur+=k;
  const row=$("r"+S.row);if(row)row.classList.remove("bad");
  paintRow();Snd.key();hap("light");
}
function paintRow(){
  const row=$("r"+S.row);if(!row)return;
  [...row.children].forEach((t,i)=>{
    t.textContent=S.cur[i]||"";
    t.className="tile"+(S.cur[i]?" f":"");
  });
}
const NUMWORD={4:"four",5:"five",6:"six"};
function submit(){
  const me=S.seats[0],L=S.word.length;
  if(S.cur.length<L)return toast(NUMWORD[L]+" letters");
  /* It used to be enough to have a vowel in it, which made AEIOU a legal
     guess — and a non-word probe is strictly better than a real one, because
     it can test a whole row of fresh letters at once. The board was quietly
     ranking people who knew that. */
  if(!isWord(S.cur)){const r=$("r"+S.row);r.classList.add("bad");Snd.no();
    setTimeout(()=>r.classList.remove("bad"),340);return toast("not in the word list");}
  const res=evaluate(S.cur,S.word);
  const row=$("r"+S.row);
  [...row.children].forEach((t,i)=>{
    setTimeout(()=>{t.classList.add("pre");},i*85);
    setTimeout(()=>{t.className="tile "+res[i];Snd.tile(res[i]);if(i===0)hap("medium");},i*85+110);
  });
  res.forEach((v,i)=>{
    const c=S.cur[i],cur=kbState[c];
    if(v==="h"||(v==="n"&&cur!=="h")||(!cur))kbState[c]=v;
  });
  setTimeout(paintKb,570);
  me.guesses.push(S.cur);me.marks.push(res);
  narrowCands();setTimeout(drawTray,60);
  const solved=S.cur===S.word;
  S.cur="";S.row++;
  drawRivals();
  if(solved){
    me.cracked=true;
    me.won=me.guesses.length<=BET;
    me.state=me.won?"crack":"late";Talk.on(me.won?"you_crack":"you_late");
    setTimeout(()=>Snd.crack(),470);
    return setTimeout(checkDone,700);
  }
  if(S.row>=GUESSES){me.state="bust";Talk.on("you_miss");setTimeout(()=>Snd.bust(),470);
    return setTimeout(checkDone,700);}
}
function paintKb(){
  document.querySelectorAll(".key").forEach(b=>{
    const s=kbState[b.dataset.k];
    b.className="key"+(b.dataset.k==="↵"||b.dataset.k==="⌫"?" wide":"")+(s?" "+s:"");
  });
  /* a keyboard that cannot type says so, instead of sitting there looking live */
  const kb=$("kb"),me=S.seats&&S.seats[0];
  if(kb)kb.classList.toggle("off",!!(S.phase!=="play"||!me||me.cracked||me.guesses.length>=GUESSES));
  if(typeof talkBarState==="function")talkBarState();
}
function botTick(){
  const now=Date.now();
  S.seats.forEach(b=>{
    if(b.you||b.state!=="call"||b.cracked||b.guesses.length>=GUESSES)return;
    if(now<b.nextAt)return;
    b.nextAt=now+b.pace;
    withRng(b.rng||rnd,()=>{
    if(b.last&&rnd()<b.skill)
      b.pool=b.pool.filter(w=>consistent(w,b.last,b.marks[b.marks.length-1]));
    if(!b.pool.length)b.pool=S.pool.slice();
    let g;
    if(!b.guesses.length){
      const o=(OPEN[S.word.length]||[]).filter(w=>b.pool.includes(w));
      g=o.length?o[Math.floor(rnd()*o.length)]:b.pool[Math.floor(rnd()*b.pool.length)];
    }else g=b.pool[Math.floor(rnd()*b.pool.length)];
    const r=evaluate(g,S.word);
    b.guesses.push(g);b.marks.push(r);b.last=g;
    if(g===S.word){b.cracked=true;b.won=b.guesses.length<=BET;
      b.state=b.won?"crack":"late";Talk.on(b.won?"bot_crack":"bot_late",b);}
    else if(b.guesses.length>=GUESSES){b.state="bust";Talk.on("bot_miss",b);}
    });
  });
  drawRivals();updateHeat();botItemTick();clockTick();
  checkDone();
}
function drawRivals(){
  const box=$("rivals");if(!box)return;
  const callers=S.seats.filter(x=>["call","crack","late","bust"].indexOf(x.state)>-1);
  box.innerHTML=callers.filter(s=>!s.you||S.seats[0].state!=="call").map(s=>{
    let rows=s.marks.map(m=>"<div>"+m.map(v=>"<i class='"+(v==="m"?"":v)+"'></i>").join("")+"</div>").join("");
    if(!s.marks.length)rows="<div class='idle'>&middot;&middot;&middot;</div>";
    return "<div class='rv"+(s.cracked?" done":s.state==="bust"?" fail":"")+"'>"
      +"<div class='n'>"+(s.you?myFace():faceOf(s.name))+" "+(s.you?"YOU":s.name)
      +"</div><div class='g'>"+rows+"</div></div>";
  }).join("");
}
function updateHeat(){
  const f=$("heatF");if(!f)return;
  let best=0;
  S.seats.forEach(s=>{
    if(["call","crack","late","bust"].indexOf(s.state)<0)return;
    if(s.cracked)return best=1;
    const m=s.marks[s.marks.length-1];if(!m)return;
    const v=(m.filter(x=>x==="h").length*2+m.filter(x=>x==="n").length)/10;
    if(v>best)best=v;
  });
  f.style.width=Math.min(100,best*100)+"%";
}
function clockTick(){
  if(!S.speed||S.phase!=="play")return;
  const now=Date.now();let redraw=false;
  S.seats.forEach(x=>{
    if(x.state!=="call"||x.cracked||!x.deadline){if(x.ticking){x.ticking=false;redraw=true;}return;}
    const left=x.deadline-now;
    if(left<=0){
      x.state="bust";x.ticking=false;redraw=true;
      if(x.you){Snd.bust();eventBanner(ico("clock")+" TIME","Ninety seconds gone. The hand is over for you.",3000);}
      else toast(x.name+" ran out of time",2000);
    }else if(left<=CLOCK_SHOW&&!x.ticking){x.ticking=true;redraw=true;if(x.you)Snd.warn();}
    else if(x.ticking){
      redraw=true;
      /* the last ten seconds get a heartbeat -- one blip a second, yours only */
      if(x.you){const sec=Math.ceil(left/1000);
        if(sec<=10&&sec!==x.lastSec){x.lastSec=sec;Snd.tick();}}
    }
  });
  if(redraw)drawTable();
}
function checkDone(){
  const live=S.seats.filter(s=>s.state==="call"&&!s.cracked&&s.guesses.length<GUESSES);
  if(live.length){
    if(!S.waited&&live.length===1&&live[0].you){
      S.waited=true;toast("Table is done. Take your time.",2400);
    }
    return;
  }
  clearInterval(S.tick);
  if(S.settling)return;          /* the human and the bot loop can both land here */
  S.settling=true;
  setTimeout(showdown,900);
}

/* ── phase 6: showdown ── */
function showdown(){
  if(S.phase==="showdown")return;
  S.phase="showdown";clearInterval(S.tick);
  const setter=S.seats[S.button];
  const callers=S.seats.filter(x=>["call","crack","late","bust"].indexOf(x.state)>-1);
  Talk.showdown(setter,callers);
  let net=ANTE*(SEATS-1);           /* antes already in the pot, all to the setter */
  let cracked=0;
  callers.forEach(s=>{
    if(s.won){s.chips+=S.stake*2;setter.chips-=S.stake;net-=S.stake;cracked++;}
    else{setter.chips+=S.stake;net+=S.stake;}
  });
  setter.chips+=ANTE*(SEATS-1);
  callers.forEach((x,i)=>setTimeout(()=>{
    if(x.cracked)flyChips(setter.i,x.i,chipCount(S.stake),"green");
    else flyChips(x.i,setter.i,chipCount(S.stake),"red");
  },i*170));
  S.pot=0;S.arm=null;drawTable();
  recordHand(callers,cracked,net);
  grantHandItems(callers,cracked);

  const rows=S.seats.map(s=>{
    let d,delta;
    if(s.setter){d=callers.length?"set "+S.word+", "+callers.length+" called":"set "+S.word+", no takers";delta=net;}
    else if(s.cracked){d="cracked it";delta=S.stake-ANTE;}
    else if(s.state==="bust"){d="missed";delta=-S.stake-ANTE;}
    else{d="folded";delta=-ANTE;}
    return "<tr"+(s.you?" class='me'":"")+"><td>"+(s.you?"YOU":s.name)+"</td>"
      +"<td class='d'>"+d+"</td><td style='color:"+(delta>0?"#94a8cb":delta<0?"#c96a57":"#8fa0b5")
      +"'>"+(delta>0?"+":"")+delta+"</td></tr>";
  }).join("");

  const me=S.seats[0];
  let verdict;
  if(me.setter)verdict=!callers.length
      ?"Nobody would touch it. You collect the entries and nothing else — that is what a clue "
       +"too thin to tempt anyone is worth."
    :cracked===0?"Nobody got it. You take the table."
    :cracked>=callers.length?"Everyone cracked it. That word was too kind."
    :cracked+" of "+callers.length+" cracked it.";
  else if(me.cracked)verdict="You cracked it.";
  else if(me.state==="bust")verdict="You missed. "+setter.name+" takes your claim.";
  else verdict="You folded. "+(cracked?"Someone got it anyway.":"Good laydown — nobody cracked it.");

  ovShow(
    "<div style='font-size:9px;letter-spacing:.2em;color:#8fa0b5'>THE WORD WAS</div>"
    +"<h1 style='font-size:32px;letter-spacing:.16em;margin:4px 0 2px'>"+S.word+"</h1>"
    +wordCard(S.word)
    +"<div style='font-size:10px;color:#8fa0b5;letter-spacing:.08em;margin-top:8px'>beaten by "
    +RATE[S.word]+"% &middot; "+tellText(S.tell)[1]+"</div>"
    +"<p style='margin-top:12px'><b>"+verdict+"</b></p>"
    +"<table class='lb'>"+rows+"</table>"
    +"<div class='row'><button class='btn' id='nx'>"
    +(S.hand+1>=HANDS?"FINAL STANDINGS":"NEXT HAND")+"</button></div>");
  $("nx").onclick=()=>{
    ovHide();S.tutorial=(P.matches===0&&S.hand<1);S.hand++;S.button=(S.button+1)%SEATS;startHand();
  };
}

/* ══════════ THE RECORD ══════════ */
/* A score built out of decisions rather than chips: what you cracked, what you
   held, and what you correctly refused to play. Nothing here is a currency. */
function handScore(callers,cracked){
  const me=S.seats[0],rate=RATE[S.word];
  if(me.setter)return callers.length?(cracked?Math.max(0,40-cracked*15)
    :60*callers.length):15;
  if(me.won)return 100+(100-rate);
  if(me.state==="late")return 30;
  if(me.state==="bust")return 0;
  return callers.length?(cracked?0:45):10;      /* a laydown only scores if it was tested */
}
function recordHand(callers,cracked,net){
  const me=S.seats[0];
  let role,d,sym;
  if(me.setter){
    role="set";d=net;
    P.setHands++;P.setChips+=net;P.setCrackedBy+=cracked;
    if(!callers.length)P.setNoTakers++;else if(!cracked)P.setHeld++;
    sym=(callers.length&&!cracked)?SYM.held:(d>0?SYM.up:SYM.down);
    if(net>P.bigPot){P.bigPot=net;
      P.bigHand={word:S.word,rate:RATE[S.word],callers:callers.length,take:net};}
    if(!cracked&&callers.length>=2&&(!P.bestBluff||net>P.bestBluff.take))
      P.bestBluff={word:S.word,rate:RATE[S.word],callers:callers.length,take:net};
  }else if(me.won){
    role="crack";d=S.stake-ANTE;P.called++;P.cracked++;P.callChips+=d;sym=SYM.up;
  }else if(me.state==="late"){
    role="late";d=-S.stake-ANTE;P.called++;P.late=(P.late||0)+1;P.callChips+=d;sym=SYM.down;
  }else if(me.state==="bust"){
    role="miss";d=-S.stake-ANTE;P.called++;P.missed++;P.callChips+=d;sym=SYM.down;
  }else{
    role="fold";d=-ANTE;P.foldedN++;P.callChips+=d;sym=SYM.fold;
    /* a laydown only counts as a read if somebody else actually played the hand */
    if(callers.length){P.foldsJudged++;if(!cracked)P.goodFolds++;}
  }
  /* money landing is the sound people are here for -- it plays the moment the
     hand pays, not only when the whole match settles up */
  if(d>0)setTimeout(()=>Snd.stars(d),420);
  const cls=sym===SYM.held?"held":sym===SYM.fold?"fold":sym===SYM.up?"up":"down";
  S.score=(S.score||0)+handScore(callers,cracked);
  S.strip.push({role:role,d:d,sym:sym,cls:cls,word:S.word,rate:RATE[S.word],
    callers:callers.length,cracked:cracked});
  /* the transcript the server will re-score: what was decided, never what it
     came to. Taken here rather than at each button because by now the hand has
     settled and the state is the thing that actually happened. */
  if(S.daily)S.tape.push(me.setter
    ?{word:S.word,tell:{k:S.tell.k,c:S.tell.c,i:S.tell.i},stake:S.stake}
    :role==="fold"?{call:false}
    :{call:true,guesses:me.guesses.slice()});
}

/* Items are earned by doing the hard things: holding a word, cracking one,
   or laying down a hand nobody else could beat. Never sold. */
function grantHandItems(callers,cracked){
  const me=S.seats[0];let got=null;
  if(me.setter&&callers.length&&!cracked)got=grantItem(me);
  else if(me.cracked)got=grantItem(me);
  else if(me.state==="fold"&&callers.length&&!cracked)got=grantItem(me);
  if(got)setTimeout(()=>toast("Power-up earned \u2014 "+ITEMS[got].lb,2800),750);
  S.seats.forEach(x=>{if(!x.you&&rnd()<.34)grantItem(x);});
}

/* ══════════ MATCH LIFECYCLE ══════════ */
function withRng(g,fn){const s=rnd;rnd=g;try{return fn();}finally{rnd=s;}}

/* The daily is scripted up front: same cards, same words, same clues, same difficulty
   for everyone, so the only variable is how you play it. */
let S_SEATED=null;
function buildScript(seated){
  S_SEATED=seated;
  const sc=[];
  for(let h=0;h<HANDS;h++){
    const cards=dealCards();
    if(h===0){sc.push({cards:cards});continue;}          /* the button starts on you */
    const pick=rnd()<.62?cards[0]:cards[Math.floor(rnd()*3)];
    const opts=offerTells(pick);
    /* the bait band is a share of that length's deck, not a flat count, so a
       trap looks the same at four letters as it does at six */
    const N=DECKS[pick.length].length;
    const baits=opts.filter(t=>t.k==="pin"&&t.n>=14/749*N&&t.n<=200/749*N);
    const style=(S_SEATED&&S_SEATED[h-1]&&S_SEATED[h-1].style)||"solid";
    const wantsBait=style==="tricky"?.82:style==="loose"?.42:.55;
    const hide=opts.filter(t=>t.k!=="pin");
    const tell=baits.length&&rnd()<wantsBait?baits[Math.floor(rnd()*baits.length)]
              :(hide.length?hide[Math.floor(rnd()*hide.length)]:opts[Math.floor(rnd()*opts.length)]);
    const conf=1-RATE[pick]/100;
    let stake=conf>.62?100:conf>.5?50:25;
    if(rnd()<.2)stake=STAKES[Math.floor(rnd()*3)];
    sc.push({cards:cards,word:pick,tell:tell,stake:Math.min(stake,capFor(tell.n,pick.length))});
  }
  return sc;
}

function startMatch(mode,code){
  const daily=(mode==="daily"),speed=(mode==="speed"),coded=(mode==="code");
  /* the daily never asks for a stake — see the note by REBUY_HOURS */
  if(!daily&&P.bankroll<BUYIN){ stakeUp(); if(P.bankroll<BUYIN)return screenRebuy(); }
  setSeed(daily?hashStr("bluff-"+todayKey()):coded?hashStr("bluff-table-"+code):null);
  Mus.hype(!!speed);            /* the clock deserves the loud one */
  Snd.start();
  newGame(daily||coded,speed);
  if(coded)S.code=code;
  ovHide();startHand();
  if(coded)setTimeout(()=>eventBanner("TABLE "+code,
    "Everyone who plays this code gets these exact six deals. Compare when you are done.",3200),450);
  if(speed)setTimeout(()=>eventBanner(ico("bolt")+" SPEED TABLE",
    "Ninety seconds a hand. The clock stays hidden until the last thirty, then "
    +"the whole table watches it burn.",3600),450);
}

function newGame(isDaily,isSpeed){
  const daily=!!isDaily;
  const pool=daily?blankRivals():R;
  let seated;
  if(daily){
    const p=pool.slice();
    for(let i=p.length-1;i>0;i--){const j=Math.floor(rnd()*(i+1));const t=p[i];p[i]=p[j];p[j]=t;}
    seated=p.slice(0,5);
  }else seated=seatRivals();

  S={
    hand:0,button:0,phase:"",word:null,card:null,tell:null,stake:0,pot:0,
    tutorial:P.matches===0,daily:daily,speed:!!isSpeed,strip:[],log:[],tape:[],arm:null,
    script:daily?buildScript(seated):null,
    session:{delta:0,place:0},score:0,
    seats:[{i:0,you:true,name:P.handle||"YOU",chips:BUYIN,state:"",guesses:[],marks:[],
            cracked:false,setter:false,rival:{rating:P.rating,name:P.handle}}]
  };
  seated.forEach((r,k)=>{
    const b=botParams(r);
    S.seats.push({i:k+1,you:false,name:r.name,chips:BUYIN,state:"",guesses:[],marks:[],
      cracked:false,setter:false,rival:r,
      optimism:b.optimism,tight:b.tight,skill:b.skill,baity:b.baity,pace:b.pace});
  });
  lastChips={};
  S.seats.forEach(x=>{x.items=[];x.given=[];});
  grantItem(S.seats[0]);
  S.seats.forEach(x=>{if(!x.you&&rnd()<.6)grantItem(x);});
}

/* ══════════ END OF MATCH ══════════ */
function endGame(){
  const sorted=S.seats.slice().sort((a,b)=>b.chips-a.chips);
  const me=S.seats[0];
  const place=sorted.indexOf(me)+1, delta=me.chips-BUYIN;
  const field=S.seats.filter(s=>!s.you).reduce((a,s)=>a+s.rival.rating,0)/5;

  const before=P.rating;
  let rd=0,promo=null;
  P.matches++;
  P.bankroll+=delta;
  if(delta>0){P.w++;P.streak++;if(P.streak>P.bestStreak)P.bestStreak=P.streak;}
  else{P.l++;P.streak=0;}
  if(place===1)P.firsts++;
  if(P.bankroll>P.peakBank)P.peakBank=P.bankroll;

  if(!S.daily){
    rd=ratingDelta(place,me.chips,field,P.rating);
    const tierNow=tierOf(P.rating),floor=tierNow[0];
    let nr=P.rating+rd;
    if(nr<floor&&P.shield>0){nr=floor;P.shield--;promo="held";}
    P.rating=Math.max(800,nr);
    if(tierOf(P.rating)[1]!==tierNow[1]){
      promo=P.rating>before?"up":"down";
      if(promo==="up")P.shield=1;
    }
    if(P.rating>P.peakRating)P.peakRating=P.rating;
    /* the regulars move too */
    S.seats.filter(s=>!s.you).forEach(s=>{
      const pl=sorted.indexOf(s)+1;
      const f=S.seats.filter(x=>x!==s).reduce((a,x)=>a+(x.you?P.rating:x.rival.rating),0)/5;
      s.rival.rating=Math.max(900,s.rival.rating+Math.round(ratingDelta(pl,s.chips,f,s.rival.rating)*.5));
      s.rival.bank+=s.chips-BUYIN;s.rival.m++;
      if(s.chips>BUYIN)s.rival.w++;else s.rival.l++;
    });
    saveR();
  }else{
    const k=todayKey();
    P.daily.streak=(P.daily.last&&isYesterday(P.daily.last))?P.daily.streak+1:1;
    if(P.daily.streak>P.daily.best)P.daily.best=P.daily.streak;
    P.daily.last=k;P.daily.score=me.chips;P.daily.skill=S.score||0;
    if((S.score||0)>(P.daily.bestSkill||0))P.daily.bestSkill=S.score||0;
    P.daily.rank=null;P.daily.players=null;P.daily.server=null;P.daily.rejected=null;
    const board=dailyBoard(),idx=board.findIndex(r=>r.you);
    S.dailyPlace=idx+1;
    S.chestWin=creditChest(S.dailyPlace);
    /* Send the transcript while the payout is still animating. The stars are
       already banked and do not wait on a network; only the cash placing does,
       because a prize can only be claimed against the board that actually pays. */
    S.dailyRank=null;S.dailySent="sending";
    submitDaily(k,S.tape.slice()).then(r=>{
      if(r){S.dailyRank=r.rank||null;S.dailySent="sent";
        if(r.score!=null&&r.score!==(S.score||0))S.dailyDisputed=r.score;}
      else S.dailySent=P.daily.rejected?"refused":"offline";
      /* if the summary is already up, redraw it in place — back=true so the
         payout sounds do not fire a second time */
      if($("again"))screenSummary(true);
    }).catch(()=>{S.dailySent="offline";});
  }
  S.session={delta:delta,place:place,rd:rd,before:before,promo:promo,chips:me.chips,
             score:S.score||0,standings:sorted};
  saveP();
  S.phase="payout";S.rewarded=false;
  Snd.finish();
  runPayout(sorted,()=>screenSummary());
}
function isYesterday(k){
  const d=new Date(),y=new Date(d.getTime()-864e5);
  return k===y.getFullYear()+"-"+String(y.getMonth()+1).padStart(2,"0")
    +"-"+String(y.getDate()).padStart(2,"0");
}

/* ══════════ QR ENCODER ══════════
   Byte mode, error-correction level M, versions 1-6. Enough for a table link,
   small enough to scan off a phone screen held up to another phone. */
const QRV=[ /* [totalCodewords, ecPerBlock, blocks, dataPerBlock, capacityBytes, alignCentre] */
  [ 26,10,1,16, 14,0],
  [ 44,16,1,28, 26,18],
  [ 70,26,1,44, 42,22],
  [100,18,2,32, 62,26],
  [134,24,2,43, 84,30],
  [172,16,4,27,106,34]
];
const GF_EXP=new Uint8Array(512),GF_LOG=new Uint8Array(256);
(function(){let x=1;for(let i=0;i<255;i++){GF_EXP[i]=x;GF_LOG[x]=i;
  x<<=1;if(x&256)x^=0x11D;}
  for(let i=255;i<512;i++)GF_EXP[i]=GF_EXP[i-255];})();
const gmul=(a,b)=>(a&&b)?GF_EXP[GF_LOG[a]+GF_LOG[b]]:0;

function rsGen(n){
  let p=[1];
  for(let i=0;i<n;i++){
    const q=[1,GF_EXP[i]],r=new Array(p.length+1).fill(0);
    for(let a=0;a<p.length;a++)for(let b=0;b<2;b++)r[a+b]^=gmul(p[a],q[b]);
    p=r;
  }
  return p;
}
function rsEncode(data,n){
  const gen=rsGen(n),res=new Array(n).fill(0);
  for(const d of data){
    const f=d^res[0];
    res.shift();res.push(0);
    if(f)for(let i=0;i<n;i++)res[i]^=gmul(gen[i+1],f);
  }
  return res;
}

function qrMatrix(text){
  const bytes=[];
  for(const ch of unescape(encodeURIComponent(text)))bytes.push(ch.charCodeAt(0));
  let v=0;
  while(v<QRV.length&&bytes.length>QRV[v][4])v++;
  if(v>=QRV.length)throw new Error("payload too long for a version 6 QR");
  const [total,ecPer,blocks,dataPer,,alignC]=QRV[v];
  const ver=v+1,size=17+ver*4;

  /* bit stream */
  const bits=[];
  const push=(val,len)=>{for(let i=len-1;i>=0;i--)bits.push((val>>i)&1);};
  push(4,4);push(bytes.length,8);
  bytes.forEach(b=>push(b,8));
  const cap=blocks*dataPer*8;
  for(let i=0;i<4&&bits.length<cap;i++)bits.push(0);
  while(bits.length%8)bits.push(0);
  const pad=[0xEC,0x11];let pi=0;
  while(bits.length<cap){push(pad[pi++%2],8);}

  /* data codewords -> blocks -> interleave with EC */
  const dw=[];
  for(let i=0;i<bits.length;i+=8){let b=0;for(let k=0;k<8;k++)b=(b<<1)|bits[i+k];dw.push(b);}
  const dBlocks=[],eBlocks=[];
  for(let b=0;b<blocks;b++){
    const chunk=dw.slice(b*dataPer,(b+1)*dataPer);
    dBlocks.push(chunk);eBlocks.push(rsEncode(chunk,ecPer));
  }
  const out=[];
  for(let i=0;i<dataPer;i++)for(let b=0;b<blocks;b++)out.push(dBlocks[b][i]);
  for(let i=0;i<ecPer;i++)for(let b=0;b<blocks;b++)out.push(eBlocks[b][i]);
  if(out.length!==total)throw new Error("codeword count "+out.length+" != "+total);

  /* grid */
  const m=[],res=[];
  for(let r=0;r<size;r++){m.push(new Array(size).fill(0));res.push(new Array(size).fill(0));}
  const setF=(r,c,v)=>{m[r][c]=v;res[r][c]=1;};
  const finder=(r,c)=>{
    for(let i=-1;i<8;i++)for(let j=-1;j<8;j++){
      const rr=r+i,cc=c+j;
      if(rr<0||cc<0||rr>=size||cc>=size)continue;
      const on=(i>=0&&i<=6&&(j===0||j===6))||(j>=0&&j<=6&&(i===0||i===6))
        ||(i>=2&&i<=4&&j>=2&&j<=4);
      setF(rr,cc,on?1:0);
    }
  };
  finder(0,0);finder(0,size-7);finder(size-7,0);
  for(let i=8;i<size-8;i++){setF(6,i,i%2===0?1:0);setF(i,6,i%2===0?1:0);}
  if(alignC){
    const cs=[6,alignC];
    cs.forEach(r=>cs.forEach(c=>{
      if((r===6&&c===6)||(r===6&&c===size-7)||(r===size-7&&c===6))return;
      for(let i=-2;i<=2;i++)for(let j=-2;j<=2;j++)
        setF(r+i,c+j,(Math.abs(i)===2||Math.abs(j)===2||(i===0&&j===0))?1:0);
    }));
  }
  setF(size-8,8,1);                                  /* dark module */
  for(let i=0;i<9;i++){                              /* reserve format areas */
    if(i!==6){if(!res[8][i])setF(8,i,0);if(!res[i][8])setF(i,8,0);}
  }
  for(let i=0;i<8;i++){
    if(!res[8][size-1-i])setF(8,size-1-i,0);
    if(!res[size-1-i][8])setF(size-1-i,8,0);
  }

  /* zigzag placement */
  let bi=0,up=true;
  const stream=[];
  out.forEach(b=>{for(let i=7;i>=0;i--)stream.push((b>>i)&1);});
  for(let col=size-1;col>0;col-=2){
    if(col===6)col--;
    for(let k=0;k<size;k++){
      const row=up?size-1-k:k;
      for(let c=0;c<2;c++){
        const cc=col-c;
        if(res[row][cc])continue;
        m[row][cc]=bi<stream.length?stream[bi++]:0;
      }
    }
    up=!up;
  }

  const MASKS=[
    (r,c)=>(r+c)%2===0,(r,c)=>r%2===0,(r,c)=>c%3===0,(r,c)=>(r+c)%3===0,
    (r,c)=>(Math.floor(r/2)+Math.floor(c/3))%2===0,(r,c)=>((r*c)%2+(r*c)%3)===0,
    (r,c)=>(((r*c)%2+(r*c)%3)%2)===0,(r,c)=>((((r+c)%2)+((r*c)%3))%2)===0
  ];
  const fmtBits=mask=>{
    /* level M = 00, then 3 mask bits, BCH(15,5), XOR 0x5412 */
    let d=(0<<3)|mask,e=d<<10;
    for(let i=4;i>=0;i--)if(e&(1<<(i+10)))e^=0x537<<i;
    return ((d<<10)|e)^0x5412;
  };
  const applyFmt=(g,mask)=>{
    const f=fmtBits(mask);
    /* placement order runs MSB first: bit 14 lands at (8,0) */
    const bit=i=>(f>>(14-i))&1;
    const c1=[[8,0],[8,1],[8,2],[8,3],[8,4],[8,5],[8,7],[8,8],
              [7,8],[5,8],[4,8],[3,8],[2,8],[1,8],[0,8]];
    const c2=[];
    for(let i=0;i<7;i++)c2.push([size-1-i,8]);
    for(let i=7;i<15;i++)c2.push([8,size-15+i]);
    c1.forEach((p,i)=>{g[p[0]][p[1]]=bit(i);});
    c2.forEach((p,i)=>{g[p[0]][p[1]]=bit(i);});
    g[size-8][8]=1;
  };
  const penalty=g=>{
    let p=0;
    for(let r=0;r<size;r++)for(const dir of [0,1]){
      let run=1;
      for(let c=1;c<size;c++){
        const a=dir?g[c-1][r]:g[r][c-1],b=dir?g[c][r]:g[r][c];
        if(a===b)run++;else{if(run>=5)p+=3+(run-5);run=1;}
      }
      if(run>=5)p+=3+(run-5);
    }
    for(let r=0;r<size-1;r++)for(let c=0;c<size-1;c++){
      const v=g[r][c];
      if(v===g[r][c+1]&&v===g[r+1][c]&&v===g[r+1][c+1])p+=3;
    }
    const pat=[1,0,1,1,1,0,1,0,0,0,0];
    for(let r=0;r<size;r++)for(let c=0;c<=size-11;c++){
      let h=true,v=true;
      for(let i=0;i<11;i++){if(g[r][c+i]!==pat[i])h=false;if(g[c+i][r]!==pat[i])v=false;}
      if(h)p+=40;if(v)p+=40;
    }
    let dark=0;g.forEach(row=>row.forEach(x=>dark+=x));
    p+=Math.floor(Math.abs(dark*100/(size*size)-50)/5)*10;
    return p;
  };

  let best=null,bestP=Infinity;
  for(let mask=0;mask<8;mask++){
    const g=m.map(r=>r.slice());
    for(let r=0;r<size;r++)for(let c=0;c<size;c++)
      if(!res[r][c]&&MASKS[mask](r,c))g[r][c]^=1;
    applyFmt(g,mask);
    const p=penalty(g);
    if(p<bestP){bestP=p;best=g;}
  }
  return best;
}

function qrSvg(text,px){
  const m=qrMatrix(text),n=m.length,q=2,S=n+q*2,s=px||(S*5);
  let d="";
  for(let r=0;r<n;r++)for(let c=0;c<n;c++)
    if(m[r][c])d+="M"+(c+q)+" "+(r+q)+"h1v1h-1z";
  return "<svg width='"+s+"' height='"+s+"' viewBox='0 0 "+S+" "+S+"' "
    +"shape-rendering='crispEdges' xmlns='http://www.w3.org/2000/svg'>"
    +"<rect width='"+S+"' height='"+S+"' fill='#f4efe6'/>"
    +"<path d='"+d+"' fill='#141a24'/></svg>";
}


/* ══════════ TABLE CODES ══════════
   A code IS the table. It seeds the deal, so everyone who enters the same code
   plays the identical six hands and the scores are directly comparable --
   which makes the invite real rather than a placeholder for a server. */
const CODE_AB="ACDEFGHJKLMNPQRTUVWXY3479";
function makeCode(){
  /* five random characters will eventually spell something. Roll again if they
     do — it costs nothing and the alternative is a table code on a screenshot. */
  let c="";
  for(let tries=0;tries<40;tries++){
    c="";for(let i=0;i<5;i++)c+=CODE_AB[Math.floor(Math.random()*CODE_AB.length)];
    if(cleanText(c))break;
  }
  return c;
}
const tableLink=c=>"webluff.com/t/"+c;

function screenTable(code){
  const c=code||S.lastCode||makeCode();
  S.lastCode=c;
  let qr="";
  try{qr=qrSvg(tableLink(c),190);}catch(e){qr="<div class='fine'>code too long for a QR</div>";}
  ovShow("<h2>YOUR TABLE</h2>"
   +"<p class='fine'>Anyone who enters this code plays the <b>same six deals</b> you do, "
   +"so the scores line up. Send it, or hold the code up and let them scan it.</p>"
   +"<div id='qr'>"+qr+"</div>"
   +"<div class='code'>"+c+"</div>"
   +"<p class='fine'>"+tableLink(c)+"</p>"
   +"<div class='row'><button class='btn alt' id='cpc'>"+(canShare()?"SHARE INVITE":"COPY INVITE")+"</button>"
   +"<button class='btn go' id='ply'>PLAY THIS TABLE</button></div>"
   +"<div class='row'><button class='btn alt' id='newc'>NEW CODE</button>"
   +"<button class='btn alt' id='joinb'>JOIN A CODE</button></div>"
   +"<div class='row'><button class='btn alt' id='bk'>BACK</button></div>",true);
  $("cpc").onclick=()=>{
    shareOut((P.handle||"Someone")+" dealt you in at BLUFF — table "+c,
             SITE+"/t/"+c,"invite","invite copied");
  };
  $("ply").onclick=()=>startMatch("code",c);

}

function screenFriends(){
  const k=todayKey(),sc=(FSC.day===k?FSC.scores:null);
  const of=h=>sc&&sc[h]?sc[h].score:null;
  const fr=(P.friends||[]).slice().sort((a,b)=>(of(b.h)==null?-1:of(b.h))-(of(a.h)==null?-1:of(a.h)));
  ovShow("<h2>FRIENDS</h2>"
   +(fr.length?"<div class='frlist'>"+fr.map((f,i)=>
      "<div class='fr' data-h='"+f.h+"'><span class='f'>"+faceOf(f.h)+"</span>"
      +"<b>"+f.h+"<u>"+(of(f.h)!=null?"today "+of(f.h)
        :sc?"has not played today":"score unavailable")
        +" \u00B7 added "+prettyDate(f.d)+"</u></b>"
      +"<span class='duel'>CHALLENGE</span>"
      +"<button class='x' data-h='"+f.h+"'>&times;</button></div>").join("")+"</div>"
     :"<p class='fine'>Nobody here yet. Add the handles of the people you play with — they land "
      +"on your daily board and you can pull any of them onto a private table.</p>")
   +"<input id='fn' maxlength='9' placeholder='ADD A HANDLE' autocomplete='off'>"
   +"<div class='row'><button class='btn' id='fadd'>ADD</button></div>"
   +"<div class='row'><button class='btn alt' id='fb'>FRIENDS BOARD</button>"
   +"<button class='btn alt' id='inv'>OPEN TABLE</button></div>"
   +"<div class='row'><button class='btn alt' id='bk'>BACK</button></div>"
   +"<p class='fine'>A challenge needs nothing sent. You and they derive the same table from "
   +"your two handles, so tapping each other’s name lands you both on the identical six deals.</p>",
   true);
  const i=$("fn");
  i.oninput=()=>{i.value=i.value.toUpperCase().replace(/[^A-Z0-9]/g,"");};
  i.onkeydown=e=>{if(e.key==="Enter")$("fadd").click();};
  $("fadd").onclick=async()=>{
    const v=i.value.trim();
    if(v.length<2)return toast("two characters or more");
    if(!cleanText(v))return toast("pick a different name",2600);
    if(v===P.handle)return toast("that is you");
    if(!P.friends)P.friends=[];
    if(P.friends.some(x=>x.h===v))return toast("already on the list");
    /* check the person exists before putting their name on a list. Adding a
       handle nobody plays under is how you end up with a board full of people
       who were never here. */
    const btn=$("fadd");btn.disabled=true;btn.textContent="CHECKING\u2026";
    const found=await lookupHandles([v]);
    btn.disabled=false;btn.textContent="ADD";
    if(found===null)return toast("cannot check that name right now \u2014 try again in a moment",3000);
    if(!found.length)return toast("nobody plays under "+v,3000);
    P.friends.push({h:v,d:todayKey()});saveP();Snd.spark();
    friendScores(true).then(()=>screenFriends());
    screenFriends();
  };
  [...document.querySelectorAll(".fr .x")].forEach(b=>{
    b.onclick=e=>{e.stopPropagation();
      P.friends=P.friends.filter(x=>x.h!==b.dataset.h);saveP();screenFriends();};
  });
  [...document.querySelectorAll(".fr")].forEach(el=>{
    el.onclick=()=>screenDuel(el.dataset.h);
  });
  $("fb").onclick=()=>screenBoard("friends");
  $("inv").onclick=()=>screenTable(makeCode());
  $("bk").onclick=screenHome;
}

  ovShow("<h2>YOU vs "+h+"</h2>"

   +"this code from you — the moment they tap your name on their own list they get the same five "
   +"characters. Same words, same clues, same prices, so the two scores actually compare.</p>"

   +"<div class='code'>"+c+"</div>"

     +"<div class='dside'><span class='f'>"+myFace()+"</span><b>"+(P.handle||"YOU")+"</b>"
     +"<u>"+((P.daily.last===todayKey()&&P.daily.skill!=null)?P.daily.skill+" today":"not played")+"</u></div>"
     +"<div class='dvs'>vs</div>"
     +"<div class='dside'><span class='f'>"+faceOf(h)+"</span><b>"+h+"</b>"

   +"</div>"
   +"<p class='fine' id='dsent'>telling "+h+"\u2026</p>"
   +"<div class='row'><button class='btn go' id='dgo'>PLAY THIS TABLE</button></div>"
   +"<div class='row'><button class='btn alt' id='dcp'>COPY</button>"
   +"<button class='btn alt' id='bk'>BACK</button></div>",true);
  /* Tell them. The table was always derivable from the two handles, but
     derivable is not the same as delivered — nobody knew they had been called
     out unless they happened to look. */
  sendInvite(h,c).then(r=>{const el=$("dsent");if(el)

      +"tap your name to land on the same table";});

    shareOut((P.handle||"Someone")+" is calling you out at BLUFF — table "+c,
             SITE+"/t/"+c,"challenge","challenge copied");
  };
  $("bk").onclick=()=>screenBoard("friends");
}

/* a shared link drops you straight onto that table */
function codeFromUrl(){
  const m=(location.hash+location.search).match(/[/?#&=]t[/=]?([A-Z0-9]{3,6})/i)

}

function glossFor(i){
  const x=[34,47,61,40,67,53][i%6],a=[97,105,112,100,108,93][i%6];
  return "linear-gradient("+a+"deg,transparent "+(x-10)+"%,rgba(255,255,255,.14) "+(x-1.4)+"%,"
    +"rgba(255,255,255,.46) "+x+"%,rgba(255,255,255,.13) "+(x+1.4)+"%,transparent "+(x+10)+"%)";
}

   miniature of the actual thing -- the stone you are buying, wearing the trim
   you already own, or the trim you are buying around the stone you already
   play on. You are looking at the result, not at a paint chip. */
function miniTable(fv,fg,rv,i){
  return "<i class='sw mini'>"

function swatchFor(c,it,i){
  const e=P.equipped||{};
  if(c==="felt")
    return miniTable(it.v,it.g||COSM.felt[0].g,findCos("rail",e.rail).v,i);
  if(c==="rail"){
    const f=findCos("felt",e.felt);
    return miniTable(f.v,f.g||COSM.felt[0].g,it.v,i+2);
  }
  if(c==="ring")
    return "<i class='sw rng' style='--r:"+it.v+"'><span>"+myFace()+"</span></i>";
  return "<i class='sw tok'><span>"+it.v+"</span></i>";

/* ══════════ ADS AND MONEY ══════════

   Both of these are thin on purpose. The game talks to two objects the native
   shell installs on `window`, and if the shell is not there — a browser, the
   PWA, a test — the objects are absent and every path here degrades to "not
   available right now" rather than throwing. That is what lets the same single
   file be the web build and the app build.

   The native side has to provide:

     window.BluffAds.rewarded()  -> Promise<boolean>   true only if watched
     window.BluffIAP.buy(id)     -> Promise<{store,transactionId|token,product}>

   Nothing about how many stars a pack is worth lives on this side. The client
   hands the receipt to our server, the server asks Apple or Google what it was,
   and the number comes back. See server/src/purchases.js. */

const Ads={
  get live(){return !!(window.BluffAds&&window.BluffAds.rewarded);},
  today(){const d=todayKey();
    if(!P.adRebuys||P.adRebuys.d!==d){P.adRebuys={d:d,n:0};saveP();}
    return P.adRebuys;},
  left(){return Math.max(0,REBUY_ADS_DAY-this.today().n);},
  async rewarded(){
    if(!this.live)return false;
    if(this.left()<=0)return false;
    let watched=false;
    try{watched=await window.BluffAds.rewarded();}catch(e){watched=false;}
    if(watched){const t=this.today();t.n++;P.adRebuys=t;saveP();}
    return watched;
  }
};

const Pay={
  get live(){return !!(window.BluffIAP&&window.BluffIAP.buy);},
  /* A purchase is not finished when the store says so — it is finished when our
     server has seen the receipt and credited it. Anything else means a refund
     or a replay is worth stars. */
  async buy(id){
    if(!this.live)return {ok:false,error:"the store is not available here"};
    let receipt;
    try{receipt=await window.BluffIAP.buy(id);}
    catch(e){return {ok:false,error:(e&&e.message)||"the purchase did not go through"};}
    if(!receipt)return {ok:false,cancelled:true};
    const r=await apiCall("/v1/purchase/verify",{method:"POST",body:JSON.stringify(receipt)},15000);
    if(!r.ok||!r.body||!r.body.ok)
      return {ok:false,error:(r.body&&r.body.error)||"we could not confirm that with the store"};
    await Pay.collect();
    return {ok:true,stars:r.body.stars||0};
  },
  /* Anything bought and not yet collected — a purchase made as the app was
     killed, or on a plane. Safe to call on every launch; the server only ever
     hands a grant over once. */
  async collect(){
    if(!SESSION)return 0;
    const r=await apiCall("/v1/purchase/claim",{method:"POST",body:"{}"},9000);
    const n=(r.ok&&r.body&&r.body.stars)||0;
    if(n>0)grantStars(n,"✦ "+n.toLocaleString()+" stars added");
    return n;
  }
};

function buyOrEquip(c,id){
  const it=findCos(c,id);

    P.bankroll-=it.p;P.owned.push(id);
    Snd.chip();toast("bought "+it.n,2000);
  }else Snd.spark();
  P.equipped[c]=id;saveP();applyCosmetics();screenStore(c);
}

/* \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550 FRIENDS ON THE BOARD \u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550\u2550
   A friend's daily number comes from their handle and the date, so the same
   friend shows the same score on everybody's board. No server, and no way to
   quietly inflate somebody who is not here to defend it. */
/* friendScore() used to live here. It hashed the handle and the date and
   returned a plausible number, so adding a real friend showed them scoring 412
   on a day they never opened the app. Scores come from the board now, and a
   friend who has not played shows as not having played. */
function friendsBoard(){
  const k=todayKey();
  const sc=(FSC.day===k?FSC.scores:null)||{};
  const out=(P.friends||[]).map(f=>({name:f.h,
    score:sc[f.h]?sc[f.h].score:null, unknown:!sc[f.h]}));
  out.push({name:P.handle||"YOU",you:true,
            score:(P.daily.last===k&&P.daily.skill!=null)?P.daily.skill:null});
  return out.sort((a,b)=>(b.score==null?-1:b.score)-(a.score==null?-1:a.score));
}
/* Both sides derive the same five characters from the pair of handles and the
   date, so a challenge needs no server and nothing to send -- your friend taps
   your name and lands on the identical table. */
function challengeCode(a,b){
  const pair=[String(a||"").toUpperCase(),String(b||"").toUpperCase()].sort().join("~");
  const g=mulberry32(hashStr("bluff-duel-"+pair+"-"+todayKey()));
  /* derived codes have to stay derived, so this one cannot re-roll — but the
     alphabet has no vowels but A, and a five-character hit is checked anyway */
  let s="";for(let i=0;i<5;i++)s+=CODE_AB[Math.floor(g()*CODE_AB.length)];
  if(!cleanText(s))s=s.slice(0,4)+"7";
  return s;
}

function screenGate(back){

     that fits on one screen with a button. The country picker stays only

  const g=P.geo||{};

     +c[1]+"</option>").join("")+"</select>"

   +US_STATES.map(x=>"<option value='"+x+"'"+(g.state===x?" selected":"")+">"+x+"</option>").join("")
   +"</select>"
