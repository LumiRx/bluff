<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">
<title>Play BLUFF — the daily word game with a fold button</title>
<link rel="canonical" href="https://webluff.com/play/">
<meta name="description" content="A daily word game with a fold button. Set a secret word, give one clue, set the difficulty, and claim nobody cracks it.">
<meta name="theme-color" content="#141a24">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="BLUFF">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" sizes="192x192">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<style>
:root{
  --bg:#141a24; --felt:#1e2836; --felt2:#182132; --line:#2c384a;
  --gold:#d89b4f; --cream:#f4efe6; --dim:#8fa0b5;
  --hit:#f4efe6; --near:#d89b4f; --miss:#212b3d;
  --red:#c96a57; --card:#f4efe6;
  --feltA:#232e40; --feltB:#1e2836; --feltC:#1a2232; --feltD:#161d2b;
  --railA:#101623; --railB:#0d1220; --railC:#0a0e18; --railS:rgba(0,0,0,.35);
  --ringC:#d89b4f; --tok:"\2605"; --e-out:cubic-bezier(.2,.8,.2,1); --e-spring:cubic-bezier(.34,1.56,.64,1); --d-fast:120ms; --d-base:220ms; --d-slow:380ms; --touch:44px;
  --gleamA:rgba(255,255,255,0); --gleamB:rgba(244,239,230,.06);
  --gleamIn:rgba(255,255,255,0);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%}
body{
  background:var(--bg);color:var(--cream);
  font-family:ui-sans-serif,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  overflow-x:hidden;overscroll-behavior:none;
  display:flex;justify-content:center;
}
#app{width:100%;max-width:440px;min-height:100%;min-height:100dvh;display:flex;flex-direction:column;
  padding:env(safe-area-inset-top) calc(10px + env(safe-area-inset-right))
    calc(20px + env(safe-area-inset-bottom)) calc(10px + env(safe-area-inset-left));
  position:relative}
#ov{padding:calc(16px + env(safe-area-inset-top)) calc(16px + env(safe-area-inset-right))
  calc(16px + env(safe-area-inset-bottom)) calc(16px + env(safe-area-inset-left))}
/* installed, there is no browser chrome to scroll away, so nothing may rubber-band */
html.standalone,html.standalone body{overscroll-behavior:none;position:fixed;
  width:100%;height:100%;overflow:hidden}
html.standalone body{overflow-y:auto;-webkit-overflow-scrolling:touch}

/* ── header ── */
#hdr{display:flex;align-items:center;gap:8px;padding:10px 2px 8px;font-size:11px;letter-spacing:.09em}
#hdr .brand{font-weight:800;color:var(--gold);letter-spacing:.22em;font-size:13px}
#hdr .sp{flex:1}
.stat{background:#121822;border:1px solid var(--line);border-radius:7px;padding:4px 8px;
  display:flex;gap:5px;align-items:baseline;white-space:nowrap}
.stat b{color:var(--cream);font-size:13px;font-variant-numeric:tabular-nums;letter-spacing:0}
.stat span{color:var(--dim);font-size:9px;letter-spacing:.1em}
#helpBtn,#sndBtn{background:none;border:1px solid var(--line);color:var(--dim);border-radius:50%;
  width:24px;height:24px;font-size:12px;cursor:pointer;flex:none;padding:0;line-height:1}
#sndBtn{font-size:11px}
#sndBtn.off{opacity:.42}

/* ── table ── */
#table{position:relative;width:100%;aspect-ratio:1/.66;margin:2px 0 6px;flex:none}
#feltEl{position:absolute;inset:8% 3%;border-radius:50%/48%;
  background:radial-gradient(ellipse at 50% 38%,#212c40 0%,var(--felt) 45%,var(--felt2) 100%);
  border:2px solid #2a374e;box-shadow:inset 0 0 40px rgba(0,0,0,.55),0 6px 22px rgba(0,0,0,.5)}
.seat{position:absolute;transform:translate(-50%,-50%);width:70px;text-align:center;z-index:3}
.seat .av{width:38px;height:38px;margin:0 auto;border-radius:50%;
  background:#131a25;border:2px solid var(--line);display:flex;align-items:center;justify-content:center;
  font-size:13px;font-weight:800;color:var(--dim);transition:.2s;position:relative}
.seat.you .av{border-color:var(--gold);color:var(--gold)}
.seat.setter .av{border-color:var(--gold);background:#322310;color:var(--gold);
  box-shadow:0 0 0 3px rgba(212,172,123,.16)}
.seat.acting .av{border-color:var(--cream);animation:pulse 1s infinite}
.seat.out .av,.seat.out .nm,.seat.out .ch{opacity:.32}
.seat.crack .av{border-color:var(--hit);background:#1a2334;color:#94a8cb}
.seat.bust .av{border-color:var(--red);color:var(--red)}
@keyframes pulse{50%{box-shadow:0 0 0 5px rgba(240,232,222,.14)}}
.seat .nm{font-size:9px;letter-spacing:.09em;color:var(--dim);margin-top:3px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.seat .ch{font-size:11px;font-weight:700;color:var(--cream);font-variant-numeric:tabular-nums}
.seat .btn-d{position:absolute;top:-4px;right:-6px;width:17px;height:17px;border-radius:50%;
  background:var(--gold);color:#141a24;font-size:8px;font-weight:900;display:flex;
  align-items:center;justify-content:center;letter-spacing:0}
.seat .tag{position:absolute;left:50%;transform:translateX(-50%);bottom:-15px;font-size:8px;
  z-index:4;
  letter-spacing:.1em;padding:1px 5px;border-radius:4px;white-space:nowrap;font-weight:700}
.tag.call{background:#1a2334;color:#94a8cb}
.tag.fold{background:#291c19;color:#ba7e72}
.tag.wait{background:#1e242e;color:var(--dim)}
.seat.bot .tag{bottom:auto;top:-14px}
#center{position:absolute;left:50%;top:43%;transform:translate(-50%,-50%);
  width:60%;text-align:center;z-index:2}
#potLbl{font-size:8px;letter-spacing:.18em;color:var(--dim)}
#potVal{font-size:22px;font-weight:800;color:var(--gold);font-variant-numeric:tabular-nums;line-height:1.1}
#centerNote{font-size:9px;color:var(--dim);margin-top:2px;letter-spacing:.06em;line-height:1.35}

/* ── stage ── */
#stage{flex:1;display:flex;flex-direction:column;gap:8px;min-height:0}
/* Tried and reverted, on 11 August: `#stage>*:first-child{margin-top:auto}`, to
   push the panels to the bottom of the screen where a thumb is. It measured well
   -- nothing clipped at any size, and the buttons landed in the reachable third
   -- and it looked wrong. On the quiet phases (watching somebody else act, the
   screen is a tell strip and three numbers) it opened a 400px void between the
   felt and the panel, and a hole in the middle of a screen reads as a thing that
   failed to load in a way a tail at the bottom does not.
   The version that ships keeps the panel under the table, where the eye expects
   the next thing after the table to be, and lets the slack fall off the end. */
.panel{background:#10141c;border:1px solid var(--line);border-radius:12px;padding:12px}
.ttl{font-size:10px;letter-spacing:.2em;color:var(--gold);font-weight:700;margin-bottom:3px}
.facts{display:flex;gap:6px;margin:8px 0 7px}
.facts span{flex:1;background:#131924;border:1px solid var(--line);border-radius:8px;
  padding:5px 3px;text-align:center;font-size:15px;font-weight:800;color:var(--cream);
  font-variant-numeric:tabular-nums;line-height:1.15}
.facts u{display:block;text-decoration:none;font-size:6.5px;letter-spacing:.14em;
  color:var(--dim);font-weight:700;margin-bottom:2px}
.sub{font-size:11.5px;color:var(--dim);line-height:1.5}
.sub b{color:var(--cream);font-weight:600}

/* word cards */
.cards{display:flex;gap:6px;margin-top:10px}
.wcard{flex:1;background:var(--card);color:#181c22;border-radius:8px;padding:9px 2px 7px;
  text-align:center;cursor:pointer;border:2px solid transparent;transition:.14s;min-width:0}
.wcard:hover{transform:translateY(-3px)}
.wcard.sel{border-color:var(--gold);transform:translateY(-3px);box-shadow:0 5px 16px rgba(212,172,123,.3)}
.wcard .w{font-size:13px;font-weight:800;letter-spacing:.04em}
.wcard .r{font-size:15px;font-weight:800;margin-top:4px;font-variant-numeric:tabular-nums}
.wcard .rl{font-size:7px;letter-spacing:.09em;color:#667184;margin-top:1px}
.wcard .bd{font-size:7px;font-weight:800;letter-spacing:.1em;margin-top:4px;padding:2px 0;border-radius:3px}

/* tells */
.tells{display:flex;flex-direction:column;gap:6px;margin-top:9px}
.tell{display:flex;align-items:center;gap:9px;background:#131924;border:1px solid var(--line);
  border-radius:9px;padding:7px 9px;cursor:pointer;transition:.14s}
.tell.sel{border-color:var(--gold);background:#1b222f}
.tell .mini{display:flex;gap:2px;flex:none}
.tell .mini i{width:15px;height:19px;border-radius:2px;background:var(--miss);display:flex;
  align-items:center;justify-content:center;font-size:10px;font-weight:800;font-style:normal;color:#8fa0b5}
.tell .mini i.h{background:var(--hit);color:#141a24}
.tell .mini i.n{background:var(--near);color:#141a24}
.tell .mini i.x{background:#231b19;color:#9d675c;text-decoration:line-through}
.tell .tx{flex:1;font-size:11px;line-height:1.35}
.tell .tx b{display:block;font-size:12px;color:var(--cream)}
.tell .tx span{color:var(--dim);font-size:10px}
.tell .cnt{font-size:13px;font-weight:800;color:var(--gold);font-variant-numeric:tabular-nums;text-align:right;flex:none}
.tell .cnt em{display:block;font-size:7px;letter-spacing:.09em;color:var(--dim);font-style:normal}
.tell .cnt u{display:block;font-size:8px;letter-spacing:.06em;color:#909db2;text-decoration:none;
  font-weight:700;margin-top:3px}

/* buttons */
.row{display:flex;gap:7px;margin-top:10px}
.btn{flex:1;background:var(--gold);color:#171008;border:none;border-radius:9px;padding:12px 8px;
  font-size:13px;font-weight:800;letter-spacing:.09em;cursor:pointer;font-family:inherit;transition:.14s}
.btn:disabled{opacity:.28;cursor:default}
.btn.alt{background:transparent;color:var(--cream);border:1px solid var(--line)}
.btn.dan{background:#382521;color:#dda499;border:1px solid #593a33}
.btn.go{background:var(--hit);color:#141a24}
.btn small{display:block;font-size:9px;font-weight:600;letter-spacing:.04em;opacity:.72;margin-top:2px}
.stakes{display:flex;gap:7px;margin-top:9px}
.stk{flex:1;background:#131924;border:1px solid var(--line);border-radius:9px;padding:9px 4px;
  text-align:center;cursor:pointer;transition:.14s}
.stk.sel{border-color:var(--gold);background:#1b222f}
.stk.off{opacity:.3;cursor:default}
.stk.off b{color:var(--dim)}
.stk b{display:block;font-size:17px;color:var(--gold);font-variant-numeric:tabular-nums}
.stk span{font-size:8px;letter-spacing:.09em;color:var(--dim)}

/* tell banner */
#tellBar{display:flex;align-items:center;gap:10px;background:#171e2b;border:1px solid #334058;
  border-radius:10px;padding:7px 10px}
#tellBar .mini{display:flex;gap:3px}
#tellBar .mini i{width:22px;height:27px;border-radius:3px;background:var(--miss);display:flex;
  align-items:center;justify-content:center;font-size:13px;font-weight:800;font-style:normal;color:#8fa0b5}
#tellBar .mini i.h{background:var(--hit);color:#141a24}
#tellBar .mini i.n{background:var(--near);color:#141a24}
#tellBar .mini i.x{background:#231b19;color:#9d675c;text-decoration:line-through}
#tellBar .tt{flex:1;font-size:11.5px;line-height:1.4}
#tellBar .tt b{display:block;font-size:9px;letter-spacing:.16em;color:var(--gold)}

/* board */
#board{display:grid;gap:4px;justify-content:center}
.brow.given{margin-bottom:5px}
.brow.free{margin-top:9px;position:relative}
.brow.free::before{content:'FREE SWING \2014\A0NOTHING RIDES ON THIS ONE';position:absolute;top:-9px;left:0;right:0;text-align:center;font-size:6.5px;letter-spacing:.14em;color:#5d687c}
.brow.free .tile{border-style:dotted}
.brow.given .tile{border-style:dashed;border-color:#343f52;width:28px;height:28px;font-size:13px}
.givenlbl{font-size:8px;letter-spacing:.16em;color:#5d687c;text-align:center}
.brow{display:grid;grid-template-columns:repeat(var(--cols,5),var(--tile,40px));gap:4px}
.tile{width:40px;height:40px;border:2px solid #283242;border-radius:5px;display:flex;
  align-items:center;justify-content:center;font-size:20px;font-weight:800;background:#0f131a;
  transition:.16s;text-transform:uppercase}
.tile.f{border-color:#424f65}
.tile.h{background:var(--hit);border-color:var(--hit);color:#141a24}
.tile.n{background:var(--near);border-color:var(--near);color:#141a24}
.tile.m{background:var(--miss);border-color:var(--miss);color:#697488}

/* ── the clue does not arrive on colour alone ──
   Green pin, amber float and grey void are the whole information channel of
   this game, and roughly one man in twelve cannot reliably separate those. So
   every state also carries a shape: a filled dot for a pinned letter, a hollow
   diamond for a floating one, a slash for a dead one. On by default, because
   the people who need it are exactly the people who will not know to go
   looking for a setting. */
html.marks .tile.h::after,html.marks .tile.n::after,html.marks .tile.m::after,
html.marks .mini i.h::after,html.marks .mini i.n::after,html.marks .mini i.x::after,
html.marks .k.h::after,html.marks .k.n::after,html.marks .k.m::after{
  position:absolute;top:1px;right:2px;font-size:7px;line-height:1;opacity:.66;
  font-weight:700;pointer-events:none}
html.marks .tile.h::after,html.marks .mini i.h::after,html.marks .k.h::after{content:"\25CF"}
html.marks .tile.n::after,html.marks .mini i.n::after,html.marks .k.n::after{content:"\25C7"}
html.marks .tile.m::after,html.marks .mini i.x::after,html.marks .k.m::after{content:"\2571"}
html.marks .tile,html.marks .mini i,html.marks .k{position:relative}
.brow.bad{animation:shake .34s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}

/* rivals strip */
#rivals{display:flex;gap:5px;flex-wrap:wrap;justify-content:center}
.rv{background:#121822;border:1px solid var(--line);border-radius:7px;padding:4px 6px;text-align:center;min-width:54px}
.rv .n{font-size:8px;letter-spacing:.08em;color:var(--dim);margin-bottom:3px}
.rv .g{display:flex;flex-direction:column;gap:2px;align-items:center}
.rv .g div{display:flex;gap:2px}
.rv .g i{width:8px;height:8px;border-radius:1.5px;background:var(--miss);display:block}
.rv .g i.h{background:var(--hit)}
.rv .g i.n{background:var(--near)}
.rv .g .idle{color:#3d4655;font-size:11px;letter-spacing:.14em;height:8px;line-height:8px}
.rv.done{border-color:var(--hit)}
.rv.fail{border-color:#472f2b}

/* keyboard */
#kb{display:flex;flex-direction:column;gap:5px;margin-top:6px;padding-top:0}
.krow{display:flex;gap:4px;justify-content:center}
.key{flex:1;min-width:0;height:44px;border-radius:5px;background:#2a3342;border:none;color:var(--cream);
  font-size:13px;font-weight:700;font-family:inherit;cursor:pointer;display:flex;
  align-items:center;justify-content:center;transition:.12s}
.key.wide{flex:1.55;font-size:10px;letter-spacing:.06em}
.key.h{background:var(--hit);color:#141a24}
.key.n{background:var(--near);color:#141a24}
.key.m{background:#181c24;color:#4c5565}

/* heat */
#heat{height:5px;background:#151a23;border-radius:3px;overflow:hidden}
#heatF{height:100%;width:0;background:linear-gradient(90deg,var(--hit),var(--near),var(--red));transition:.5s}

/* overlay */
#ov{position:fixed;inset:0;background:rgba(7,9,13,.965);display:none;align-items:center;
  justify-content:center;padding:16px;z-index:60;overflow-y:auto}
#ov.on{display:flex}
#ov.solid{background:var(--bg)}
#ovC{width:100%;max-width:400px;background:#10141c;border:1px solid var(--line);
  border-radius:16px;padding:20px 16px;text-align:center;max-height:92vh;overflow-y:auto}
#ovC h1{margin:0;font-size:34px;letter-spacing:.3em;color:var(--gold);font-weight:900}
#ovC h2{margin:0 0 4px;font-size:17px;letter-spacing:.1em}
#ovC p{font-size:12.5px;color:var(--dim);line-height:1.6;margin:8px 0}
#ovC p b{color:var(--cream)}
.lb{width:100%;font-size:12px;border-collapse:collapse;margin-top:10px}
.lb td{padding:6px 5px;border-bottom:1px solid #1a212c88;text-align:left}
.lb td:last-child{text-align:right;font-weight:800;font-variant-numeric:tabular-nums}
.lb tr.me td{color:var(--gold)}
.lb td.d{color:var(--dim);font-size:10px;text-align:right;font-weight:400}
.ex{display:flex;gap:4px;justify-content:center;margin:12px 0}
.ex i{width:34px;height:34px;border-radius:4px;background:var(--miss);display:flex;align-items:center;
  justify-content:center;font-size:15px;font-weight:800;font-style:normal;color:#8fa0b5}
.ex i.h{background:var(--hit);color:#141a24}
.ex i.n{background:var(--near);color:#141a24}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:78px;background:#1b222f;
  border:1px solid var(--gold);color:var(--cream);padding:8px 14px;border-radius:20px;font-size:11.5px;
  z-index:70;opacity:0;transition:.25s;pointer-events:none;white-space:nowrap;font-weight:600}
#toast.on{opacity:1}
.hr{height:1px;background:var(--line);margin:12px 0}
.tut{background:#171e29;border:1px solid #303f58;border-radius:9px;padding:9px 11px;
  font-size:11px;line-height:1.5;color:#bec8da}
.tut b{color:#dee4ef}

/* ── identity layer ── */
.av2{width:44px;height:44px;border-radius:50%;border:2px solid var(--gold);display:flex;
  align-items:center;justify-content:center;font-size:19px;font-weight:900;flex:none;background:#131a25}
.hrow{display:flex;align-items:center;gap:11px;text-align:left;margin-bottom:12px}
.hwho{min-width:0}
.hwho b{display:block;font-size:19px;letter-spacing:.09em}
.hwho em{display:block;font-size:9.5px;color:var(--dim);font-style:normal;margin-top:3px;letter-spacing:.05em}
.tier{display:inline-block;font-size:8.5px;font-weight:800;letter-spacing:.16em;border:1px solid;
  border-radius:4px;padding:2px 6px;margin-top:4px}
.sgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(72px,1fr));gap:6px;margin:10px 0}
.sc{background:#121822;border:1px solid var(--line);border-radius:9px;padding:8px 4px}
.sc b{display:block;font-size:17px;font-variant-numeric:tabular-nums;color:var(--cream);letter-spacing:0}
.sc span{font-size:7.5px;letter-spacing:.13em;color:var(--dim)}
.sc.pos b{color:#94a8cb}.sc.neg b{color:var(--red)}
.htop{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.hme{flex:1;display:flex;align-items:center;gap:10px;background:none;border:none;padding:0;
  cursor:pointer;text-align:left;font-family:inherit;color:inherit}
.hme .hwho{min-width:0}
.hbook.muted{opacity:.45}
.toggle{display:flex;align-items:center;gap:9px;width:100%;text-align:left;cursor:pointer;
  background:#121822;border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-top:6px}
.toggle b{flex:none;width:30px;font-size:11px;letter-spacing:.1em;color:#677387}
.toggle span{flex:1;font-size:9.5px;color:var(--dim);letter-spacing:.03em}
.toggle i{flex:none;width:38px;height:21px;border-radius:20px;background:#1a212c88;
  border:1px solid var(--line);position:relative;transition:background .18s,border-color .18s}
.toggle i::after{content:"";position:absolute;top:2px;left:2px;width:15px;height:15px;
  border-radius:50%;background:#4c5565;transition:transform .18s,background .18s}
.toggle.on{border-color:#364764}
.toggle.on b{color:var(--gold)}
.toggle.on i{background:#283751;border-color:#364764}
.toggle.on i::after{transform:translateX(17px);background:var(--gold)}
.trk{display:grid;grid-template-columns:repeat(2,1fr);gap:6px;margin-top:7px}
.tb{background:#121822;border:1px solid var(--line);border-radius:11px;padding:9px 6px;
  cursor:pointer;font-family:inherit;color:var(--dim);font-size:9.5px;font-weight:800;
  letter-spacing:.09em;transition:.14s}
.tb u{display:block;text-decoration:none;font-size:7.5px;letter-spacing:.1em;
  color:#5d687c;font-weight:700;margin-top:3px}
.tb.on{border-color:var(--gold);background:#1b222f;color:var(--gold)}
.tb.on u{color:#8f7453}
.hbook{width:38px;height:38px;flex:none;border-radius:11px;background:#121822;
  border:1px solid var(--line);font-size:17px;cursor:pointer;line-height:1;padding:0;
  color:#bfc7d5;display:inline-flex;align-items:center;justify-content:center}
/* the emoji these replaced came with their own padding built in; a drawn mark
   does not, so it has to be told to fill the button it sits in */
.hbook .ico{width:20px;height:20px;vertical-align:0}
.hbook.muted,.hbook.off{color:#6a778d}
.pstrip{display:flex;align-items:center;gap:5px;width:100%;cursor:pointer;font-family:inherit;
  background:linear-gradient(160deg,#271e14,#140f08);
  border:1px solid #60482a;border-radius:10px;padding:6px 8px;margin:10px 0 6px}
.pstrip u{text-decoration:none;color:#8f7453;font-size:14px;flex:none;line-height:1}
.ban.cash{background:linear-gradient(160deg,#222f46,#121924);border-color:#f4efe6;color:#dbe2ed}
.ban.cash em{display:block;font-style:normal;font-size:8.5px;letter-spacing:.08em;
  color:#8697b4;margin-top:3px;font-weight:600}
.pstrip.cash{border-color:#a3b4d1;background:linear-gradient(160deg,#17202e,#0e131b)}
.pstrip.cash b{color:#a3b4d1}
.pstrip.cash span{background:linear-gradient(160deg,#283751,#1a2232);color:#e5eaf2}
.pstrip.cash span.p1{background:linear-gradient(160deg,#384c6f,#202c41);color:#f1f4f8}
/* ── gates and legal ── */
.gate{text-align:left;margin:12px 0}
.gate label{display:flex;align-items:flex-start;gap:9px;padding:11px 12px;margin-bottom:7px;
  background:#121822;border:1px solid var(--line);border-radius:12px;cursor:pointer;
  font-size:11px;line-height:1.5;color:#c4cad5}
.gate label.on{border-color:var(--gold);background:#1b222f}
.gate input{appearance:none;flex:none;width:19px;height:19px;margin:0;border-radius:6px;
  border:1.5px solid #3a465b;background:#0d1119;cursor:pointer;position:relative}
.gate input:checked{border-color:var(--gold);background:linear-gradient(150deg,#e1c39e,#b48245)}
.gate input:checked::after{content:"\2713";position:absolute;inset:0;display:flex;
  align-items:center;justify-content:center;font-size:12px;font-weight:900;color:#261b0e}
.gate a{color:var(--gold);text-decoration:underline}
.sel{width:100%;background:#0d1119;border:1px solid var(--line);color:var(--cream);
  border-radius:11px;padding:11px 12px;font-family:inherit;font-size:12.5px;font-weight:700;
  letter-spacing:.06em;margin-bottom:7px;-webkit-appearance:none;appearance:none;
  background-image:linear-gradient(45deg,transparent 50%,#677387 50%),
    linear-gradient(135deg,#677387 50%,transparent 50%);
  background-position:calc(100% - 18px) 50%,calc(100% - 13px) 50%;
  background-size:5px 5px,5px 5px;background-repeat:no-repeat}
.legal{text-align:left;font-size:10.5px;line-height:1.65;color:#929cad}
.legal h3{font-size:9.5px;letter-spacing:.16em;color:var(--gold);margin:15px 0 5px;font-weight:800}
.legal p{font-size:10.5px;line-height:1.65;color:#929cad;margin:5px 0}
.legal b{color:var(--cream)}
/* the drawn marks. 1em square, stroked in whatever colour the text around them
   is, so a mark inside a gold heading is gold without anyone saying so */
.ico{width:1em;height:1em;flex:none;fill:none;stroke:currentColor;stroke-width:1.7;
  stroke-linecap:round;stroke-linejoin:round;vertical-align:-.13em}
.ico.big{width:1.35em;height:1.35em;stroke-width:1.5}
.pstrip b{flex:1;font-size:8.5px;letter-spacing:.14em;color:var(--gold);text-align:left;
  display:flex;align-items:center;gap:6px}
/* The last emoji in the app used to sit here. A trophy glyph renders as a
   different picture on every phone and none of them is ours, which is the whole
   argument against them — so this is the same turning metal as the leaderboard
   medals, at eleven pixels. */
.pstrip b::before{content:"";width:11px;height:11px;border-radius:50%;flex:none;
  background:conic-gradient(from 0deg,#f2e5d5,#a77435 22%,#eddbc6 46%,#875d2a 70%,#f2e5d5);
  box-shadow:0 1px 3px rgba(0,0,0,.5),inset 0 0 0 1px rgba(255,255,255,.3);
  animation:turn 7s linear infinite}
.pstrip.cash b::before{
  background:conic-gradient(from 0deg,#e8ecf3,#3f567d 22%,#d2dae9 46%,#2e3f5c 70%,#e8ecf3)}
@media (prefers-reduced-motion:reduce){.pstrip b::before{animation:none}}
.pstrip span{font-size:10.5px;font-weight:800;color:var(--cream);background:rgba(0,0,0,.34);
  border-radius:6px;padding:3px 6px;font-variant-numeric:tabular-nums}
.pstrip span.p1{background:linear-gradient(160deg,#42301a,#251a0d);color:#e9d3b8}
.cstrip{display:flex;align-items:center;gap:7px;width:100%;background:#121822;
  border:1px solid var(--line);border-radius:10px;padding:7px 9px;margin-bottom:8px;
  cursor:pointer;font-family:inherit;color:inherit;text-align:left}
.cstrip.live{border-color:var(--gold)}
.cstrip b{font-size:8.5px;letter-spacing:.14em;color:var(--gold);flex:none;
  display:flex;align-items:center;gap:5px}
.cstrip b .ico,.pstrip .ico{width:12px;height:12px;stroke-width:1.9}
.cstrip span{flex:1;font-size:10px;color:var(--dim)}
.cstrip em{font-style:normal;font-weight:800;color:var(--cream);font-variant-numeric:tabular-nums}
.cstrip u{text-decoration:none;color:var(--dim);font-size:15px;flex:none}
.cstrip.idle{opacity:.7}
.when{display:block;font-size:10px;color:#ae987e;line-height:1.5;margin-top:3px}
.when b{display:inline;font-size:10px;letter-spacing:0;color:var(--gold)}
.ctwo{display:flex;gap:7px;margin:9px 0 7px}
.cbox{flex:1;background:rgba(0,0,0,.3);border-radius:9px;padding:7px 3px;font-size:19px;
  font-weight:900;color:var(--cream);font-variant-numeric:tabular-nums;line-height:1.1}
.cbox.hot{color:var(--gold)}
.cbox u{display:block;text-decoration:none;font-size:7px;letter-spacing:.16em;color:#8fa0b5;
  font-weight:700;margin-bottom:2px}
.cbox em{display:block;font-style:normal;font-size:7.5px;letter-spacing:.06em;color:#8fa0b5;
  font-weight:600;margin-top:3px}
/* ══════════ THE STORE ══════════
   Everything sold here lives on one object, so the store shows you that object.
   The preview is a real table wearing whatever you are looking at -- cloth,
   trim, the ring round your face, the mark on your chips -- and the swatches
   are miniatures of the thing itself rather than coloured rectangles. */
.prev{position:relative;width:100%;height:138px;margin:9px 0 4px;border-radius:15px;
  background:radial-gradient(ellipse at 50% 0%,#0f131a,#07090d);overflow:hidden;
  border:1px solid #1c2431}
.prev .plab{position:absolute;left:10px;top:9px;font-size:7px;letter-spacing:.22em;
  color:#4f5a6d;font-weight:700;z-index:5}
.prail{position:absolute;inset:9% 5%;border-radius:50%/48%;
  background:linear-gradient(168deg,var(--railA) 0%,var(--railB) 46%,var(--railC) 100%);
  box-shadow:inset 0 2px 0 var(--railS),inset 0 -3px 6px rgba(0,0,0,.6),
    0 9px 24px rgba(0,0,0,.55)}
.pfelt{position:absolute;inset:15% 10%;border-radius:50%/48%;overflow:hidden;isolation:isolate;
  background:radial-gradient(ellipse at 50% 30%,var(--feltA) 0%,var(--feltB) 38%,
    var(--feltC) 72%,var(--feltD) 100%);
  box-shadow:inset 0 0 34px rgba(0,0,0,.55),inset 0 0 46px var(--gleamIn)}
.pfelt::after{content:"";position:absolute;inset:-40% -10%;pointer-events:none;
  background:linear-gradient(101deg,transparent 45.5%,rgba(255,255,255,.22) 48.4%,
    var(--gleamB) 49.5%,rgba(255,255,255,.95) 50%,var(--gleamB) 50.5%,
    rgba(255,255,255,.22) 51.6%,transparent 54.5%);
  mix-blend-mode:screen;opacity:0;animation:gleam 6s ease-in-out infinite}
.pbet{position:absolute;inset:27% 23%;border-radius:50%/48%;pointer-events:none;
  border:1px dashed rgba(212,172,123,.18)}
.pava{position:absolute;left:50%;top:56%;transform:translate(-50%,-50%);z-index:4;
  width:42px;height:42px;border-radius:50%;font-size:21px;
  background:radial-gradient(circle at 38% 30%,#212c3e,#0f141d);
  display:flex;align-items:center;justify-content:center;
  border:2.5px solid var(--ringC);
  box-shadow:0 0 13px var(--ringC),0 3px 9px rgba(0,0,0,.6)}
.pchip{position:absolute;width:19px;height:19px;border-radius:50%;z-index:3;
  background:linear-gradient(160deg,#e6cdae,#b38144);color:#573c1c;
  display:flex;align-items:center;justify-content:center;font-size:11px;line-height:1;
  box-shadow:inset 0 0 0 2px rgba(255,255,255,.32),0 2px 5px rgba(0,0,0,.5)}
.pchip::after{content:var(--tok)}
.catnote{font-size:9.5px;color:var(--dim);letter-spacing:.03em;margin:7px 0 2px;text-align:center}

.cosgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:8px 0 2px}
.cos{position:relative;background:linear-gradient(180deg,#151b26,#0f131b);
  border:1.5px solid #212a3a;border-radius:13px;padding:8px 6px 9px;overflow:hidden;
  cursor:pointer;font-family:inherit;color:inherit;transition:transform .12s,border-color .15s}
.cos:active{transform:scale(.97)}
.cos.on{border-color:var(--gold);background:linear-gradient(180deg,#222935,#191f2a);
  box-shadow:0 0 0 1px rgba(212,172,123,.28),0 4px 14px rgba(0,0,0,.5)}
.cos.pick{border-color:#a3b4d1;background:linear-gradient(180deg,#1b2433,#131822);
  box-shadow:0 0 0 1px rgba(163,180,209,.3)}
.cos.locked{opacity:.52}
.cos .tag{position:absolute;top:7px;right:7px;z-index:3;font-size:6.5px;letter-spacing:.1em;
  font-weight:800;padding:2.5px 6px;border-radius:20px;line-height:1}
.cos .tag.eq{background:linear-gradient(150deg,#e8d2b8,#b48245);color:#261b0e}
.cos .tag.ow{background:#0e121add;color:#929fb6;border:1px solid #324057}
.cos .tag.pk{background:#a3b4d1;color:#0f141c}
.sw{display:block;width:100%;aspect-ratio:1.42;border-radius:9px;margin-bottom:7px;
  position:relative;overflow:hidden;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.14),0 2px 6px rgba(0,0,0,.45)}

.sw.mini{background:radial-gradient(ellipse at 50% 4%,#12161e,#06080b);position:relative}
.sw .mr{position:absolute;inset:7% 2.5%;border-radius:50%/48%;text-decoration:none}
.sw .mf{position:absolute;inset:16% 10%;border-radius:50%/48%;text-decoration:none}
.sw.rng,.sw.tok{background:radial-gradient(ellipse at 50% 22%,#1a212e,#090c11);
  display:flex;align-items:center;justify-content:center}
.sw.rng span{width:58%;aspect-ratio:1;border-radius:50%;display:flex;align-items:center;
  justify-content:center;font-size:17px;line-height:1;
  background:radial-gradient(circle at 38% 30%,#212c3e,#0f141d);
  border:2.5px solid var(--r);box-shadow:0 0 11px var(--r),0 2px 6px rgba(0,0,0,.5)}
.sw.tok span{width:50%;aspect-ratio:1;border-radius:50%;display:flex;align-items:center;
  justify-content:center;font-size:15px;line-height:1;color:#573c1c;
  background:linear-gradient(160deg,#ebd8c1,#b38144);
  box-shadow:inset 0 0 0 2px rgba(255,255,255,.34),0 2px 6px rgba(0,0,0,.5)}
.cos b{display:block;font-size:9px;letter-spacing:.11em;color:var(--cream);font-weight:800}
.cos u{display:block;text-decoration:none;font-size:9.5px;margin-top:3px;font-weight:800;
  color:var(--gold);font-variant-numeric:tabular-nums}
.cos.owned u{color:#8697b4}
.cos.locked u{color:#677387}

.starshop{margin-top:16px;padding:13px 12px 12px;border-radius:15px;
  background:linear-gradient(180deg,#161b24,#0d1118);border:1px solid #2b364a}
.starshop .sh{font-size:9px;letter-spacing:.2em;color:var(--gold);font-weight:800;text-align:center}
.starshop .sub{font-size:9px;color:var(--dim);margin:4px 0 12px;text-align:center;line-height:1.5}
.packs{display:flex;gap:7px;margin:0}
.pack{flex:1;position:relative;background:#0d1118;border:1px solid #2b364a;border-radius:12px;
  padding:11px 4px 10px;cursor:pointer;font-family:inherit;color:inherit;transition:transform .12s}
.pack:active{transform:scale(.97)}
.pack.best{border-color:var(--gold);background:linear-gradient(180deg,#222834,#161c26)}
.pack .amt{display:block;font-size:12.5px;font-weight:900;color:var(--cream);
  font-variant-numeric:tabular-nums;line-height:1.1}
.pack .w{display:block;font-size:6.5px;letter-spacing:.18em;color:#8fa0b5;margin-top:2px;
  font-weight:700}
.pack .usd{display:block;font-size:15px;font-weight:900;color:var(--gold);margin-top:6px}
.pack em{display:block;font-style:normal;font-size:7.5px;color:#a3b4d1;margin-top:3px;font-weight:700}
.pack .flag{position:absolute;top:-7px;left:50%;transform:translateX(-50%);white-space:nowrap;
  font-size:6.5px;letter-spacing:.12em;font-weight:800;padding:2.5px 7px;border-radius:20px;
  background:linear-gradient(150deg,#e1c39e,#b48245);color:#261b0e;line-height:1}
.pz{display:inline-block;background:#352818;color:var(--gold);border-radius:4px;
  padding:1px 5px;font-size:9px;font-weight:800;letter-spacing:.04em}
.lb tr.gap td{text-align:center;color:#3d4655;letter-spacing:.3em;padding:2px}
.prog{height:4px;background:#151a23;border-radius:3px;overflow:hidden;margin-top:4px}
.prog i{display:block;height:100%;border-radius:3px}
.fine{font-size:10px;color:var(--dim);line-height:1.5;margin:6px 0}
.fine.warn{color:#c49256}
.sect{font-size:8.5px;letter-spacing:.2em;color:var(--gold);text-align:left;margin:14px 0 2px;font-weight:700}
.wdef{background:#121822;border:1px solid var(--line);border-radius:10px;padding:8px 11px;
  margin-top:9px;position:relative}
.wdef.teach{border-color:#60482a;background:linear-gradient(160deg,#20180f,#101318);padding-top:15px}
.wdef b{display:block;font-size:12px;font-weight:600;letter-spacing:.1em;color:var(--gold)}
.wdef span{display:block;font-size:12.5px;color:var(--cream);line-height:1.5;margin-top:3px}
.newword{position:absolute;top:-7px;left:50%;transform:translateX(-50%);background:var(--gold);
  color:#171008;font-size:6.5px;font-weight:900;letter-spacing:.16em;padding:2px 7px;
  border-radius:4px;white-space:nowrap}
.hl{display:flex;align-items:baseline;gap:8px;background:#121822;border:1px solid var(--line);
  border-radius:9px;padding:9px 11px;text-align:left;margin-top:6px}
.hl b{font-size:15px;letter-spacing:.1em}
.hl span{flex:1;font-size:9.5px;color:var(--dim)}
.hl u{text-decoration:none;font-size:15px;font-weight:800;color:#94a8cb;font-variant-numeric:tabular-nums}
/* ══════════ THE BOARD ══════════
   Bold enough to find in a glance: the podium wears metal, your own row is a
   solid bar you cannot miss, and the number you are being judged on is the
   biggest thing in the row. */
.board{display:flex;flex-direction:column;gap:5px;margin:11px 0 6px}
.lrow{display:flex;align-items:center;gap:9px;padding:9px 11px 9px 9px;border-radius:12px;
  background:#121822;border:1px solid #1f2735;position:relative;overflow:hidden}
.lrow .rk{width:25px;height:25px;flex:none;display:flex;align-items:center;justify-content:center;
  font-size:13px;font-weight:900;color:#5e6a80;font-variant-numeric:tabular-nums;letter-spacing:0}
.lrow .fc{flex:none;width:28px;display:flex;align-items:center;justify-content:center}
/* A crest, not a picture. Built from the handle, so it is the same object on
   every board and every device, and it is the player's rather than assigned. */
.crest{display:inline-flex;align-items:center;justify-content:center;
  width:26px;height:26px;border-radius:8px;background:var(--cb);color:var(--cf);
  font-size:10.5px;font-weight:900;letter-spacing:.04em;line-height:1;
  border:1px solid rgba(255,255,255,.10);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.13),0 1px 3px rgba(0,0,0,.45)}
.crest.big{width:44px;height:44px;border-radius:13px;font-size:17px}
.crest.xl{width:60px;height:60px;border-radius:17px;font-size:23px}
/* Badges read as engraved rather than printed — a sticker is decoration, a
   stamp is a record. */
.bdgs{display:flex;gap:3px;margin-top:3px;flex-wrap:wrap}
.bdg{display:inline-block;font-size:7.5px;font-weight:900;letter-spacing:.11em;
  padding:2px 5px;border-radius:3px;line-height:1.25;white-space:nowrap;
  border:1px solid transparent}
.bdg.gold{background:rgba(215,177,130,.16);color:#debe97;border-color:rgba(215,177,130,.42)}
.bdg.cool{background:rgba(149,180,209,.13);color:#afc6dd;border-color:rgba(149,180,209,.34)}
.bdg.trait{background:rgba(255,255,255,.05);color:#9da7b8;border-color:rgba(255,255,255,.11)}
.lrow .nm{flex:1;min-width:0;text-align:left}
.lrow .nm b{display:block;font-size:12.5px;font-weight:800;letter-spacing:.08em;color:#e1e5ec;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lrow .nm em{display:block;font-style:normal;font-size:8.5px;letter-spacing:.05em;
  color:#5d687c;font-weight:600;margin-top:2px;white-space:nowrap;overflow:hidden;
  text-overflow:ellipsis}
.lrow .pz{flex:none;font-size:9.5px;font-weight:800;color:var(--gold);background:#211910;
  border:1px solid #43331f;border-radius:20px;padding:3px 7px;white-space:nowrap}
.lrow .vl{flex:none;min-width:42px;text-align:right}
.lrow .vl b{display:block;font-size:15.5px;font-weight:900;color:var(--cream);
  font-variant-numeric:tabular-nums;letter-spacing:-.01em;line-height:1.05}
.lrow .vl u{display:block;text-decoration:none;font-size:7.5px;letter-spacing:.14em;
  color:#5d687c;font-weight:700;margin-top:2px}
/* ── the shimmer ──
   Light runs down the board in a wave, each row a beat behind the one above,
   and every row answers in its own metal: gold, silver, bronze, and a green
   glint for the field. Your own row is the one that catches it hardest. */
.lrow::before{content:"";position:absolute;inset:0;z-index:1;pointer-events:none;
  background:linear-gradient(100deg,transparent 28%,var(--shA) 43%,var(--shB) 50%,
    var(--shA) 57%,transparent 72%);
  mix-blend-mode:screen;transform:translateX(-130%);
  animation:lshim 5.4s cubic-bezier(.4,.05,.4,1) infinite;animation-delay:var(--d,0s);
  --shA:rgba(141,162,199,.07);--shB:rgba(218,225,237,.16)}
@keyframes lshim{
  0%  {transform:translateX(-130%)}
  20% {transform:translateX(130%)}
  100%{transform:translateX(130%)}}
.lrow.m1::before{--shA:rgba(227,200,168,.26);--shB:rgba(245,236,224,.66)}
.lrow.m2::before{--shA:rgba(232,238,245,.24);--shB:rgba(255,255,255,.60)}
.lrow.m3::before{--shA:rgba(225,197,162,.24);--shB:rgba(240,225,207,.58)}
.lrow.me::before{--shA:rgba(227,200,168,.26);--shB:rgba(247,239,230,.68)}
.lrow>*{position:relative;z-index:2}
/* the medals are polished metal, so they turn in the light rather than sit flat */
.lrow .rk i{position:relative;z-index:2;font-style:normal}
.lrow.m1 .rk::before,.lrow.m2 .rk::before,.lrow.m3 .rk::before{
  content:"";position:absolute;inset:-48%;z-index:1;animation:turn 7s linear infinite}
.lrow.m1 .rk::before{background:conic-gradient(from 0deg,#f2e5d5,#a77435 22%,#eddbc6 46%,
  #875d2a 70%,#f2e5d5)}
.lrow.m2 .rk::before{background:conic-gradient(from 0deg,#ffffff,#8e99a7 22%,#f3f6fa 46%,
  #707d93 70%,#ffffff)}
.lrow.m3 .rk::before{background:conic-gradient(from 0deg,#ecd9c1,#835d2f 22%,#dcba90 46%,
  #6c4d26 70%,#ecd9c1)}
.lrow.m1 .vl b{background:linear-gradient(100deg,#d7b080 0%,#f9f4ee 44%,#e6cdae 52%,#cc9c62 62%,
  #d7b080 100%);background-size:260% 100%;background-position:120% 0;
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
  animation:shine 5.4s cubic-bezier(.4,.05,.4,1) infinite}
@keyframes shine{
  0%  {background-position:120% 0}
  20% {background-position:-60% 0}
  100%{background-position:-60% 0}}
@media (prefers-reduced-motion:reduce){
  .lrow::before,.lrow .rk::before,.lrow.m1 .vl b{animation:none}
  .lrow.m1 .vl b{-webkit-text-fill-color:#e6cdae}}
.lrow.m1,.lrow.m2,.lrow.m3{padding-top:11px;padding-bottom:11px}
.lrow.m1{background:linear-gradient(97deg,#2e2214 0%,#151a24 62%);border-color:#62492b}
.lrow.m2{background:linear-gradient(97deg,#232830 0%,#151a24 62%);border-color:#4e5663}
.lrow.m3{background:linear-gradient(97deg,#2e2214 0%,#151a24 62%);border-color:#634d32}
.lrow.m1 .rk,.lrow.m2 .rk,.lrow.m3 .rk{border-radius:50%;font-size:12px;position:relative;
  overflow:hidden;box-shadow:0 2px 6px rgba(0,0,0,.5),inset 0 0 0 1px rgba(255,255,255,.28)}
.lrow.m1 .rk{background:#ad7b3f;color:#312210}
.lrow.m2 .rk{background:#96a1af;color:#282e36}
.lrow.m3 .rk{background:#8d693d;color:#2b1f10}
.lrow.m1 .nm b{color:#f0e1cf}
.lrow.m1 .vl b{color:#e6cdae}
.lrow.me{background:linear-gradient(97deg,#253044,#1a2331);border-color:var(--gold);
  box-shadow:0 0 0 1px rgba(212,172,123,.22),0 5px 16px rgba(0,0,0,.45)}

.ban.dn{background:#38231f;color:#dda499}

.card{background:#0d1117;border:1px solid var(--line);border-radius:10px;padding:14px 12px;
  text-align:left;margin:10px 0;font-size:12px;line-height:1.7;font-variant-numeric:tabular-nums}

#hnd,#sgPh,#sgCode{width:100%;background:#121822;border:1px solid var(--line);border-radius:9px;padding:12px;
  color:var(--cream);font-family:inherit;font-size:16px;font-weight:800;letter-spacing:.18em;

#hnd:focus,#sgPh:focus,#sgCode:focus{border-color:var(--gold)}
#hnd::placeholder,#sgPh::placeholder,#sgCode::placeholder{color:#4c5565;font-weight:600;letter-spacing:.12em;font-size:12px}
#sgPh{letter-spacing:.06em;font-weight:700}
#sgCode{letter-spacing:.42em;font-size:22px;padding:14px 12px}
/* ══════════ TABLE — rail, felt, betting line ══════════ */
#table{position:relative;width:100%;aspect-ratio:1/.58;margin:2px 0 6px;flex:none}
#rail{position:absolute;inset:4% 1%;border-radius:50%/48%;
  background:linear-gradient(168deg,var(--railA) 0%,var(--railB) 46%,var(--railC) 100%);
  box-shadow:inset 0 2px 0 var(--railS),inset 0 -3px 6px rgba(0,0,0,.6),
    0 12px 34px rgba(0,0,0,.6)}
/* ── the stone ──
   Three layers make the table read as a cut gem rather than cloth: a domed
   body, a fixed field of facets so there is structure for light to catch on,
   and one specular band that travels across every nine seconds and then rests.
   All three take their colour from whichever table skin is equipped. */
#feltEl{position:absolute;inset:8.5% 4.5%;border-radius:50%/48%;border:none;
  overflow:hidden;isolation:isolate;
  background:radial-gradient(ellipse at 50% 30%,var(--feltA) 0%,var(--feltB) 38%,var(--feltC) 72%,var(--feltD) 100%);
  box-shadow:inset 0 0 54px rgba(0,0,0,.55),inset 0 3px 0 rgba(255,255,255,.06),
    inset 0 0 76px var(--gleamIn)}
#feltEl::before{content:"";position:absolute;inset:-38%;border-radius:50%;pointer-events:none;
  background:conic-gradient(from 202deg at 50% 50%,
    rgba(255,255,255,.17) 0deg, rgba(255,255,255,0) 30deg,
    rgba(0,0,0,.22) 68deg,      rgba(0,0,0,0) 104deg,
    rgba(255,255,255,.12) 140deg,rgba(255,255,255,0) 172deg,
    rgba(0,0,0,.19) 214deg,     rgba(0,0,0,0) 252deg,
    rgba(255,255,255,.14) 288deg,rgba(255,255,255,0) 318deg,
    rgba(0,0,0,.15) 340deg,     rgba(0,0,0,0) 360deg);
  mix-blend-mode:overlay;
  animation:turn 72s linear infinite}
#feltEl::after{content:"";position:absolute;inset:-40% -10%;pointer-events:none;
  background:
    linear-gradient(101deg,transparent 45.5%,rgba(255,255,255,.22) 48.4%,
      var(--gleamB) 49.5%,rgba(255,255,255,.95) 50%,var(--gleamB) 50.5%,
      rgba(255,255,255,.22) 51.6%,transparent 54.5%),
    linear-gradient(101deg,transparent 36%,var(--gleamA) 50%,transparent 64%);
  mix-blend-mode:screen;opacity:0;
  animation:gleam 9s ease-in-out infinite}
@keyframes turn{to{transform:rotate(360deg)}}
/* the light crosses in under three seconds, then the stone sits still --
   a glint you catch, not a searchlight sweeping back and forth */
@keyframes gleam{
  0%  {transform:translateX(-88%) skewX(-9deg);opacity:0}
  3%  {transform:translateX(-74%) skewX(-9deg);opacity:.95}
  27% {transform:translateX(74%)  skewX(-9deg);opacity:.95}
  30% {transform:translateX(88%)  skewX(-9deg);opacity:0}
  100%{transform:translateX(88%)  skewX(-9deg);opacity:0}}
@media (prefers-reduced-motion:reduce){
  #feltEl::after,#feltEl::before{animation:none}}
#betline{position:absolute;inset:16% 12%;border-radius:50%/48%;
  border:1px dashed rgba(212,172,123,.20);pointer-events:none}
#mark{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
  font-size:min(13vw,52px);font-weight:900;letter-spacing:.3em;color:rgba(255,255,255,.030);
  pointer-events:none;user-select:none;white-space:nowrap}
#chipLayer{position:absolute;inset:0;pointer-events:none;z-index:6}
/* the count-in, over the felt */
#cd{position:absolute;inset:0;display:none;align-items:center;justify-content:center;
  z-index:20;pointer-events:none;border-radius:50%/48%}
/* a scrim under the count, so the numeral has something to sit against and the
   table visibly says "not yet" rather than just quietly changing */
#cd.on{display:flex;background:radial-gradient(ellipse at 50% 46%,
  rgba(5,7,11,.66) 0%,rgba(5,7,11,.44) 52%,rgba(5,7,11,.12) 78%,transparent 100%)}
#cd b{font-size:min(28vw,120px);font-weight:900;color:#ebd8c1;line-height:1;
  letter-spacing:-.02em;
  text-shadow:0 0 4px rgba(4,6,9,.98),0 0 14px rgba(4,6,9,.92),
    0 0 52px rgba(0,0,0,.8),0 8px 26px rgba(0,0,0,.7);
  animation:cdpop .46s cubic-bezier(.18,.9,.28,1) both}
#cd b.go{color:#bac7dd;font-size:min(20vw,86px);letter-spacing:.14em;
  text-shadow:0 0 4px rgba(4,6,9,.98),0 0 16px rgba(4,6,9,.9),
    0 0 58px rgba(80,106,152,.75),0 8px 26px rgba(0,0,0,.7)}
@keyframes cdpop{
  0%  {transform:scale(2.15);opacity:0}
  18% {transform:scale(1);opacity:1}
  80% {transform:scale(1);opacity:1}
  100%{transform:scale(.86);opacity:0}}
@media (prefers-reduced-motion:reduce){#cd b{animation:none}}

/* ── seats ── */
.seat{position:absolute;transform:translate(-50%,-50%);width:74px;text-align:center;z-index:3}
.ava{position:relative;width:46px;height:46px;margin:0 auto;border-radius:50%;
  background:radial-gradient(circle at 38% 30%,#212c3e,#0f141d);
  display:flex;align-items:center;justify-content:center;font-size:23px;line-height:1;
  box-shadow:0 3px 10px rgba(0,0,0,.55);transition:transform .22s}
.ava .ring{position:absolute;inset:-3px;border-radius:50%;border:2.5px solid #303b4f;
  transition:border-color .25s,box-shadow .25s}
.seat.you .ava .ring{border-color:var(--ringC)}
.seat.setter .ava .ring{border-color:var(--ringC);
  box-shadow:0 0 0 3px rgba(212,172,123,.20),0 0 16px rgba(212,172,123,.35)}
.seat.acting .ava{transform:scale(1.10)}
.seat.acting .ava .ring{border-color:var(--cream);animation:ping 1.05s infinite}
.seat.callst .ava .ring{border-color:var(--hit)}
.seat.crack .ava .ring{border-color:var(--hit);box-shadow:0 0 16px rgba(0,0,0,.35)}
.seat.late .ava .ring{border-color:var(--near)}
.seat.bust .ava .ring{border-color:var(--red)}
.seat.out{opacity:.34}
.seat.out .ava{filter:grayscale(.85)}
@keyframes ping{50%{box-shadow:0 0 0 6px rgba(240,232,222,.13)}}
.seat .nm{font-size:9px;letter-spacing:.10em;color:#9fa8b8;margin-top:5px;font-weight:700;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.seat.you .nm{color:var(--gold)}
.seat .ch{display:inline-flex;align-items:center;gap:3px;margin-top:2px;
  background:rgba(9,12,17,.72);border:1px solid rgba(212,172,123,.28);border-radius:20px;
  padding:1.5px 7px 1.5px 5px;font-size:10.5px;font-weight:800;color:var(--cream);
  font-variant-numeric:tabular-nums;letter-spacing:0}
.seat .ch::before{content:var(--tok);font-size:9px;line-height:1;flex:none;
  color:#dfc09a;text-shadow:0 1px 2px rgba(0,0,0,.6)}
.seat .ch.up{animation:pop .5s}
@keyframes pop{40%{transform:scale(1.22);color:#a3b4d1}}
.seat .ch.dn{animation:popd .5s}
@keyframes popd{40%{transform:scale(.86);color:#d99689}}
.btnD{position:absolute;top:-3px;right:-5px;width:19px;height:19px;border-radius:50%;
  background:linear-gradient(160deg,#eddbc4,#c79558);color:#1f160a;font-size:9px;font-weight:900;
  display:flex;align-items:center;justify-content:center;letter-spacing:0;
  box-shadow:0 2px 5px rgba(0,0,0,.5)}
.seat .tag{position:absolute;left:50%;transform:translateX(-50%);bottom:-14px;font-size:8px;
  letter-spacing:.10em;padding:2px 6px;border-radius:5px;white-space:nowrap;font-weight:800;z-index:4}
.tag.call{background:#1e293d;color:#a3b4d1;box-shadow:0 2px 6px rgba(0,0,0,.4)}
.tag.fold{background:#36231f;color:#ba7e72}
.tag.wait{background:#352818;color:#d89b4f}
.seat.bot .tag{bottom:auto;top:-15px}
/* clock ring */
.seat .clk{position:absolute;inset:-6px;pointer-events:none;opacity:0;transition:opacity .3s}
.seat.ticking .clk{opacity:1}
.seat .clk circle{fill:none;stroke-width:3;transform:rotate(-90deg);transform-origin:50% 50%}

/* ── flying chips ── */
.chip{position:absolute;width:17px;height:17px;border-radius:50%;
  background:linear-gradient(160deg,#e6cdae,#b38144);
  box-shadow:0 0 0 2px rgba(255,255,255,.30) inset,0 2px 5px rgba(0,0,0,.5);
  transform:translate(-50%,-50%);transition:left .55s cubic-bezier(.3,.9,.3,1),
    top .55s cubic-bezier(.3,.9,.3,1),opacity .3s;
  display:flex;align-items:center;justify-content:center;
  font-size:10px;line-height:1;color:#573c1c}
.chip::after{content:var(--tok)}
.chip.red{background:linear-gradient(160deg,#eaada1,#af5543)}
.chip.green{background:linear-gradient(160deg,#b0bfd8,#3f557b)}
/* the end-of-match payout: bigger, brighter, and it tumbles on the way over */
.chip.star{width:21px;height:21px;font-size:12px;z-index:8;
  background:linear-gradient(160deg,#f1e4d4,#c58d49);
  box-shadow:0 0 0 2px rgba(255,255,255,.45) inset,0 0 15px rgba(217,179,133,.75),
    0 3px 8px rgba(0,0,0,.5);
  transition:left .72s cubic-bezier(.22,.9,.28,1),top .72s cubic-bezier(.22,.9,.28,1),
    transform .72s cubic-bezier(.22,.9,.28,1),opacity .34s}
.chip.star.big{width:27px;height:27px;font-size:16px;
  box-shadow:0 0 0 2px rgba(255,255,255,.55) inset,0 0 24px rgba(223,191,152,.9),
    0 3px 11px rgba(0,0,0,.55)}
.seat.paid .ava{animation:paid .7s ease-out}
.seat.paid .ava .ring{border-color:var(--gold);box-shadow:0 0 22px rgba(212,172,123,.65)}
@keyframes paid{35%{transform:scale(1.18)}}

/* ── centre ── */
#center{position:absolute;left:50%;top:44%;transform:translate(-50%,-50%);
  width:56%;text-align:center;z-index:2}
#potLbl{font-size:7.5px;letter-spacing:.24em;color:#8fa0b5}
#potVal::after{content:var(--tok);font-size:14px;margin-left:4px;opacity:.55;vertical-align:2px}
#potVal{font-size:27px;font-weight:900;color:var(--gold);font-variant-numeric:tabular-nums;
  line-height:1.05;text-shadow:0 2px 10px rgba(212,172,123,.28)}
#centerNote{font-size:9px;color:#8d98aa;margin-top:3px;letter-spacing:.06em;line-height:1.35}

/* ── header ── */
#hdr .brand{font-weight:900;color:var(--gold);letter-spacing:.26em;font-size:14px;
  text-shadow:0 0 14px rgba(212,172,123,.30)}
.stat b{font-variant-numeric:tabular-nums}
#hdr .stat.you b::after{content:var(--tok);font-size:9px;margin-left:3px;color:var(--gold);opacity:.8}

/* ── power-up tray ── */
#tray{display:flex;gap:6px;justify-content:center;align-items:center;min-height:40px;margin-top:6px}
.item{position:relative;width:44px;height:40px;border-radius:10px;background:#161d28;
  border:1px solid var(--line);display:flex;flex-direction:column;align-items:center;
  justify-content:center;cursor:pointer;transition:.15s;flex:none}
.item:active{transform:scale(.94)}
.item .ic{font-size:18px;line-height:1}
.item .lb{font-size:6.5px;letter-spacing:.06em;color:var(--dim);margin-top:2px;font-weight:700}
.item.armed{border-color:var(--gold);background:#1d2534;box-shadow:0 0 0 2px rgba(212,172,123,.22)}
.item.rare{border-color:#7a5bb5;background:#1a1b38}
.item.rare .lb{color:#baa5dd}
.item.empty{opacity:.16;border-style:dashed;cursor:default}
.item.idle{opacity:.42;cursor:default}
.item.idle .lb{color:#4c5565}
#trayHint{font-size:9px;color:var(--dim);text-align:center;letter-spacing:.04em;margin-top:-2px}
#cands{text-align:center;font-size:9.5px;color:var(--dim);letter-spacing:.05em;margin-top:5px}
#cands b{color:var(--cream);font-weight:800;font-variant-numeric:tabular-nums}
#cands.tight{color:var(--gold)}#cands.tight b{color:var(--gold)}
.muck{background:#31221f;border:1px solid #593a33;color:#da9d91;border-radius:10px;
  height:40px;padding:0 11px;font-family:inherit;font-size:11px;font-weight:800;
  letter-spacing:.08em;cursor:pointer;flex:none;transition:.15s}
.muck small{display:block;font-size:7px;font-weight:600;opacity:.75;letter-spacing:.02em;margin-top:1px}
.muck.armed{background:#5a3128;border-color:#995547;color:#fcddd6}
.muck:active{transform:scale(.95)}
.seat.targetable .ava{cursor:pointer;animation:tgt 1s infinite}
@keyframes tgt{50%{box-shadow:0 0 0 7px rgba(212,172,123,.20)}}

/* ── event banner ── */
#eventBar{position:fixed;left:50%;top:34%;transform:translate(-50%,-50%) scale(.85);
  background:linear-gradient(160deg,#22244f,#111329);border:1px solid #5255a8;
  border-radius:14px;padding:16px 22px;text-align:center;z-index:80;opacity:0;
  pointer-events:none;transition:.3s;box-shadow:0 14px 40px rgba(0,0,0,.6);max-width:86vw}
#eventBar.on{opacity:1;transform:translate(-50%,-50%) scale(1)}
#eventBar b{display:block;font-size:15px;letter-spacing:.16em;color:#c9cae8}
#eventBar span{display:block;font-size:11.5px;color:var(--cream);margin-top:5px;line-height:1.5}

/* ── avatar picker ── */
.faces{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin:12px 0}
.faces button{aspect-ratio:1;border-radius:11px;background:#121822;border:1.5px solid var(--line);
  font-size:21px;cursor:pointer;transition:.14s;padding:0;line-height:1}
.faces button.on{border-color:var(--gold);background:#202836;transform:scale(1.06)}
.av2{font-size:24px}

/* ── QR / invite ── */
#qr{margin:12px auto;background:#f4efe6;padding:10px;border-radius:12px;width:fit-content;
  box-shadow:0 6px 20px rgba(0,0,0,.5);line-height:0}
.code{font-size:31px;font-weight:900;letter-spacing:.28em;color:var(--gold);margin:6px 0 0;
  text-shadow:0 0 18px rgba(212,172,123,.3)}
.frlist{display:flex;flex-direction:column;gap:6px;margin:10px 0}
.fr{display:flex;align-items:center;gap:9px;background:#121822;border:1px solid var(--line);
  border-radius:10px;padding:8px 10px;text-align:left}
.fr .f{font-size:20px}
.fr b{flex:1;min-width:0;font-size:12.5px;letter-spacing:.06em;font-weight:800}
.fr u{display:block;text-decoration:none;font-size:8.5px;color:var(--dim);letter-spacing:.05em;
  font-weight:600;margin-top:2px}
.fr .x{background:none;border:none;color:#677387;font-size:15px;cursor:pointer;padding:0 3px}
.fr{cursor:pointer}
.fr:active{transform:scale(.99)}
.fr .duel{flex:none;font-size:8px;font-weight:800;letter-spacing:.12em;color:#0f141d;
  background:linear-gradient(150deg,#e1c39e,#b48245);border-radius:20px;padding:4px 8px}
.duelrow{display:flex;align-items:center;gap:8px;margin:12px 0 4px}
.dside{flex:1;background:#121822;border:1px solid var(--line);border-radius:12px;
  padding:10px 6px;text-align:center;min-width:0}
.dside .f{display:block;font-size:26px;line-height:1}
.dside b{display:block;font-size:12px;letter-spacing:.08em;color:var(--cream);margin-top:5px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dside u{display:block;text-decoration:none;font-size:9px;color:var(--dim);margin-top:2px}
.dvs{flex:none;font-size:11px;letter-spacing:.14em;color:var(--gold);font-weight:800}

/* ── motion layer (1.1) — two curves, three durations, one moment per screen.
   Anything that appears springs; anything that leaves eases out; nothing runs
   past 380ms. Reduced motion gets the end states, instantly. ── */
@keyframes bl-pop{from{transform:scale(.86)}to{transform:scale(1)}}
@keyframes bl-commit{from{transform:scale(.9)}to{transform:scale(1)}}
@keyframes bl-rise{from{transform:translateY(12px);opacity:.5}to{transform:none;opacity:1}}
.tile{transition:background var(--d-fast) var(--e-out),border-color var(--d-fast) var(--e-out),color var(--d-fast) var(--e-out),transform var(--d-fast) var(--e-out)}
.tile.f{animation:bl-pop var(--d-fast) var(--e-spring)}
.tile.pre{transform:scale(.9)}
.tile.h,.tile.n,.tile.m{animation:bl-commit var(--d-base) var(--e-spring)}
.key{transition:transform var(--d-fast) var(--e-out),background var(--d-fast) var(--e-out),opacity var(--d-fast) var(--e-out)}
.key:active{transform:translateY(1px) scale(.96)}
#ov.on #ovC{animation:bl-rise var(--d-base) var(--e-spring)}
.btn{transition:transform var(--d-fast) var(--e-out),background var(--d-fast) var(--e-out),opacity var(--d-fast) var(--e-out)}
.btn:active:not(:disabled){transform:translateY(1px)}
/* the fold is ochre, and it takes a held breath: 650ms under the thumb, release early and nothing happened */
#foldB{background:var(--gold);color:#141a24;border:1px solid var(--gold);position:relative;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
#foldB::before{content:"";position:absolute;inset:0;width:0;background:rgba(20,26,36,.30);transition:width var(--d-fast) var(--e-out)}
#foldB.arming::before{width:100%;transition:width 650ms linear}
#foldB.held{opacity:.55}
#foldB small{opacity:.8;position:relative}
#foldB span,#foldB small{position:relative}
#tellBar .mini{perspective:300px}
#tellBar .mini i{transition:transform var(--d-slow) var(--e-out),opacity var(--d-slow) var(--e-out)}
#tellBar .mini i.tip{transform:rotateX(78deg) translateY(8px);opacity:.25}
.foldrule{height:2px;width:0;background:var(--gold);margin:14px auto 10px;transition:width var(--d-slow) var(--e-out)}

.chip{background:var(--gold);box-shadow:0 2px 0 #b77e38,0 0 0 1px rgba(0,0,0,.18) inset;color:#141a24}
.chip.red{background:#c96a57;box-shadow:0 2px 0 #9c4b3b,0 0 0 1px rgba(0,0,0,.18) inset;color:#141a24}
.chip.green{background:#8fa0b5;box-shadow:0 2px 0 #5d687c,0 0 0 1px rgba(0,0,0,.18) inset;color:#141a24}
.chip.star{background:var(--cream);box-shadow:0 2px 0 #b77e38,0 0 0 1px rgba(0,0,0,.18) inset;color:#141a24}
@media (prefers-reduced-motion:reduce){.tile,.key,.btn,#ovC,#tellBar .mini i,.foldrule,#foldB::before{animation:none!important;transition:none!important}}

/* table talk */

  padding:5px 9px;border-radius:10px;white-space:normal;text-align:center;box-shadow:0 2px 0 rgba(0,0,0,.35);
  transition:transform var(--d-base) var(--e-spring),opacity var(--d-base) var(--e-out)}
.say::after{content:"";position:absolute;left:50%;bottom:-4px;width:9px;height:9px;background:inherit;transform:translateX(-50%) rotate(45deg)}
.say.below{transform:translate(-50%,0) translateY(34px) scale(.85)}
.say.below::after{bottom:auto;top:-4px}

.say.left::after{left:auto;right:-4px;bottom:auto;top:50%;transform:translateY(-50%) rotate(45deg)}

   scored against the five-letter deck, every four-letter card would read SHARP
   and the setter's choice would stop meaning anything. */
const BANDS={};
LENS.forEach(L=>{
  const s=DECKS[L].map(w=>RATE[w]).sort((a,b)=>a-b);
  BANDS[L]=[.2,.4,.6,.8].map(q=>s[Math.floor(q*(s.length-1))]);
});
const BANDNAME=[["SHARP","#242f43","#94a8cb"],["TRICKY","#3c3124","#cca77a"],
                ["FAIR","#352c23","#bea17e"],["LOOSE","#3e2621","#cf8879"],
                ["SOFT","#3b2622","#d8998d"]];
function bandOf(r,L){
  const b=BANDS[L||5];let i=0;
  while(i<4&&r>b[i])i++;
  return BANDNAME[i];
}

/* ── is that a word? ──
   Until now a guess only had to be five letters with a vowel in it, which made
   AEIOU legal — and in a deduction game a non-word probe is strictly better
   than a real one, because it can test five fresh letters at once. So the board
   rewarded knowing the loophole. Now a guess has to be in the list. */
const GDICT={4:G4,5:G5,6:G6};
function isWord(w){
  const L=w.length,s=GDICT[L];
  if(!s)return false;
  let lo=0,hi=s.length/L-1;
  while(lo<=hi){
    const mid=(lo+hi)>>1,at=s.substr(mid*L,L);
    if(at===w)return true;
    if(at<w)lo=mid+1;else hi=mid-1;
  }
  return false;
}

/* ── and is it something we are willing to put on a screen? ──
   Applied to everything a player can type: handles, friend names, table codes.
   Guesses are covered by the dictionary itself, which was filtered before it
   was built. The substring terms were checked against all 20,425 accepted words
   at build time, so this cannot fire on SKILL, NIGHT, ASSESS or SCUNTHORPE. */
const LEET={"0":"o","1":"i","3":"e","4":"a","5":"s","7":"t","8":"b","@":"a",
            "$":"s","!":"i","|":"i","2":"z","9":"g","6":"b"};
function foldText(s){
  return String(s||"").toLowerCase().split("").map(c=>LEET[c]||c)
    .filter(c=>c>="a"&&c<="z").join("");
}
function cleanText(s){
  const n=foldText(s);
  if(!n)return true;
  if(BAN.allow.indexOf(n)>-1)return true;
  if(BAN.off.indexOf(n)>-1)return false;
  return !BAN.sub.some(b=>n.indexOf(b)>-1);
}

const NW=DECKS[5].length;

/* ══════════ WORD LOGIC ══════════ */
function evaluate(g,w){
  const L=w.length,r=Array(L).fill("m"),W=w.split(""),G=g.split("");
  for(let i=0;i<L;i++)if(G[i]===W[i]){r[i]="h";W[i]=null;G[i]=null;}
  for(let i=0;i<L;i++){if(!G[i])continue;const j=W.indexOf(G[i]);if(j>-1){r[i]="n";W[j]=null;}}
  return r;
}
const consistent=(cand,g,r)=>evaluate(g,cand).join("")===r.join("");

/* a tell is {k:'pin'|'float'|'void', c:letter, i:position} */
function survivors(tell,pool){
  if(tell.k==="pin")   return pool.filter(w=>w[tell.i]===tell.c);
  if(tell.k==="float") return pool.filter(w=>w.includes(tell.c));
  return pool.filter(w=>![...tell.c].some(c=>w.includes(c)));
}
function tellText(t){
  const ord=["1st","2nd","3rd","4th","5th","6th"][t.i];
  if(t.k==="pin")   return ["LETTER PINNED","The "+ord+" letter is "+t.c+"."];
  if(t.k==="float") return ["LETTER FLOATING","It contains the letter "+t.c+". Position not given."];
  return ["LETTERS VOIDED","It contains no "+[...t.c].join(" and no ")+" anywhere."];
}
function tellTiles(t,L){
  if(t.k==="pin"){let s="";for(let i=0;i<(L||5);i++)
    s+=i===t.i?"<i class='h'>"+t.c+"</i>":"<i></i>";return s;}
  if(t.k==="float")return "<i class='n'>"+t.c+"</i>";
  return [...t.c].map(c=>"<i class='x'>"+c+"</i>").join("");
}

/* candidate tells for a word: two pins, two floats, two voids */
/* Fisher-Yates, not sort(() => rnd() - .5).
   A random comparator is not just biased -- V8 resolves a five-element sort
   differently in Node than in Chrome even when the comparator returns the
   identical sequence of values. That is invisible in a browser-only game and
   fatal the moment a server has to reproduce the same daily, because the tell
   it computes stops matching the one the player was actually shown. */
function shuf(a){
  for(let i=a.length-1;i>0;i--){const j=Math.floor(rnd()*(i+1));const t=a[i];a[i]=a[j];a[j]=t;}
  return a;
}
function offerTells(word){
  const L=word.length,deck=DECKS[L],out=[],seen=new Set();
  const pins=shuf(Array.from({length:L},(_,i)=>({k:"pin",c:word[i],i:i})));
  const fl=shuf([...new Set(word.split(""))].map(c=>({k:"float",c:c,i:0})));
  let absent=COMMON[L].filter(c=>!word.includes(c));
  if(absent.length<4)absent=AL.filter(c=>!word.includes(c));
  shuf(absent);
  const vd=[{k:"void",c:absent[0]+absent[1],i:0},{k:"void",c:absent[2]+absent[3],i:0}];
  [pins[0],pins[1],fl[0],fl[1],vd[0],vd[1]].forEach(t=>{
    if(!t)return;const key=t.k+t.c+t.i;if(seen.has(key))return;seen.add(key);
    t.n=survivors(t,deck).length;out.push(t);
  });
  const cap=TELLCAP(L);
  const ok=out.filter(t=>t.n<=cap);
  return (ok.length?ok:out).sort((a,b)=>a.n-b.n);
}

/* ══════════ SOLVER (bots, and crack-odds estimation) ══════════ */
/* openers with a good spread of common letters, one set per length */
const OPEN={4:["LATE","RIDE","SNAP","TOIL","CARE","MONT".replace("MONT","MOAT"),"REAL","DUST"],
            5:["CRANE","SLATE","ADIEU","AUDIO","RAISE","STARE","TRACE","ARISE","LATER","RATIO"],
            6:["SILENT","RATION","CANDLE","MASTER".replace("MASTER","MARTIN"),"ORCHID","LEADER",
               "SAILOR","PLANET"]};
function solveOnce(target,pool,discipline){
  const L=target.length,deck=DECKS[L];
  const opens=(OPEN[L]||[]).filter(isWord);
  let p=pool,g=opens.length?opens[Math.floor(rnd()*opens.length)]:null;
  if(!g||!p.includes(g))g=p[Math.floor(rnd()*p.length)];
  for(let t=0;t<GUESSES;t++){
    if(g===target)return t+1;
    const r=evaluate(g,target);
    p=p.filter(w=>consistent(w,g,r));
    if(t===GUESSES-1)break;
    if(!p.length)return 0;
    g=(rnd()<discipline)?p[Math.floor(rnd()*p.length)]
                        :deck[Math.floor(rnd()*deck.length)];
  }
  return 0;
}
function crackOdds(target,pool,n){
  let s=0;for(let i=0;i<n;i++)if(solveOnce(target,pool,.78))s++;
  return s/n;
}

   nothing, it just means you rarely walk away without ever seeing it fall. */
const GUESSES=4,BET=3;

   That misjudgement is why a bait pays -- so the bots carry it too. */

function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);
  t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function setSeed(s){rnd=(s==null)?Math.random:mulberry32(s);}
function hashStr(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);
  h=Math.imul(h,16777619);}return h>>>0;}

  +"-"+String(d.getDate()).padStart(2,"0");}

const BUYIN=1000;

/* ── the stake, and what happens when you run out ──
   This used to top you back up to the buy-in the instant you dropped below it,
   silently, forever. That was generous and it was also the reason nobody would
   ever have bought anything: there is no such thing as running out.

   So busting now means something, and there are three ways past it — wait,
   watch an ad, or buy. What the timer does is guarantee the first one always
   works, so nobody is ever *unable* to play, only unable to play right now.

   The daily is exempt and always will be. It costs nothing, needs no stake and
   cannot be blocked by an empty bankroll. It is the thing that makes the board
   a measure of skill, and the moment somebody can play more of it than you
   because they paid, the board stops meaning anything. That line is the whole
   argument for what this game is, and it is worth more than the revenue. */
const REBUY_HOURS=4;      // the house stakes you again this long after you bust
const REBUY_ADS_DAY=5;    // and you can shortcut that this many times a day
const rebuyReady=()=>!P.rebuyAt||Date.now()>=P.rebuyAt;
const rebuyIn=()=>Math.max(0,(P.rebuyAt||0)-Date.now());
function stakeUp(){
  /* called on every boot and every return to the front door */
  if(P.bankroll>=BUYIN)return false;
  if(!P.rebuyAt){P.rebuyAt=Date.now()+REBUY_HOURS*3600e3;saveP();return false;}
  if(!rebuyReady())return false;
  P.bankroll=BUYIN;P.rebuyAt=0;P.busts=(P.busts||0)+1;saveP();
  return true;
}
function grantStars(n,why){
  P.bankroll+=n;
  if(P.bankroll>=BUYIN)P.rebuyAt=0;
  if(P.bankroll>P.peakBank)P.peakBank=P.bankroll;
  saveP();
  if(why)toast(why,2600);
}

/* A regular arrives with a history. A ladder where every name reads 0-0 looks
   like an empty room, and their rating already implies what the record should
   have been -- so derive it from the name and let real games move it from there. */
const blankRivals=()=>ROSTER.map(r=>{

  const m=42+Math.floor(g()*88);

  const w=Math.round(m*wr*(.92+g()*.16));

    bank:5000+Math.round((r[1]-1500)*7),m:m,w:w,l:m-w};
});

/* seat you against regulars near your own rating -- climbing means harder tables */
/* ── who you sit against ──
   A band that sits a little above your own rating. That is not a trick: playing
   slightly above your level is where people improve, and a player winning about
   half their matches stays at a table far longer than one winning eight in ten.
   Every ranked ladder ever built works this way.

   Three rules keep it honest, and they are written down because the difference
   between this and the version that is not honest is invisible from outside:

     · the lift is a fixed number of rating points. This function never reads
       the bankroll, the purchase history, how close somebody is to running out,
       or anything else about money. `seat.js` proves that by running it against
       a pauper and a whale and asserting the same table comes back.
     · it is capped. "Slightly better" cannot drift into "unbeatable" — nobody
       more than SEAT_CAP above you is ever seated.
     · one seat is always at or below you, so the table is never uniformly
       harder than you are and there is always somebody to beat.

   The ladder screen tells the player the same thing this comment tells us. */
const SEAT_LIFT=60;      // where the middle of the band sits, above you
const SEAT_CAP=220;      // and the most anybody at your table may be above you
function seatRivals(){
  const target=P.rating+SEAT_LIFT, ceiling=P.rating+SEAT_CAP;
  const near=(a,b)=>Math.abs(a.rating-target)-Math.abs(b.rating-target);
  const fit=R.filter(r=>r.rating<=ceiling);
  /* Below the room's own floor the cap cannot be honoured: there are not five
     regulars that low, and inventing one would be worse than admitting it. So
     the table stops being a band and becomes the single gentlest table the room
     can make -- the five weakest regulars, every time, with no draw involved.
     Anyone down here is on a long losing run, and a random draw would sometimes
     hand them somebody three hundred points clear, which is the opposite of
     what the rule is for. The variety returns by itself the moment they climb
     back over the floor and the band below takes over again. */
  if(fit.length<5)return R.slice().sort((a,b)=>a.rating-b.rating).slice(0,5);
  const pool=fit.sort(near).slice(0,9);
  for(let i=pool.length-1;i>0;i--){const j=Math.floor(rnd()*(i+1));
    const t=pool[i];pool[i]=pool[j];pool[j]=t;}
  const seated=pool.slice(0,5);
  /* somebody you can beat, whenever the room contains one. A player below the
     weakest regular has nobody below them and no amount of seating fixes that —
     what fixes it is winning. */
  if(!seated.some(r=>r.rating<=P.rating)){
    const below=R.filter(r=>r.rating<=P.rating&&!seated.includes(r))
      .sort((a,b)=>b.rating-a.rating)[0];
    if(below)seated[seated.length-1]=below;
  }
  return seated;
}
function botParams(r){
  const t=Math.max(0,Math.min(1,(r.rating-1300)/500));
  const so=r.style==="loose"?.12:r.style==="tight"?-.10:0;
  const st=r.style==="tight"?.11:r.style==="loose"?-.11:0;
  return{skill:.50+t*.42,
    optimism:(rnd()*2-1)*(.34-t*.20)+so,
    tight:st+(rnd()*.16-.08),
    baity:r.style==="tricky"?.85:.42+t*.32,
    pace:1400+rnd()*2000};
}

/* ══════════ RATING ══════════ */
/* Placement and margin both fold into one performance score inside the Elo, so
   gains taper as you outgrow the field instead of accruing forever. */
function ratingDelta(place,chips,field,rating){
  const pl=(SEATS-place)/(SEATS-1);
  const mg=Math.max(0,Math.min(1,.5+(chips-BUYIN)/2000));
  const s=.7*pl+.3*mg;
  const e=1/(1+Math.pow(10,(field-rating)/400));
  return Math.round(44*(s-e));
}

/* ══════════ THE PRIZE CHEST ══════════
   Placing top three drops the prize into an open chest. Place again inside 48
   hours and it keeps stacking, up to the cap. Let the window lapse and the
   chest SEALS -- everything inside moves to banked, which is yours for good.
   Nothing that has been won is ever taken back; what expires is the run, not
   the money. A claim window that voids winnings is both a dark pattern and a
   liability under contest rules, and it buys no retention that sealing does

function chestDeadline(){
